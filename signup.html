<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SPACE GLASS - Sign Up</title>

<style>
body { 
  background-color: lightblue; 
  font-family: Arial; 
  display:flex; 
  justify-content:center; 
  align-items:center; 
  height:100vh; 
  margin:0; 
}

/* BLUR EFFECT */
.blur{
  filter: blur(5px);
  pointer-events:none;
}

.container { 
  width:400px; 
  background: rgba(0,0,0,0.1); 
  padding:20px; 
  border-radius:8px; 
  position:relative;
}

h1 { 
  color:white; 
  font-size:14px; 
  text-align:center; 
}

input { 
  width:100%; 
  padding:10px; 
  margin:5px 0; 
  border:none; 
  border-radius:4px; 
}

#submitBtn { 
  width:100%; 
  padding:10px; 
  background:green; 
  color:white; 
  border:none; 
  cursor:pointer; 
}

/* POPUP */
#popup{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:white;
  color:black;
  padding:30px;
  border-radius:10px;
  text-align:center;
  display:none;
  z-index:1000;
  width:300px;
}

#popup button{
  margin-top:15px;
  padding:10px;
  background:#6a0dad;
  color:white;
  border:none;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="container" id="main">
  <h1>PERSONAL DETAILS</h1>

  <input id="name" placeholder="Name">
  <input id="surname" placeholder="Surname">
  <input id="email" type="email" placeholder="Email">
  <input id="cellNumber" placeholder="Cell Number">

  <h1>SECURITY</h1>
  <input id="password" type="password" placeholder="Password">
  <input id="confirmPassword" type="password" placeholder="Confirm Password">

  <button id="submitBtn">SUBMIT</button>
</div>

<!-- POPUP -->
<div id="popup">
  <h2>✅ Account Created</h2>
  <p>You will be redirected to login</p>
  <button onclick="goLogin()">OK</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword } 
from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
import { getDatabase, ref, set } 
from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "tose-ccf8f.firebaseapp.com",
  databaseURL: "https://tose-ccf8f-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "tose-ccf8f"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

const popup = document.getElementById("popup");
const main = document.getElementById("main");

document.getElementById("submitBtn").addEventListener("click", async () => {

  const name = nameInput.value.trim();
  const surname = surnameInput.value.trim();
  const email = emailInput.value.trim().toLowerCase();
  const cellNumber = cellNumberInput.value.trim();
  const password = passwordInput.value;
  const confirmPassword = confirmPasswordInput.value;

  if (!name || !surname || !email || !cellNumber || !password || !confirmPassword) {
    return alert("Fill all fields");
  }

  if (password.length < 8) {
    return alert("Password must be at least 8 characters");
  }

  if (password !== confirmPassword) {
    return alert("Passwords do not match");
  }

  try {
    const cred = await createUserWithEmailAndPassword(auth, email, password);

    await set(ref(db, "users/" + cred.user.uid), {
      uid: cred.user.uid,
      name,
      surname,
      email,
      cellNumber,
      createdAt: Date.now(),
      economy:{ gems:0, lives:0 }
    });

    // SHOW POPUP + BLUR
    main.classList.add("blur");
    popup.style.display = "block";

    // AUTO REDIRECT
    setTimeout(()=>{
      window.location.href="index.html";
    },3000);

  } catch (err) {
    alert(err.message);
  }
});

// FIX: define inputs
const nameInput = document.getElementById("name");
const surnameInput = document.getElementById("surname");
const emailInput = document.getElementById("email");
const cellNumberInput = document.getElementById("cellNumber");
const passwordInput = document.getElementById("password");
const confirmPasswordInput = document.getElementById("confirmPassword");

window.goLogin = () => {
  window.location.href = "index.html";
};
</script>

</body>
  </html>
