<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WALLET</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#001f3f;
  color:white;
  display:flex;
  justify-content:center;
}

#wallet{
  width:400px;
  padding:20px;
}

.tiles{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.tile{
  background:#003366;
  padding:20px;
  text-align:center;
  border-radius:10px;
  cursor:pointer;
}

.tab{
  margin-top:10px;
  background:#001f5c;
  padding:15px;
  text-align:center;
  cursor:pointer;
}
</style>
</head>

<body>

<div id="wallet">

<h2>WALLET</h2>

<div class="tiles">
  <div class="tile">💎 <span id="gems">0</span></div>
  <div class="tile" onclick="buyLife()">❤️ <span id="lives">0</span></div>
</div>

<div class="tab" onclick="buy('R1.50','300 gems','https://pay.ikhokha.com/i-am-lizo-tose/mpr/spl-150')">
R1.50 (300 💎)
</div>

<div class="tab" onclick="buy('R3','900 gems','https://pay.ikhokha.com/i-am-lizo-tose/mpr/spl-900')">
R3 (900 💎)
</div>

<div class="tab" onclick="buy('R5','2 lives + 500 gems','https://pay.ikhokha.com/i-am-lizo-tose/mpr/spl-500')">
R5 (2♥ + 500 💎)
</div>

</div>

<script>

const gemsEl = document.getElementById("gems");
const livesEl = document.getElementById("lives");

const uid = localStorage.getItem("uid");

/* LOAD WALLET */
function load(){
  let data = JSON.parse(localStorage.getItem("wallet_"+uid) || "{}");

  gemsEl.innerText = data.gems || 0;
  livesEl.innerText = data.lives || 0;
}

/* BUY LIFE */
function buyLife(){

  let data = JSON.parse(localStorage.getItem("wallet_"+uid) || "{}");

  if((data.gems || 0) < 300){
    alert("Not enough gems");
    return;
  }

  data.gems -= 300;
  data.lives = (data.lives || 0) + 1;

  localStorage.setItem("wallet_"+uid, JSON.stringify(data));

  load();
}

/* BUY PACK (SEND TO ADMIN + OPEN PAYMENT) */
function buy(price, item, link){

  let requests = JSON.parse(localStorage.getItem("walletRequests") || "[]");

  const newRequest = {
    id: Date.now(),
    uid: uid,
    item: item,
    price: price,
    reference: "PAY-" + Date.now(),
    timestamp: Date.now()
  };

  requests.push(newRequest);
  localStorage.setItem("walletRequests", JSON.stringify(requests));

  window.open(link, "_blank");

  alert("Payment opened. After paying, wait for admin approval.");
}

/* INIT */
load();

</script>

</body>
  </html>
