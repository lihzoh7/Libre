<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SPACE GLASS - Wallet</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7026930699288972"
     crossorigin="anonymous"></script>
<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#001f3f;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

#wallet{
  width:400px;
  background:#003366;
  padding:20px;
  border-radius:12px;
  position:relative;
}

#back{
  position:absolute;
  top:10px;
  left:10px;
  cursor:pointer;
  font-size:18px;
}

h2{
  text-align:center;
  margin-bottom:20px;
}

.stat{
  display:flex;
  justify-content:space-between;
  padding:10px;
  margin-bottom:10px;
  background:#002244;
  border-radius:6px;
}

button{
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-weight:bold;
}

.green{
  background:#2ecc40;
  color:black;
}

.grey{
  background:#555;
  color:#aaa;
  cursor:not-allowed;
}

#popup{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:black;
  padding:15px;
  border-radius:6px;
  display:none;
}
</style>
</head>

<body>

<div id="wallet">

<div id="back" onclick="window.location.href='main-menu.html'">↩ Back</div>

<h2>PLAYER WALLET</h2>

<div class="stat">💎 Gems <span id="gems">0</span></div>
<div class="stat">❤️ Lives <span id="lives">0</span></div>
<div class="stat">🥇 Gold <span id="gold">0</span></div>
<div class="stat">🥈 Silver <span id="silver">0</span></div>
<div class="stat">🥉 Bronze <span id="bronze">0</span></div>

<button onclick="deposit()">Deposit R10</button>
<button id="convertGoldBtn">Convert Gold → 5 Lives</button>
<button id="convertSilverBtn">Convert Silver → 3 Lives</button>
<button id="convertBronzeBtn">Convert Bronze → 2 Lives</button>

</div>

<div id="popup"></div>

<script>
const API_BASE = "https://payfast-backend-475447495901.europe-west1.run.app";

const uid = localStorage.getItem("uid");
if(!uid){
  window.location.href = "index.html";
}

let economy = {};

async function loadEconomy(){
  const res = await fetch(`${API_BASE}/economy/user/economy?uid=${uid}`);
  const data = await res.json();
  economy = data;
  updateUI();
}

function updateUI(){
  document.getElementById("gems").innerText = economy.gems || 0;
  document.getElementById("lives").innerText = economy.lives || 0;
  document.getElementById("gold").innerText = economy.gold || 0;
  document.getElementById("silver").innerText = economy.silver || 0;
  document.getElementById("bronze").innerText = economy.bronze || 0;
}

document.getElementById("buyLifeBtn").onclick = async () => {
  const res = await fetch(`${API_BASE}/economy/convert-gems`, {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ uid })
  });

  const data = await res.json();
  alert(data.error || "Life Purchased!");
  loadEconomy();
};
async function deposit(){
  const res = await fetch(`${API_BASE}/payments/create`, {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({
      uid,
      amount: 10
    })
  });

  const data = await res.json();

  if(data.paylinkUrl){
    window.location.href = data.paylinkUrl;
  } else {
    alert("Payment failed");
  }
}

async function convertMedal(type){
  const res = await fetch(`${API_BASE}/economy/convert-medal`, {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ uid, type })
  });

  const data = await res.json();
  alert(data.error || "Converted!");
  loadEconomy();
}

loadEconomy();
</script>
</body>
</html>
