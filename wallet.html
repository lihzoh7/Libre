<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WALLET</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #001f3f;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center; 
  min-height: 100vh;
}

#wallet {
  width: 500px; /* Slightly widened to accommodate the "SPECIAL ENDED" text */
  padding: 20px;
  text-align: center; 
}

/* Ice-colored Winter Special Header */
.winter-header {
  color: #a5f3fc; /* Icy light blue/cyan */
  font-size: 26px;
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: 2px;
  margin-bottom: 5px;
  text-shadow: 0 0 10px rgba(165, 243, 252, 0.5);
}

h2 {
  font-size: 32px; 
  margin-top: 0;
  margin-bottom: 30px;
}

.tiles {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
  margin-bottom: 20px;
}

.tile {
  background: #003366;
  padding: 25px; 
  text-align: center;
  border-radius: 10px;
  font-size: 24px; 
  font-weight: bold;
}

/* Flexbox wrapper inside tab to position content left and right */
.tab {
  margin-top: 15px;
  background: #001f5c;
  padding: 20px; 
  cursor: pointer;
  border-radius: 8px; 
  font-size: 16px;     
  font-weight: bold;   
  border: 1px solid #004080; 
  transition: all 0.3s;
  display: flex;
  justify-content: space-between; /* Pushes "SPECIAL ENDED" to the far right */
  align-items: center;
}

.tab:hover:not(.disabled) {
  background: #003366; 
}

/* Disabled/Grayed Out State */
.tab.disabled {
  background: #444444 !important;
  border-color: #555555 !important;
  color: #888888 !important;
  cursor: not-allowed;
}

.special-ended-text {
  color: #ff4444; /* Bright red to stand out */
  font-size: 14px;
  font-weight: bold;
}

.wallet-notice {
  font-size: 14px;
  color: #ffcc00; 
  font-weight: bold;
  letter-spacing: 0.5px;
  line-height: 1.5;
  margin-top: 20px;
  padding: 10px;
  background: rgba(0, 0, 0, 0.2); 
  border-radius: 5px;
}  
</style>
</head>

<body>

<div id="wallet">
  <!-- Upper Center Icy Header -->
  <div class="winter-header">WINTER SPECIAL</div>
  <h2>WALLET</h2>

  <div class="tiles">
    <div class="tile">💎 <span id="gems">0</span></div>
    <div class="tile" id="buyLife" style="cursor:pointer;">❤️ <span id="lives">0</span></div>
  </div>

  <!-- Special Offer Tabs with Unique IDs for Click Counting -->
  <div id="tier_r050" class="tab" onclick="buyDirect('r050', 150, 1)">
    <span>R0.50 (1❤️+150💎) CLICK TO BUY</span>
    <span class="special-ended-text" style="display:none;">SPECIAL ENDED</span>
  </div>

  <div id="tier_r150" class="tab" onclick="buyDirect('r150', 350, 2)">
    <span>R1.50 (2❤️+350💎) CLICK TO BUY</span>
    <span class="special-ended-text" style="display:none;">SPECIAL ENDED</span>
  </div>

  <div id="tier_r300" class="tab" onclick="buyDirect('r3', 400, 5)">
    <span>R3 (5❤️+400💎) CLICK TO BUY</span>
    <span class="special-ended-text" style="display:none;">SPECIAL ENDED</span>
  </div>

  <br><br>
  <div class="wallet-notice">
    Wallet Can Only Be Topped-Up Between Times 07:00 TO 20:00
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getDatabase, ref, get, set, onValue } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBqJTLjxhZBCsvjrTH_cG0fkXlElG6BqTg",
  authDomain: "tose-ccf8f.firebaseapp.com",
  databaseURL: "https://tose-ccf8f-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "tose-ccf8f",
  storageBucket: "tose-ccf8f.appspot.com",
  messagingSenderId: "475447495901",
  appId: "1:475447495901:web:9189276a162a3680afdf34"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

const gemsEl = document.getElementById("gems");
const livesEl = document.getElementById("lives");

let uid; 
let userClicks = { r050: 0, r150: 0, r3: 0 }; // Local cache of click data

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    location.href = "index.html";
    return;
  }

  const adminSnap = await get(ref(db, "admins/" + user.uid));
  if (adminSnap.exists()) {
    location.href = "admin.html";
    return;
  }

  uid = user.uid;
  
  // 1. Listen to wallet balance
  loadWallet();
  
  // 2. Listen to this user's dynamic special special offer click counters
  listenToSpecialLimits();
});

function loadWallet(){
  onValue(ref(db, "wallet/" + uid), (snap) => {
    const data = snap.val() || {};
    gemsEl.innerText = data.gems || 0;
    livesEl.innerText = data.lives || 0;
  });
}

// Monitors real-time click tracking in Firebase so refreshing doesn't reset limits
function listenToSpecialLimits() {
  onValue(ref(db, "specialOffers/" + uid), (snap) => {
    const data = snap.val() || { r050: 0, r150: 0, r3: 0 };
    userClicks = data;
    
    checkAndDisableTier("r050", "tier_r050");
    checkAndDisableTier("r150", "tier_r150");
    checkAndDisableTier("r3", "tier_r300");
  });
}

// Helper to look at counts, switch on CSS gray out classes, and reveal right-aligned text
function checkAndDisableTier(tierKey, elementId) {
  const element = document.getElementById(elementId);
  const count = userClicks[tierKey] || 0;
  
  if (count >= 2) {
    element.classList.add("disabled");
    // Find the child ending notice span and make it visible
    element.querySelector(".special-ended-text").style.display = "inline";
  }
}

/* NO APPROVAL DIRECT BUY LOGIC */
window.buyDirect = async function(tierKey, gemsToAdd, livesToAdd) {
  // Guard clause checking if they already maximum loaded this item
  if ((userClicks[tierKey] || 0) >= 2) {
    alert("This special offer has ended for you!");
    return;
  }

  // Get current balances safely
  const walletSnap = await get(ref(db, "wallet/" + uid));
  const currentWallet = walletSnap.val() || { gems: 0, lives: 0 };
  
  let currentGems = currentWallet.gems || 0;
  let currentLives = currentWallet.lives || 0;

  // Increment total calculations directly without admin nodes
  const newGems = currentGems + gemsToAdd;
  const newLives = currentLives + livesToAdd;
  const newClickCount = (userClicks[tierKey] || 0) + 1;

  // Update wallet directly
  await set(ref(db, "wallet/" + uid + "/gems"), newGems);
  await set(ref(db, "wallet/" + uid + "/lives"), newLives);
  
  // Save updated click metrics directly down to user node paths
  await set(ref(db, "specialOffers/" + uid + "/" + tierKey), newClickCount);

  alert(`⚡ Winter Special Applied! Added +${gemsToAdd} 💎 and +${livesToAdd} ❤️ instantly.`);
};

/* GEM TO LIFE TRADING (Fixed verification bug logic to 300) */
document.getElementById("buyLife").onclick = async () => {
  const snap = await get(ref(db, "wallet/" + uid));
  const data = snap.val() || {};

  let gems = data.gems || 0;
  let lives = data.lives || 0;

  if (gems < 300) {
    alert("Not enough gems (300 💎 = 1 ❤️)");
    return;
  }

  await set(ref(db, "wallet/" + uid + "/gems"), gems - 300);
  await set(ref(db, "wallet/" + uid + "/lives"), lives + 1);

  alert("+1 ❤️ purchased with gems!");
};
</script>

</body>
</html>
