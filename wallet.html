<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WALLET</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #001f3f;
  color: white;
  display: flex;
  flex-direction: column; 
  justify-content: center;
  align-items: center; 
  min-height: 100vh;
}

#wallet {
  width: 500px; 
  padding: 20px;
  text-align: center; 
}

.winter-header {
  color: #00f0ff;
  font-size: 28px;
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: 2px;
  margin-bottom: 5px;
  text-shadow: 0 0 10px rgba(0, 240, 255, 0.6);
}

.tiles {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
  margin-bottom: 20px;
}

.tile {
  background: #003366;
  padding: 25px; 
  text-align: center;
  border-radius: 10px;
  font-size: 24px; 
  font-weight: bold;
}

#buyLife {
  cursor: pointer;
}

.tab-container {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 15px;
  background: #001f5c;
  padding: 15px 20px;
  border-radius: 8px;
  border: 1px solid #004080;
  transition: background 0.3s;
}

.click-count {
  font-size: 20px;
  font-weight: bold;
  color: #00f0ff;
  background: rgba(0, 240, 255, 0.1);
  padding: 5px 12px;
  border-radius: 5px;
  margin-right: 10px;
}

.tab-btn {
  flex-grow: 1;
  text-align: center;
  cursor: pointer;
  font-size: 16px;      
  font-weight: bold;   
}

.status-text {
  font-size: 14px;
  font-weight: bold;
  color: #ff3333;
  margin-left: 10px;
  letter-spacing: 0.5px;
}

.tab-container:hover:not(.disabled) {
  background: #003366; 
}

/* Grayed out disabled style */
.tab-container.disabled {
  background: #333333 !important;
  border-color: #555555 !important;
  cursor: not-allowed !important;
  opacity: 0.5;
}
.tab-container.disabled .tab-btn {
  cursor: not-allowed !important;
  pointer-events: none; /* Disables HTML clicking entirely */
}

h2 {
  font-size: 32px; 
  margin-top: 5px;
  margin-bottom: 25px;
}

.wallet-notice {
  font-size: 14px;
  color: #ffcc00; 
  font-weight: bold;
  letter-spacing: 0.5px;
  line-height: 1.5;
  margin-top: 20px;
  padding: 10px;
  background: rgba(0, 0, 0, 0.2); 
  border-radius: 5px;
}  

/* Styling for the new Top Up link */
.topup-link {
  display: inline-block;
  margin-top: 15px;
  color: #ffcc00;
  text-decoration: none;
  font-weight: bold;
  font-size: 16px;
  letter-spacing: 1px;
  padding: 10px 20px;
  border: 2px solid #ffcc00;
  border-radius: 5px;
  transition: all 0.3s ease;
  text-shadow: 0 0 5px rgba(255, 204, 0, 0.4);
  box-shadow: 0 0 10px rgba(255, 204, 0, 0.1);
}

.topup-link:hover {
  background: #ffcc00;
  color: #001f3f;
  box-shadow: 0 0 15px rgba(255, 204, 0, 0.6);
  text-shadow: none;
}
</style>
</head>

<body>

<div class="winter-header">WINTER SPECIAL</div>

<div id="wallet">
<h2>WALLET</h2>

<div class="tiles">
  <div class="tile">💎 <span id="gems">0</span></div>
  <div class="tile" id="buyLife">❤️ <span id="lives">0</span></div>
</div>

<div class="tab-container" id="container-tier1">
  <div class="click-count" id="count-tier1">2</div>
  <div class="tab-btn" onclick="processInstantPromo('tier1', 150, 1)">R0.50 (1❤️+150💎) CLICK TO LOAD</div>
  <div class="status-text" id="status-tier1"></div>
</div>

<div class="tab-container" id="container-tier2">
  <div class="click-count" id="count-tier2">2</div>
  <div class="tab-btn" onclick="processInstantPromo('tier2', 350, 2)">R1.50 (2❤️+350💎) CLICK TO LOAD</div>
  <div class="status-text" id="status-tier2"></div>
</div>

<div class="tab-container" id="container-tier3">
  <div class="click-count" id="count-tier3">2</div>
  <div class="tab-btn" onclick="processInstantPromo('tier3', 400, 5)">R3 (5❤️+400💎) CLICK TO LOAD</div>
  <div class="status-text" id="status-tier3"></div>
</div>

<br><br>
<div class="wallet-notice">
  Wallet Can Only Be Topped-Up Between Times 07:00 TO 20:00
</div>

<a href="originalwallet.html" class="topup-link">TOP UP (FOR A FEE)</a>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getDatabase, ref, get, set, onValue } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBqJTLjxhZBCsvjrTH_cG0fkXlElG6BqTg",
  authDomain: "tose-ccf8f.firebaseapp.com",
  databaseURL: "https://tose-ccf8f-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "tose-ccf8f",
  storageBucket: "tose-ccf8f.appspot.com",
  messagingSenderId: "475447495901",
  appId: "1:475447495901:web:9189276a162a3680afdf34"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

const gemsEl = document.getElementById("gems");
const livesEl = document.getElementById("lives");

let uid; 

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    location.href = "index.html";
    return;
  }

  const adminSnap = await get(ref(db, "admins/" + user.uid));
  if (adminSnap.exists()) {
    location.href = "admin.html";
    return;
  }

  uid = user.uid;

  loadWallet();
  listenToPromoLimits();
});

function loadWallet(){
  onValue(ref(db, "wallet/" + uid), (snap) => {
    const data = snap.val() || {};
    gemsEl.innerText = data.gems || 0;
    livesEl.innerText = data.lives || 0;
  });
}

/* REAL-TIME CLICK MONITOR */
function listenToPromoLimits() {
  onValue(ref(db, "winter_special_clicks/" + uid), (snap) => {
    const clicks = snap.val() || {};
    
    updateTileUI("tier1", clicks.tier1 || 0);
    updateTileUI("tier2", clicks.tier2 || 0);
    updateTileUI("tier3", clicks.tier3 || 0);
  });
}

function updateTileUI(tierId, clickCount) {
  const container = document.getElementById("container-" + tierId);
  const countBadge = document.getElementById("count-" + tierId);
  const statusLabel = document.getElementById("status-" + tierId);

  // Read backup local storage count just in case network is slow
  const localBackupCount = parseInt(localStorage.getItem(`promo_${uid}_${tierId}`) || "0", 10);
  const finalCount = Math.max(clickCount, localBackupCount);

  let remaining = 2 - finalCount;

  if (remaining === 2) {
    countBadge.innerText = "2";
    countBadge.style.display = "block";
    statusLabel.innerText = "";
    container.classList.remove("disabled");
  } else if (remaining === 1) {
    countBadge.innerText = "1";
    countBadge.style.display = "block";
    statusLabel.innerText = "";
    container.classList.remove("disabled");
  } else {
    // 0 remaining clicks - completely lock tile
    countBadge.style.display = "none";
    statusLabel.innerText = "SPECIAL ENDED";
    container.classList.add("disabled");
  }
}

/* REVISED FORCE-CLAMPED PURCHASE PROCESSOR */
window.processInstantPromo = async function(tierId, gemsToAdd, livesToAdd) {
  if (!uid) return;

  // 1. Check local backup block first for instant feedback
  const localCount = parseInt(localStorage.getItem(`promo_${uid}_${tierId}`) || "0", 10);
  if (localCount >= 2) {
    alert("Special Offer Ended!");
    return;
  }

  // 2. Fetch fresh live value from Cloud Database to verify
  const clickSnap = await get(ref(db, "winter_special_clicks/" + uid + "/" + tierId));
  const serverClicks = clickSnap.val() || 0;

  if (serverClicks >= 2) {
    localStorage.setItem(`promo_${uid}_${tierId}`, "2"); // sync backup
    updateTileUI(tierId, 2);
    alert("Special Offer Ended!");
    return;
  }

  // Calculate next click step value
  const nextClickValue = serverClicks + 1;

  // 3. Immediately set local storage backup shield to block double clicks
  localStorage.setItem(`promo_${uid}_${tierId}`, nextClickValue.toString());
  updateTileUI(tierId, nextClickValue);

  // 4. Fetch wallet data and apply additions
  const walletSnap = await get(ref(db, "wallet/" + uid));
  const walletData = walletSnap.val() || {};
  
  let currentGems = walletData.gems || 0;
  let currentLives = walletData.lives || 0;

  // Save the new balances down to Firebase
  await set(ref(db, "wallet/" + uid + "/gems"), currentGems + gemsToAdd);
  await set(ref(db, "wallet/" + uid + "/lives"), currentLives + livesToAdd);

  // Save the updated click counter tracking node down to Firebase
  await set(ref(db, "winter_special_clicks/" + uid + "/" + tierId), nextClickValue);

  alert(`Loaded +${gemsToAdd} 💎 and +${livesToAdd} ❤️!`);
};

/* GEMS CONVERSION */
document.getElementById("buyLife").onclick = async () => {
  const snap = await get(ref(db, "wallet/" + uid));
  const data = snap.val() || {};

  let gems = data.gems || 0;
  let lives = data.lives || 0;

  if (gems < 300) { 
    alert("Not enough gems (300 💎 = 1 ❤️)");
    return;
  }

  await set(ref(db, "wallet/" + uid + "/gems"), gems - 300);
  await set(ref(db, "wallet/" + uid + "/lives"), lives + 1);

  alert("+1 ❤️ purchased!");
};
</script>

</body>
</html>
