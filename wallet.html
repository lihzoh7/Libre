<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WALLET</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #001f3f;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center; 
  min-height: 100vh;
}

#wallet {
  width: 450px; 
  padding: 20px;
  text-align: center; 
}

/* New Winter Special Header Style */
.winter-header {
  color: #a5f3fc; /* Icy blue / cyan color */
  font-size: 28px;
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: 2px;
  margin-bottom: 5px;
  text-shadow: 0 0 10px rgba(165, 243, 252, 0.6);
}

.tiles {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
  margin-bottom: 20px;
}

.tile {
  background: #003366;
  padding: 25px; 
  text-align: center;
  border-radius: 10px;
  font-size: 24px; 
  font-weight: bold;
}

/* Flex layout to align the tile text and the "SPECIAL ENDED" text */
.tab {
  margin-top: 15px;
  background: #001f5c;
  padding: 20px; 
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
  border-radius: 8px; 
  font-size: 16px;     
  font-weight: bold;   
  border: 1px solid #004080; 
  transition: all 0.3s;
}

.tab:hover {
  background: #003366; 
}

/* Styling for the disabled, greyed-out packages */
.tab.disabled {
  background: #334155 !important;
  color: #94a3b8 !important;
  border: 1px solid #475569 !important;
  cursor: not-allowed;
  pointer-events: none;
}

.ended-text {
  color: #ef4444; /* Bright red */
  font-size: 12px;
  font-weight: bold;
  letter-spacing: 1px;
}

h2 {
  font-size: 32px; 
  margin-top: 5px;
  margin-bottom: 30px;
}

.wallet-notice {
  font-size: 14px;
  color: #ffcc00; 
  font-weight: bold;
  letter-spacing: 0.5px;
  line-height: 1.5;
  margin-top: 10px;
  padding: 10px;
  background: rgba(0, 0, 0, 0.2); 
  border-radius: 5px;
}  
</style>
</head>

<body>

<div id="wallet">
<div class="winter-header">❄️ WINTER SPECIAL ❄️</div>
<h2>WALLET</h2>

<div class="tiles">
  <div class="tile">💎 <span id="gems">0</span></div>
  <div class="tile" id="buyLife" style="cursor:pointer;">❤️ <span id="lives">0</span></div>
</div>

<div id="pkg-half" class="tab" onclick="claimSpecial('half', 150, 1)">
  <span>R0.50 (1❤️+150💎) CLICK TO CLAIM</span>
  <span id="ended-half" class="ended-text" style="display:none;">SPECIAL ENDED</span>
</div>

<div id="pkg-onehalf" class="tab" onclick="claimSpecial('onehalf', 350, 2)">
  <span>R1.50 (2❤️+350💎) CLICK TO CLAIM</span>
  <span id="ended-onehalf" class="ended-text" style="display:none;">SPECIAL ENDED</span>
</div>

<div id="pkg-three" class="tab" onclick="claimSpecial('three', 400, 5)">
  <span>R3.00 (5❤️+400💎) CLICK TO CLAIM</span>
  <span id="ended-three" class="ended-text" style="display:none;">SPECIAL ENDED</span>
</div>

<br><br>
<div class="wallet-notice">
  Wallet Can Only Be Topped-Up Between Times 07:00 TO 20:00
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getDatabase, ref, get, set, onValue } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBqJTLjxhZBCsvjrTH_cG0fkXlElG6BqTg",
  authDomain: "tose-ccf8f.firebaseapp.com",
  databaseURL: "https://tose-ccf8f-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "tose-ccf8f",
  storageBucket: "tose-ccf8f.appspot.com",
  messagingSenderId: "475447495901",
  appId: "1:475447495901:web:9189276a162a3680afdf34"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

const gemsEl = document.getElementById("gems");
const livesEl = document.getElementById("lives");

let uid; 

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    location.href = "index.html";
    return;
  }

  const adminSnap = await get(ref(db, "admins/" + user.uid));
  if (adminSnap.exists()) {
    location.href = "admin.html";
    return;
  }

  uid = user.uid;
  load(); 
});

/* LOAD WALLET AND CLICK LIMITS */
function load(){
  // Live listener for user's balance
  onValue(ref(db, "wallet/" + uid), (snap) => {
    const data = snap.val() || {};
    gemsEl.innerText = data.gems || 0;
    livesEl.innerText = data.lives || 0;
  });

  // Live listener for tracking special promotional clicks
  onValue(ref(db, "winterSpecialClicks/" + uid), (snap) => {
    const usage = snap.val() || { half: 0, onehalf: 0, three: 0 };
    
    checkLimit("half", usage.half);
    checkLimit("onehalf", usage.onehalf);
    checkLimit("three", usage.three);
  });
}

// Helper to grey out buttons and display "SPECIAL ENDED"
function checkLimit(pkgId, count) {
  const btn = document.getElementById("pkg-" + pkgId);
  const endedLabel = document.getElementById("ended-" + pkgId);
  
  if (count >= 2) {
    btn.classList.add("disabled");
    endedLabel.style.display = "inline";
  } else {
    btn.classList.remove("disabled");
    endedLabel.style.display = "none";
  }
}

/* NEW INSTANT CLAIM FUNCTION (REPLACES OLD BUY LINK FUNCTION) */
window.claimSpecial = async function(pkgId, promoGems, promoLives) {
  // 1. Get current usage count
  const usageSnap = await get(ref(db, "winterSpecialClicks/" + uid));
  const usage = usageSnap.val() || { half: 0, onehalf: 0, three: 0 };
  
  if (usage[pkgId] >= 2) {
    alert("You have already used your 2 claims for this package!");
    return;
  }

  // 2. Fetch current wallet balances securely
  const walletSnap = await get(ref(db, "wallet/" + uid));
  const walletData = walletSnap.val() || { gems: 0, lives: 0 };

  let currentGems = walletData.gems || 0;
  let currentLives = walletData.lives || 0;

  // 3. Update balances instantly without admin approval
  await set(ref(db, "wallet/" + uid + "/gems"), currentGems + promoGems);
  await set(ref(db, "wallet/" + uid + "/lives"), currentLives + promoLives);

  // 4. Increment the click counter in database
  usage[pkgId] = (usage[pkgId] || 0) + 1;
  await set(ref(db, "winterSpecialClicks/" + uid), usage);

  alert(`Successfully loaded +${promoGems} 💎 and +${promoLives} ❤️!`);
};

/* GEM TO LIFE CONVERSION (300 gems = 1 life) */
document.getElementById("buyLife").onclick = async () => {
  const snap = await get(ref(db, "wallet/" + uid));
  const data = snap.val() || {};

  let gems = data.gems || 0;
  let lives = data.lives || 0;

  if (gems < 300) { // Fixed typo here to match your logic statement alert
    alert("Not enough gems (300 💎 = 1 ❤️)");
    return;
  }

  await set(ref(db, "wallet/" + uid + "/gems"), gems - 300);
  await set(ref(db, "wallet/" + uid + "/lives"), lives + 1);

  alert("+1 ❤️ purchased!");
};
</script>

</body>
</html>
