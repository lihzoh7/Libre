<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WALLET</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #001f3f;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center; 
  min-height: 100vh;
}

#wallet {
  width: 450px; 
  padding: 20px;
  text-align: center; 
}

/* Icy Cyan Header for the Winter Special */
.special-header {
  color: #a5f3fc; /* Deep icy/cyan color */
  font-size: 26px;
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: 2px;
  margin-bottom: 5px;
  text-shadow: 0 0 10px rgba(165, 243, 252, 0.5);
}

h2 {
  font-size: 32px; 
  margin-top: 0;
  margin-bottom: 25px;
}

.tiles {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
  margin-bottom: 20px;
}

.tile {
  background: #003366;
  padding: 25px; 
  text-align: center;
  border-radius: 10px;
  font-size: 24px; 
  font-weight: bold;
  cursor: pointer; /* Keeps the Gem-to-Life click clear */
}

/* Flex layout for tabs to place "SPECIAL ENDED" nicely on the right */
.tab {
  margin-top: 15px;
  background: #001f5c;
  padding: 20px; 
  display: flex;
  justify-content: space-between; /* Pushes text to left and status to right */
  align-items: center;
  cursor: pointer;
  border-radius: 8px; 
  font-size: 16px;     
  font-weight: bold;   
  border: 1px solid #004080; 
  transition: all 0.3s;
}

.tab:hover:not(.disabled) {
  background: #003366; 
}

/* Grayed out, unclickable style when limit is reached */
.tab.disabled {
  background: #334155 !important;
  color: #94a3b8 !important;
  border: 1px solid #475569 !important;
  cursor: not-allowed;
}

.status-text {
  font-size: 14px;
}

.ended-text {
  color: #ef4444; /* Red color for Special Ended */
  font-weight: bold;
  font-size: 13px;
}

.wallet-notice {
  font-size: 14px;
  color: #ffcc00; 
  font-weight: bold;
  letter-spacing: 0.5px;
  line-height: 1.5;
  margin-top: 20px;
  padding: 10px;
  background: rgba(0, 0, 0, 0.2); 
  border-radius: 5px;
}  
</style>
</head>

<body>

<div id="wallet">
  <!-- Upper Center Winter Special Header -->
  <div class="special-header">❄️ Winter Special ❄️</div>
  <h2>WALLET</h2>

  <div class="tiles">
    <div class="tile">💎 <span id="gems">0</span></div>
    <!-- Fixed click check from 100 to 300 gems -->
    <div class="tile" id="buyLife">❤️ <span id="lives">0</span></div>
  </div>

  <!-- R0.50 Tile -->
  <div id="tile-050" class="tab" onclick="buySpecial('050', 150, 1, 'https://pay.ikhokha.com/i-am-lizo-tose/mpr/slide-1')">
    <span class="label-text">R0.50 (1❤️+150💎) CLICK TO BUY</span>
    <span id="status-050" class="status-text">(0/2)</span>
  </div>

  <!-- R1.50 Tile -->
  <div id="tile-150" class="tab" onclick="buySpecial('150', 350, 2, 'https://pay.ikhokha.com/i-am-lizo-tose/mpr/slide-2')">
    <span class="label-text">R1.50 (2❤️+350💎) CLICK TO BUY</span>
    <span id="status-150" class="status-text">(0/2)</span>
  </div>

  <!-- R3.00 Tile -->
  <div id="tile-300" class="tab" onclick="buySpecial('300', 400, 5, 'https://pay.ikhokha.com/i-am-lizo-tose/mpr/slide-3')">
    <span class="label-text">R3 (5❤️+400💎) CLICK TO BUY</span>
    <span id="status-300" class="status-text">(0/2)</span>
  </div>

  <div class="wallet-notice">
    Wallet Can Only Be Topped-Up Between Times 07:00 TO 20:00
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getDatabase, ref, get, set, onValue } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBqJTLjxhZBCsvjrTH_cG0fkXlElG6BqTg",
  authDomain: "tose-ccf8f.firebaseapp.com",
  databaseURL: "https://tose-ccf8f-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "tose-ccf8f",
  storageBucket: "tose-ccf8f.appspot.com",
  messagingSenderId: "475447495901",
  appId: "1:475447495901:web:9189276a162a3680afdf34"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

const gemsEl = document.getElementById("gems");
const livesEl = document.getElementById("lives");

let uid;
let currentGems = 0;
let currentLives = 0;
let claims = { "050": 0, "150": 0, "300": 0 };

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    location.href = "index.html";
    return;
  }

  const adminSnap = await get(ref(db, "admins/" + user.uid));
  if (adminSnap.exists()) {
    location.href = "admin.html";
    return;
  }

  uid = user.uid;
  loadWallet(); 
});

/* REAL-TIME WALLET LISTENER */
function loadWallet() {
  onValue(ref(db, "wallet/" + uid), (snap) => {
    const data = snap.val() || {};
    
    currentGems = data.gems || 0;
    currentLives = data.lives || 0;
    
    // Extract claim counts safely
    const dbClaims = data.specialClaims || {};
    claims["050"] = dbClaims["050"] || 0;
    claims["150"] = dbClaims["150"] || 0;
    claims["300"] = dbClaims["300"] || 0;

    // Update Text Fields
    gemsEl.innerText = currentGems;
    livesEl.innerText = currentLives;

    // Update UI Elements for the special tiles
    updateTileUI("050");
    updateTileUI("150");
    updateTileUI("300");
  });
}

/* UPDATE TILES VISUALLY BASED ON CLAIMS */
function updateTileUI(tileId) {
  const tileEl = document.getElementById("tile-" + tileId);
  const statusEl = document.getElementById("status-" + tileId);
  const count = claims[tileId];

  if (count >= 2) {
    tileEl.classList.add("disabled");
    statusEl.innerHTML = '<span class="ended-text">SPECIAL ENDED</span>';
  } else {
    tileEl.classList.remove("disabled");
    statusEl.innerText = "(" + count + "/2)";
  }
}

/* INSTANT AUTO-LOAD TRANSACTION */
window.buySpecial = async function(tileId, gemsToAdd, livesToAdd, paymentLink) {
  // Guard clause: stop execution if already claimed twice
  if (claims[tileId] >= 2) {
    alert("You have already reached the maximum limit for this special item!");
    return;
  }

  // 1. Open the payment gateway link immediately
  window.open(paymentLink, "_blank");

  // 2. Increment local tracking value
  const finalClaimsCount = claims[tileId] + 1;

  // 3. Update balances and claim counter directly into Firebase (No Admin Needed!)
  await set(ref(db, "wallet/" + uid + "/gems"), currentGems + gemsToAdd);
  await set(ref(db, "wallet/" + uid + "/lives"), currentLives + livesToAdd);
  await set(ref(db, "wallet/" + uid + "/specialClaims/" + tileId), finalClaimsCount);

  alert("Special loaded successfully! +" + gemsToAdd + " 💎 and +" + livesToAdd + " ❤️ added to your wallet.");
};

/* IN-APP GEM CONVERSION (300 GEMS -> 1 LIFE) */
document.getElementById("buyLife").onclick = async () => {
  if (currentGems < 300) { // Fixed balance constraint check to match costs
    alert("Not enough gems (300 💎 = 1 ❤️)");
    return;
  }

  await set(ref(db, "wallet/" + uid + "/gems"), currentGems - 300);
  await set(ref(db, "wallet/" + uid + "/lives"), currentLives + 1);

  alert("+1 ❤️ purchased with gems!");
};
</script>

</body>
</html>
