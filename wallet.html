<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WALLET</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#001f3f;
  color:white;
  display:flex;
  justify-content:center;
}
#wallet{
  width:400px;
  padding:20px;
}
.tiles{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.tile{
  background:#003366;
  padding:20px;
  text-align:center;
  border-radius:10px;
}
.tab{
  margin-top:10px;
  background:#001f5c;
  padding:15px;
  text-align:center;
  cursor:pointer;
}
</style>
</head>

<body>

<div id="wallet">
<h2>WALLET</h2>

<div class="tiles">
  <div class="tile">💎 <span id="gems">0</span></div>
  <div class="tile">❤️ <span id="lives">0</span></div>
</div>

<div class="tab" onclick="buy('R1.50','300 gems','https://pay.ikhokha.com/i-am-lizo-tose/mpr/spl-150')">
R1.50 (300 💎)
</div>

<div class="tab" onclick="buy('R3','900 gems','https://pay.ikhokha.com/i-am-lizo-tose/mpr/spl-900')">
R3 (900 💎)
</div>

<div class="tab" onclick="buy('R5','2 lives + 500 gems','https://pay.ikhokha.com/i-am-lizo-tose/mpr/spl-500')">
R5 (2♥ + 500 💎)
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getDatabase, ref, push, get } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";
import { getAuth } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBqJTLjxhZBCsvjrTH_cG0fkXlElG6BqTg",
  authDomain: "tose-ccf8f.firebaseapp.com",
  projectId: "tose-ccf8f"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

const gemsEl = document.getElementById("gems");
const livesEl = document.getElementById("lives");

const uid = localStorage.getItem("uid");

/* LOAD WALLET */
async function load(){
  const snap = await get(ref(db,"wallet/"+uid));
  const data = snap.val() || {};

  gemsEl.innerText = data.gems || 0;
  livesEl.innerText = data.lives || 0;
}

/* BUY */
window.buy = function(price,item,link){

  // ✅ OPEN FIRST (this fixes your issue)
  window.open(link, "_blank");

  // THEN do Firebase stuff
  sendRequest(price,item);
};

async function sendRequest(price,item){

  const userSnap = await get(ref(db,"users/"+uid));
  const user = userSnap.val() || {};

  const request = {
    uid,
    name: user.name || "",
    surname: user.surname || "",
    email: user.email || "",
    item,
    price,
    status: "pending",
    timestamp: Date.now()
  };

  await push(ref(db,"walletRequests"), request);

  alert("Payment opened. Wait for approval.");
}

load();
</script>

</body>
</html>
