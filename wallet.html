<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WALLET</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #001f3f;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center; 
  min-height: 100vh;
}

#wallet {
  width: 500px; /* Slightly wider to accommodate the "SPECIAL ENDED" text */
  padding: 20px;
  text-align: center; 
}

/* Winter Special Heading styling */
.special-heading {
  color: #b0e0e6; /* Icy powder blue color */
  font-size: 28px;
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: 2px;
  margin-bottom: 5px;
}

h2 {
  font-size: 32px; 
  margin-top: 0;
  margin-bottom: 30px;
}

.tiles {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
  margin-bottom: 20px;
}

.tile {
  background: #003366;
  padding: 25px; 
  text-align: center;
  border-radius: 10px;
  font-size: 24px; 
  font-weight: bold;
}

/* Flexbox container for tab to push "SPECIAL ENDED" to the right side */
.tab {
  margin-top: 15px;
  background: #001f5c;
  padding: 20px; 
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
  border-radius: 8px; 
  font-size: 16px;     
  font-weight: bold;   
  border: 1px solid #004080; 
  transition: all 0.3s;
}

.tab:hover {
  background: #003366; 
}

/* Disabled/Greyed out tile state */
.tab.disabled {
  background: #333333 !important;
  color: #888888 !important;
  border-color: #555555 !important;
  cursor: not-allowed;
  pointer-events: none; /* Disables clicking entirely */
}

.ended-text {
  color: #ff4d4d; /* Reddish text for attention */
  font-size: 14px;
  font-weight: bold;
}

.wallet-notice {
  font-size: 14px;
  color: #ffcc00; 
  font-weight: bold;
  letter-spacing: 0.5px;
  line-height: 1.5;
  margin-top: 10px;
  padding: 10px;
  background: rgba(0, 0, 0, 0.2); 
  border-radius: 5px;
}  
</style>
</head>

<body>

<div id="wallet">
  <div class="special-heading">WINTER SPECIAL</div>
  <h2>WALLET</h2>

  <div class="tiles">
    <div class="tile">💎 <span id="gems">0</span></div>
    <div class="tile" id="buyLife">❤️ <span id="lives">0</span></div>
  </div>

  <div id="tile-r050" class="tab" onclick="claimSpecial('r050', 150, 1)">
    <span>R0.50 (1❤️+150💎) CLICK TO BUY</span>
    <span class="ended-text" id="status-r050"></span>
  </div>

  <div id="tile-r150" class="tab" onclick="claimSpecial('r150', 350, 2)">
    <span>R1.50 (2❤️+350💎) CLICK TO BUY</span>
    <span class="ended-text" id="status-r150"></span>
  </div>

  <div id="tile-r3" class="tab" onclick="claimSpecial('r3', 400, 5)">
    <span>R3 (5❤️+400💎) CLICK TO BUY</span>
    <span class="ended-text" id="status-r3"></span>
  </div>

  <br><br>
  <div class="wallet-notice">
    Wallet Can Only Be Topped-Up Between Times 07:00 TO 20:00
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getDatabase, ref, get, set, onValue } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBqJTLjxhZBCsvjrTH_cG0fkXlElG6BqTg",
  authDomain: "tose-ccf8f.firebaseapp.com",
  databaseURL: "https://tose-ccf8f-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "tose-ccf8f",
  storageBucket: "tose-ccf8f.appspot.com",
  messagingSenderId: "475447495901",
  appId: "1:475447495901:web:9189276a162a3680afdf34"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

const gemsEl = document.getElementById("gems");
const livesEl = document.getElementById("lives");

let uid;

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    location.href = "index.html";
    return;
  }

  const adminSnap = await get(ref(db, "admins/" + user.uid));
  if (adminSnap.exists()) {
    location.href = "admin.html";
    return;
  }

  uid = user.uid;
  load(); 
});

/* LOAD USER BALANCES & SPECIAL OFFER STATUSES */
function load(){
  // Real-time listener for balances
  onValue(ref(db, "wallet/" + uid), (snap) => {
    const data = snap.val() || {};
    gemsEl.innerText = data.gems || 0;
    livesEl.innerText = data.lives || 0;
  });

  // Real-time listener for the user's claims limits
  onValue(ref(db, "specialClaims/" + uid), (snap) => {
    const claims = snap.val() || { r050: 0, r150: 0, r3: 0 };
    
    checkLimit("r050", claims.r050 || 0);
    checkLimit("r150", claims.r150 || 0);
    checkLimit("r3", claims.r3 || 0);
  });
}

/* HELPER TO GREY OUT TILES IF THEY REACHED 2 CLAIMS */
function checkLimit(tileId, count) {
  const element = document.getElementById("tile-" + tileId);
  const textElement = document.getElementById("status-" + tileId);
  
  if (count >= 2) {
    element.classList.add("disabled");
    textElement.innerText = "SPECIAL ENDED";
  } else {
    element.classList.remove("disabled");
    textElement.innerText = "";
  }
}

/* INSTANT LOADER FOR SPECIAL TILES (NO LINKS, INSTANT CREDITING) */
window.claimSpecial = async function(tileId, gemsToAdd, livesToAdd) {
  if (!uid) return;

  // 1. Double check current claim count directly from DB
  const claimsSnap = await get(ref(db, "specialClaims/" + uid + "/" + tileId));
  const currentClaims = claimsSnap.val() || 0;

  if (currentClaims >= 2) {
    alert("You have already used your 2 claims for this special package!");
    return;
  }

  // 2. Fetch current wallet balances
  const walletSnap = await get(ref(db, "wallet/" + uid));
  const walletData = walletSnap.val() || { gems: 0, lives: 0 };

  let currentGems = walletData.gems || 0;
  let currentLives = walletData.lives || 0;

  // 3. Update wallet items and increment claim count in database instantly
  await set(ref(db, "wallet/" + uid + "/gems"), currentGems + gemsToAdd);
  await set(ref(db, "wallet/" + uid + "/lives"), currentLives + livesToAdd);
  await set(ref(db, "specialClaims/" + uid + "/" + tileId), currentClaims + 1);

  alert(`Successfully claimed! +${gemsToAdd} 💎 and +${livesToAdd} ❤️ added to your wallet.`);
};

/* GEM-TO-LIFE EXCHANGE TILE (FIXED BUG SO IT CHECKS FOR 300 GEMS) */
document.getElementById("buyLife").onclick = async () => {
  if (!uid) return;

  const snap = await get(ref(db, "wallet/" + uid));
  const data = snap.val() || {};

  let gems = data.gems || 0;
  let lives = data.lives || 0;

  if (gems < 300) {
    alert("Not enough gems (300 💎 = 1 ❤️)");
    return;
  }

  await set(ref(db, "wallet/" + uid + "/gems"), gems - 300);
  await set(ref(db, "wallet/" + uid + "/lives"), lives + 1);

  alert("+1 ❤️ purchased with gems!");
};
</script>

</body>
</html>
