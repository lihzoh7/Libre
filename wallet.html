<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MUUSTANDI WALLET</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 12px;
  font-family: Arial, sans-serif;
  background: #001f3f;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
}

#wallet {
  width: 100%;
  max-width: 480px;
  padding: 18px;
  text-align: center;
  background: #001428;
  border: 1px solid #004080;
  border-radius: 12px;
  box-shadow: 0 0 15px rgba(0,0,0,0.5);
}

.hawk-logo {
  display: block;
  width: 64px;
  height: 64px;
  object-fit: contain;
  margin: 0 auto 8px;
}

.winter-header {
  color: #00f0ff;
  font-size: clamp(20px, 5vw, 26px);
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: 2px;
  margin-bottom: 16px;
  text-shadow: 0 0 10px rgba(0,240,255,0.6);
}

.tiles {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  margin-bottom: 18px;
  align-items: stretch;
}

.tile {
  min-width: 0;
  min-height: 83px;
  padding: 12px 4px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
  background: #003366;
  border: 1px solid #004080;
  border-radius: 8px;
  font-size: clamp(14px, 3.5vw, 18px);
  font-weight: bold;
  overflow-wrap: anywhere;
}

.balance-tile {
  background: #004080;
  border-color: #00f0ff;
  color: #00f0ff;
}

.tile-label {
  font-size: 11px;
  letter-spacing: 0.5px;
  color: #c8eaff;
}

.buy-tile {
  padding: 6px 3px;
  background: #064c70;
  border: 1px solid #00f0ff;
  color: #00f0ff;
  cursor: pointer;
  transition: background 0.2s, transform 0.2s;
}

.buy-tile:hover {
  background: #08648e;
}

.buy-tile:active {
  transform: scale(0.97);
}

.buy-tile:disabled {
  opacity: 0.6;
  cursor: wait;
}

.buy-word {
  font-size: 20px;
  font-weight: 900;
  letter-spacing: 1px;
}

.buy-cost {
  font-size: 10px;
  line-height: 1.3;
  color: #ffffff;
  font-weight: normal;
}

.lives-tile {
  border-color: #e75d83;
  color: #ffffff;
}

.life-number {
  color: #ff668e;
  font-size: 22px;
}

.deposit-card {
  background: #002244;
  border: 1px solid #0055a5;
  padding: 15px;
  border-radius: 8px;
  margin-bottom: 12px;
  text-align: center;
}

.deposit-card h3 {
  margin: 0 0 14px;
  color: #ffcc00;
  font-size: 17px;
}

.form-group {
  margin-bottom: 12px;
  text-align: left;
}

.form-group label {
  display: block;
  font-size: 12px;
  color: #ccc;
  margin-bottom: 5px;
}

.form-group input {
  display: block;
  width: 100%;
  min-width: 0;
  padding: 11px;
  border-radius: 5px;
  border: 1px solid #004080;
  background: #001020;
  color: #fff;
  font-size: 16px;
}

.submit-btn {
  width: 100%;
  padding: 12px 8px;
  background: #00f0ff;
  color: #001f3f;
  font-weight: bold;
  font-size: 14px;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}

.submit-btn:hover {
  background: #00c4d4;
}

.submit-btn:disabled {
  opacity: 0.6;
  cursor: wait;
}

#message {
  display: none;
  margin: 10px 0 0;
  padding: 9px;
  border-radius: 6px;
  font-size: 13px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

#message.success {
  display: block;
  color: #a8ffbf;
  background: #103b2a;
}

#message.error {
  display: block;
  color: #ffb3b3;
  background: #451d27;
}

#message.info {
  display: block;
  color: #b8edff;
  background: #12344b;
}

@media (max-width: 360px) {
  body {
    padding: 7px;
  }

  #wallet {
    padding: 12px;
  }

  .tiles {
    gap: 5px;
  }

  .tile {
    padding: 9px 2px;
    min-height: 78px;
  }

  .buy-word {
    font-size: 17px;
  }

  .buy-cost {
    font-size: 9px;
  }

  .tile-label {
    font-size: 10px;
  }

  .deposit-card {
    padding: 12px;
  }
}
</style>
</head>

<body>
<div id="wallet">

  <img
    class="hawk-logo"
    src="hawk.png"
    alt="Muustandi Hawk"
  >

  <div class="winter-header">WINTER SPECIAL</div>

  <div class="tiles">

    <div class="tile balance-tile">
      <span class="tile-label">CASH BALANCE</span>
      <span>R <span id="cashBalance">0.00</span></span>
    </div>

    <button
      type="button"
      class="tile buy-tile"
      id="buyLife"
      aria-label="Buy one life for 50 cents"
    >
      <span class="buy-word">BUY</span>
      <span class="buy-cost">1 Life Cost<br>50 cent</span>
    </button>

    <div class="tile lives-tile">
      <span class="tile-label">LIVES</span>
      <span class="life-number">❤️ <span id="lives">0</span></span>
    </div>

  </div>

  <div class="deposit-card">
    <h3>TOP UP VIA 1VOUCHER</h3>

    <div class="form-group">
      <label for="depositAmount">Deposit Amount (Rand):</label>
      <input
        type="number"
        id="depositAmount"
        value="20"
        min="5"
        step="0.01"
        placeholder="e.g. 20"
      >
    </div>

    <button class="submit-btn" id="submitVoucherBtn">
      CONTINUE TO 1VOUCHER PAYMENT
    </button>
  </div>

  <div id="message" role="status" aria-live="polite"></div>

</div>

<script type="module">
import { initializeApp } from
  "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";

import {
  getDatabase,
  ref,
  runTransaction,
  onValue,
  get
} from
  "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

import {
  getAuth,
  onAuthStateChanged
} from
  "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

/* =====================================================
   FIREBASE CONFIGURATION
   ===================================================== */

const firebaseConfig = {
  apiKey: "AIzaSyBqJTLjxhZBCsvjrTH_cG0fkXlElG6BqTg",
  authDomain: "tose-ccf8f.firebaseapp.com",
  databaseURL: "https://tose-ccf8f-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "tose-ccf8f",
  storageBucket: "tose-ccf8f.appspot.com"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

/* =====================================================
   WALLET STATE
   ===================================================== */

let currentUid = null;
let walletListenerStartedFor = null;
let walletData = {};
let purchaseInProgress = false;

const cashBalanceElement =
  document.getElementById("cashBalance");

const livesElement =
  document.getElementById("lives");

const buyLifeButton =
  document.getElementById("buyLife");

const depositButton =
  document.getElementById("submitVoucherBtn");

const messageElement =
  document.getElementById("message");

function showMessage(message, type = "info") {
  messageElement.textContent = message;
  messageElement.className = type;
}

function clearMessage() {
  messageElement.textContent = "";
  messageElement.className = "";
}

function money(value) {
  const amount = Number(value);

  return Number.isFinite(amount)
    ? amount.toFixed(2)
    : "0.00";
}

function renderWallet(data = {}) {
  walletData = data;

  cashBalanceElement.textContent =
    money(data.cashBalance);

  livesElement.textContent =
    String(Math.max(0, Number(data.lives) || 0));
}

/* =====================================================
   AUTHENTICATION AND LIVE WALLET UPDATES
   ===================================================== */

onAuthStateChanged(auth, (user) => {
  currentUid = user ? user.uid : null;

  if (!currentUid) {
    walletListenerStartedFor = null;
    renderWallet({});
    buyLifeButton.disabled = true;
    depositButton.disabled = true;

    showMessage(
      "Please log in to view and use your wallet.",
      "info"
    );

    return;
  }

  buyLifeButton.disabled = false;
  depositButton.disabled = false;

  if (walletListenerStartedFor === currentUid) {
    return;
  }

  walletListenerStartedFor = currentUid;

  listenToWalletUpdates(currentUid);
});

function listenToWalletUpdates(uid) {
  onValue(
    ref(db, "wallet/" + uid),
    (snapshot) => {
      const data = snapshot.val() || {};

      renderWallet(data);

      if (!purchaseInProgress) {
        clearMessage();
      }
    },
    (error) => {
      console.error("Wallet listener error:", error);

      showMessage(
        "Unable to load your wallet. Please refresh and try again.",
        "error"
      );
    }
  );
}

/* =====================================================
   BUY ONE LIFE FOR R0.50
   ===================================================== */

/*
 * The purchase uses a Firebase transaction on wallet/{uid}.
 *
 * It checks cashBalance and deducts exactly R0.50 while
 * adding one life in the same atomic wallet update.
 *
 * If the balance is insufficient, the transaction aborts.
 * The wallet listener then displays the latest wallet values.
 */

buyLifeButton.addEventListener("click", async () => {
  if (!currentUid) {
    showMessage(
      "Please log in before buying a life.",
      "error"
    );
    return;
  }

  if (purchaseInProgress) {
    return;
  }

  purchaseInProgress = true;
  buyLifeButton.disabled = true;

  const originalButtonHTML = buyLifeButton.innerHTML;

  buyLifeButton.innerHTML =
    '<span class="buy-word">BUY...</span><span class="buy-cost">Please wait</span>';

  showMessage("Processing your life purchase...", "info");

  try {
    const uid = currentUid;
    const walletRef = ref(db, "wallet/" + uid);

    let insufficientBalance = false;
    let purchaseCommitted = false;

    const result = await runTransaction(
      walletRef,
      (currentData) => {
        insufficientBalance = false;

        if (
          !currentData ||
          typeof currentData !== "object"
        ) {
          insufficientBalance = true;
          return;
        }

        const cash = Number(currentData.cashBalance);

        if (!Number.isFinite(cash) || cash < 0.50) {
          insufficientBalance = true;
          return;
        }

        const currentLives = Number(currentData.lives || 0);

        if (
          !Number.isFinite(currentLives) ||
          currentLives < 0
        ) {
          return;
        }

        /*
         * Round to cents to avoid floating-point
         * balance errors such as 1.2 - 0.5.
         */
        const cashCents = Math.round(cash * 100);

        if (cashCents < 50) {
          insufficientBalance = true;
          return;
        }

        purchaseCommitted = true;

        return {
          ...currentData,
          cashBalance: (cashCents - 50) / 100,
          lives: currentLives + 1,
          updatedAt: new Date().toISOString()
        };
      },
      {
        applyLocally: false
      }
    );

    if (!result.committed || !purchaseCommitted) {
      if (insufficientBalance) {
        showMessage(
          "Insufficient cash balance. You need at least R0.50 to buy one life.",
          "error"
        );
      } else {
        showMessage(
          "The purchase was not completed. Please check your balance and try again.",
          "error"
        );
      }

      return;
    }

    const updatedWallet = result.snapshot.val() || {};

    renderWallet(updatedWallet);

    showMessage(
      "Success! R0.50 was deducted and 1 life was added to your wallet.",
      "success"
    );

  } catch (error) {
    console.error("Buy life error:", error);

    showMessage(
      "Unable to complete the purchase. Please check your connection and wallet balance.",
      "error"
    );
  } finally {
    purchaseInProgress = false;
    buyLifeButton.disabled = !currentUid;
    buyLifeButton.innerHTML = originalButtonHTML;
  }
});

/* =====================================================
   1VOUCHER DEPOSIT
   ===================================================== */

depositButton.addEventListener("click", async () => {
  const amountInput =
    document.getElementById("depositAmount");

  const amountRand = Number(amountInput.value);

  if (
    !Number.isFinite(amountRand) ||
    amountRand < 5
  ) {
    showMessage(
      "Please enter a valid deposit amount. The minimum is R5.",
      "error"
    );
    return;
  }

  if (!currentUid) {
    showMessage(
      "Please log in to make a deposit.",
      "error"
    );
    return;
  }

  const amountInCents = Math.round(amountRand * 100);

  depositButton.disabled = true;

  const originalButtonText = depositButton.textContent;

  depositButton.textContent =
    "REDIRECTING TO PAYMENT...";

  showMessage(
    "Connecting to the 1Voucher payment gateway...",
    "info"
  );

  try {
    let userFirstName = "Gamer";
    let userLastName = "Customer";

    const userSnapshot =
      await get(ref(db, "users/" + currentUid));

    if (userSnapshot.exists()) {
      const userData = userSnapshot.val();

      userFirstName = userData.name || "Gamer";
      userLastName = userData.surname || "Customer";
    }

    const response = await fetch(
      "https://muustandibackend.onrender.com/deposit/1voucher",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          amountInCents,
          userId: currentUid,
          firstName: userFirstName,
          lastName: userLastName
        })
      }
    );

    const result = await response.json();

    if (!response.ok || !result.success) {
      throw new Error(
        result.message ||
        result.error ||
        "Failed to initialize the payment."
      );
    }

    if (!result.redirectUri) {
      throw new Error(
        "The payment gateway did not return a redirect link."
      );
    }

    window.location.href = result.redirectUri;

  } catch (error) {
    console.error("1Voucher deposit error:", error);

    showMessage(
      "Deposit could not be started: " + error.message,
      "error"
    );

    depositButton.disabled = false;
    depositButton.textContent = originalButtonText;
  }
});
</script>

</body>
</html>
```
