<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WALLET</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#001f3f;
  color:white;
  display:flex;
  justify-content:center;
}

#wallet{
  width:400px;
  padding:20px;
}

.tiles{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.tile{
  background:#003366;
  padding:20px;
  text-align:center;
  border-radius:10px;
  cursor:pointer;
}

.tab{
  margin-top:10px;
  background:#001f5c;
  padding:15px;
  text-align:center;
  cursor:pointer;
}

#popup{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:white;
  color:black;
  padding:20px;
  display:none;
}
</style>
</head>

<body>

<div id="wallet">

<h2>WALLET</h2>

<div class="tiles">
  <div class="tile">💎 <span id="gems">0</span></div>
  <div class="tile" onclick="buyLife()">❤️ <span id="lives">0</span></div>
</div>

<div class="tab" onclick="buy('R1.50','300 gems','https://pay.ikhokha.com/i-am-lizo-tose/mpr/spl-150')">
R1.50 (300 💎)
</div>

<div class="tab" onclick="buy('R3','900 gems','https://pay.ikhokha.com/i-am-lizo-tose/mpr/spl-900')">
R3 (900 💎)
</div>

<div class="tab" onclick="buy('R5','2 lives + 500 gems','https://pay.ikhokha.com/i-am-lizo-tose/mpr/spl-500')">
R5 (2♥ + 500 💎)
</div>

</div>

<div id="popup"></div>

<script>
const API = "https://payfast-backend-475447495901.europe-west1.run.app";
const uid = localStorage.getItem("uid");

async function load(){
  const res = await fetch(API+"/economy/user/economy?uid="+uid);
  const data = await res.json();

  gems.innerText = data.gems || 0;
  lives.innerText = data.lives || 0;
}

function buy(price,item,link){
  // SEND REQUEST TO ADMIN
  fetch(API+"/money/request",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      uid,
      price,
      item,
      timestamp:Date.now()
    })
  });

  // REDIRECT TO IKHOKHA
  window.location.href = link;
}

function buyLife(){
  fetch(API+"/economy/convert-gems",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({uid})
  }).then(r=>r.json()).then(d=>{
    alert(d.error || "Life Purchased");
    load();
  });
}

load();
</script>

</body>
</html>
