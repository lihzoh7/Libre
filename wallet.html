<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WALLET</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #001f3f;
  color: white;
  display: flex;
  flex-direction: column; /* Allows stacking headers vertically */
  justify-content: center;
  align-items: center; 
  min-height: 100vh;
}

#wallet {
  width: 500px; /* Slightly wider to accommodate the status text nicely */
  padding: 20px;
  text-align: center; 
}

/* Winter Special Text Heading */
.winter-header {
  font-size: 26px;
  color: #a5f3fc; /* Bright Icy / Cyan blue color */
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: 2px;
  margin-bottom: 5px;
  text-shadow: 0 0 10px rgba(165, 243, 252, 0.5);
}

.tiles {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
  margin-bottom: 20px;
}

.tile {
  background: #003366;
  padding: 25px; 
  text-align: center;
  border-radius: 10px;
  font-size: 24px; 
  font-weight: bold;
}

/* Wrapper to structure the button text and the special notice side-by-side */
.tab-container {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 15px;
  background: #001f5c;
  padding: 20px; 
  border-radius: 8px; 
  border: 1px solid #004080; 
  transition: all 0.3s;
}

.tab-btn {
  flex-grow: 1;
  text-align: left;
  cursor: pointer;
  font-size: 18px;     
  font-weight: bold;   
}

.tab-status {
  font-size: 14px;
  font-weight: bold;
  color: #ffcc00; /* Gold for remaining uses */
  margin-left: 15px;
  white-space: nowrap;
}

.tab-container:hover:not(.disabled) {
  background: #003366; 
}

/* Disabled/Greyed Out State Rules */
.tab-container.disabled {
  background: #334155 !important; /* Metallic slate grey */
  border-color: #475569 !important;
  cursor: not-allowed;
  opacity: 0.6;
}

.tab-container.disabled .tab-status {
  color: #ef4444 !important; /* Red for special ended */
}

h2 {
  font-size: 32px; 
  margin-top: 0;
  margin-bottom: 20px;
}

.wallet-notice {
  font-size: 14px;
  color: #ffcc00; 
  font-weight: bold;
  letter-spacing: 0.5px;
  line-height: 1.5;
  margin-top: 25px;
  padding: 10px;
  background: rgba(0, 0, 0, 0.2); 
  border-radius: 5px;
}  
</style>
</head>

<body>

<!-- Winter Special Headline at upper center -->
<div class="winter-header">❄️ Winter Special ❄️</div>

<div id="wallet">
<h2>WALLET</h2>

<div class="tiles">
  <div class="tile">💎 <span id="gems">0</span></div>
  <div class="tile" id="buyLife">❤️ <span id="lives">0</span></div>
</div>

<!-- Bundle 1: R0.50 -->
<div class="tab-container" id="container-tier1">
  <div class="tab-btn" onclick="claimSpecial('tier1', 150, 1)">
    R0.50 (1❤️+150💎) CLICK TO LOAD
  </div>
  <div class="tab-status" id="status-tier1">2 CLAIMS LEFT</div>
</div>

<!-- Bundle 2: R1.50 -->
<div class="tab-container" id="container-tier2">
  <div class="tab-btn" onclick="claimSpecial('tier2', 350, 2)">
    R1.50 (2❤️+350💎) CLICK TO LOAD
  </div>
  <div class="tab-status" id="status-tier2">2 CLAIMS LEFT</div>
</div>

<!-- Bundle 3: R3.00 -->
<div class="tab-container" id="container-tier3">
  <div class="tab-btn" onclick="claimSpecial('tier3', 400, 5)">
    R3 (5❤️+400💎) CLICK TO LOAD
  </div>
  <div class="tab-status" id="status-tier3">2 CLAIMS LEFT</div>
</div>

<br><br>
<div class="wallet-notice">
  Wallet Can Only Be Topped-Up Between Times 07:00 TO 20:00
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getDatabase, ref, get, set, onValue } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBqJTLjxhZBCsvjrTH_cG0fkXlElG6BqTg",
  authDomain: "tose-ccf8f.firebaseapp.com",
  databaseURL: "https://tose-ccf8f-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "tose-ccf8f",
  storageBucket: "tose-ccf8f.appspot.com",
  messagingSenderId: "475447495901",
  appId: "1:475447495901:web:9189276a162a3680afdf34"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

const gemsEl = document.getElementById("gems");
const livesEl = document.getElementById("lives");

let uid; 

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    location.href = "index.html";
    return;
  }

  const adminSnap = await get(ref(db, "admins/" + user.uid));
  if (adminSnap.exists()) {
    location.href = "admin.html";
    return;
  }

  uid = user.uid;
  loadWallet();
  syncSpecialLimits();
});

/* REAL-TIME WALLET DISPLAY */
function loadWallet(){
  onValue(ref(db, "wallet/" + uid), (snap) => {
    const data = snap.val() || {};
    gemsEl.innerText = data.gems || 0;
    livesEl.innerText = data.lives || 0;
  });
}

/* LISTEN FOR USER'S CLAIM COUNT PER TILE */
function syncSpecialLimits() {
  onValue(ref(db, "specialClaims/" + uid), (snap) => {
    const claims = snap.val() || {};
    
    // Tiers list to update structural loops quickly
    const tiers = ['tier1', 'tier2', 'tier3'];
    
    tiers.forEach(tier => {
      const count = claims[tier] || 0;
      const container = document.getElementById("container-" + tier);
      const statusText = document.getElementById("status-" + tier);
      
      if (count >= 2) {
        container.classList.add("disabled");
        statusText.innerText = "SPECIAL ENDED";
      } else {
        container.classList.remove("disabled");
        statusText.innerText = (2 - count) + " CLAIMS LEFT";
      }
    });
  });
}

/* AUTOMATIC SPECIAL CLAIM ENGINE */
window.claimSpecial = async function(tier, gemsToAdd, livesToAdd) {
  const container = document.getElementById("container-" + tier);
  
  // Guard check: Stop execution instantly if tile is greyed out
  if (container.classList.contains("disabled")) {
    alert("You have reached the claim limit for this offer!");
    return;
  }

  // Check database counts explicitly to bypass client-side manipulation risks
  const countSnap = await get(ref(db, "specialClaims/" + uid + "/" + tier));
  const currentCount = countSnap.val() || 0;
  
  if (currentCount >= 2) {
    alert("This special offer has already ended for your account.");
    return;
  }

  // 1. Fetch current balances
  const walletSnap = await get(ref(db, "wallet/" + uid));
  const walletData = walletSnap.val() || {};
  
  let currentGems = walletData.gems || 0;
  let currentLives = walletData.lives || 0;

  // 2. Add rewards and increase count
  await set(ref(db, "wallet/" + uid + "/gems"), currentGems + gemsToAdd);
  await set(ref(db, "wallet/" + uid + "/lives"), currentLives + livesToAdd);
  await set(ref(db, "specialClaims/" + uid + "/" + tier), currentCount + 1);

  alert(`Successfully loaded +${gemsToAdd} Gems and +${livesToAdd} Lives!`);
};

/* IN-APP GEM CONVERSION (FIXED GEM LOGIC RULE) */
document.getElementById("buyLife").onclick = async () => {
  const snap = await get(ref(db, "wallet/" + uid));
  const data = snap.val() || {};

  let gems = data.gems || 0;
  let lives = data.lives || 0;

  // Fixed your original bug check so balances won't plunge past 0
  if(gems < 300){
    alert("Not enough gems (300 💎 = 1 ❤️)");
    return;
  }

  await set(ref(db, "wallet/" + uid + "/gems"), gems - 300);
  await set(ref(db, "wallet/" + uid + "/lives"), lives + 1);

  alert("+1 ❤️ purchased with Gems!");
};
</script>

</body>
</html>
