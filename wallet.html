<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WALLET</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#001f3f;
  color:white;
  display:flex;
  justify-content:center;
}

#wallet{
  width:400px;
  padding:20px;
}

.tiles{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.tile{
  background:#003366;
  padding:20px;
  text-align:center;
  border-radius:10px;
  cursor:pointer;
}

.tab{
  margin-top:10px;
  background:#001f5c;
  padding:15px;
  text-align:center;
  cursor:pointer;
}
</style>
</head>

<body>

<div id="wallet">

<h2>WALLET</h2>

<div class="tiles">
  <div class="tile">💎 <span id="gems">0</span></div>
  <div class="tile" onclick="buyLife()">❤️ <span id="lives">0</span></div>
</div>

<div class="tab" onclick="buy('R1.50','300 gems','https://pay.ikhokha.com/i-am-lizo-tose/mpr/spl-150')">
R1.50 (300 💎)
</div>

<div class="tab" onclick="buy('R3','900 gems','https://pay.ikhokha.com/i-am-lizo-tose/mpr/spl-900')">
R3 (900 💎)
</div>

<div class="tab" onclick="buy('R5','2 lives + 500 gems','https://pay.ikhokha.com/i-am-lizo-tose/mpr/spl-500')">
R5 (2♥ + 500 💎)
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";
import { getAuth } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
import { firebaseConfig } from "./firebase-config.js";

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

const gemsEl = document.getElementById("gems");
const livesEl = document.getElementById("lives");

let user;

/* LOAD WALLET */
async function load(){
  user = auth.currentUser;
  if(!user) return;

  const snap = await get(ref(db,"users/"+user.uid+"/wallet"));
  const data = snap.val() || {};

  gemsEl.innerText = data.gems || 0;
  livesEl.innerText = data.lives || 0;
}

/* BUY LIFE */
window.buyLife = async function(){

  const snap = await get(ref(db,"users/"+user.uid+"/wallet"));
  let data = snap.val() || {};

  if((data.gems || 0) < 300){
    alert("INSUFFICIENT GEMS");
    return;
  }

  data.gems -= 300;
  data.lives = (data.lives || 0) + 1;

  await update(ref(db,"users/"+user.uid+"/wallet"), data);

  load();
}

setTimeout(load,500);

}

  if((data.gems || 0) < 300){
    alert("Not enough gems");
    return;
  }

  data.gems -= 300;
  data.lives = (data.lives || 0) + 1;

  localStorage.setItem("wallet_"+uid, JSON.stringify(data));

  load();
}

load();
</script>

</body>
  </html>
