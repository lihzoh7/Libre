<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SPACE GLASS - Main Menu</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:url('https://images.unsplash.com/photo-1549924231-f129b911e442?auto=format&fit=crop&w=1470&q=80') no-repeat center;
  background-size:cover;
  height:100vh;
  overflow:hidden;
}

.tabs{
  position:absolute;
  bottom:50px;
  width:100%;
  display:flex;
  justify-content:center;
  gap:20px;
}

.tab{
  width:100px;
  height:50px;
  background:rgba(255,255,255,0.2);
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:8px;
  cursor:pointer;
  color:white;
}

#logout{position:absolute;top:10px;left:10px;color:white;cursor:pointer}
#profile{position:absolute;top:10px;right:10px;color:white;cursor:pointer}
#messages{position:absolute;top:10px;right:50px;color:white;cursor:pointer}

/* APPLICATION POPUP */
#applicationPopup{
  display:none;
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.7);
  justify-content:center;
  align-items:center;
}

.popup-box{
  background:white;
  padding:20px;
  border-radius:10px;
  text-align:center;
  width:280px;
}

input{
  width:100%;
  padding:8px;
  margin:5px 0;
}

button{
  padding:10px;
  width:100%;
  background:lightblue;
  border:none;
  cursor:pointer;
}

/* REFERENCE POPUP */
#referencePopup{
  display:none;
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:black;
  color:white;
  justify-content:center;
  align-items:center;
  text-align:center;
}
</style>
</head>

<body>

<div id="logout" onclick="location.href='index.html'">🔙</div>
<div id="messages" onclick="location.href='messages.html'">✉</div>
<div id="profile" onclick="location.href='profile.html'">👤</div>

<div class="tabs">
  <div class="tab" onclick="location.href='prizes.html'">PRIZES</div>
  <div class="tab" onclick="location.href='scores.html'">SCORES</div>
  <div class="tab" id="playBtn">PLAY</div>
  <div class="tab" onclick="location.href='wallet.html'">WALLET</div>
</div>

<!-- APPLICATION -->
<div id="applicationPopup">
  <div class="popup-box">

    <div id="form">
      <h3>Apply</h3>
      <input id="name" placeholder="Name">
      <input id="surname" placeholder="Surname">
      <input id="number" placeholder="Number">
      <input id="age" placeholder="Age">
      <input id="referral" placeholder="Referral (optional)">
      <button onclick="submitApp()">Submit</button>
    </div>

    <div id="waiting" style="display:none;">
      WAITING FOR APPROVAL<span id="dots">.</span>
    </div>

  </div>
</div>

<div id="referencePopup">
  <div>
    <h2 id="refText"></h2>
    <p>Click anywhere to continue</p>
  </div>
</div>

<script>
const API = "https://payfast-backend-475447495901.europe-west1.run.app";
const uid = localStorage.getItem("uid");

/* PLAY BUTTON */
document.getElementById("playBtn").onclick = ()=>{

  const data = JSON.parse(localStorage.getItem("wallet_"+uid) || "{}");

  if(!data.lives || data.lives <= 0){
    alert("NO LIVES");
    return;
  }

  // ✅ DO NOT DEDUCT HERE
  window.location.href="game.html";
};

/* APPLICATION CHECK */
async function checkApp(){
  const res = await fetch(API+"/applications/status?uid="+uid);
  const data = await res.json();

  if(!data.approved){
    document.getElementById("applicationPopup").style.display="flex";

    if(data.status==="pending"){
      showWaiting();
    }
  }
}

function submitApp(){
  fetch(API+"/applications/submit",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      uid,
      name:name.value,
      surname:surname.value,
      number:number.value,
      age:age.value,
      referral:referral.value
    })
  });

  showWaiting();
}

function showWaiting(){
  form.style.display="none";
  waiting.style.display="block";

  let d=1;
  setInterval(()=>{
    dots.innerText=".".repeat(d);
    d=d===3?1:d+1;
  },500);

  listenApproval();
}

function listenApproval(){
  setInterval(async ()=>{
    const res = await fetch(API+"/applications/status?uid="+uid);
    const data = await res.json();

    if(data.approved){
      applicationPopup.style.display="none";
      showRef(data.reference);
    }
  },3000);
}

function showRef(ref){
  referencePopup.style.display="flex";
  refText.innerText = ref;

  referencePopup.onclick=()=>{
    referencePopup.style.display="none";
  }
}

checkApp();
</script>

</body>
</html>
