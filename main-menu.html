<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SPACE GLASS - Main Menu</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:url('https://images.unsplash.com/photo-1549924231-f129b911e442?auto=format&fit=crop&w=1470&q=80') no-repeat center;
  background-size:cover;
  height:100vh;
  overflow:hidden;
}

.tabs{
  position:absolute;
  bottom:50px;
  width:100%;
  display:flex;
  justify-content:center;
  gap:20px;
}

.tab{
  width:100px;
  height:50px;
  background:rgba(255,255,255,0.2);
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:8px;
  cursor:pointer;
  color:white;
}

#logout{position:absolute;top:10px;left:10px;color:white;cursor:pointer}
#profile{position:absolute;top:10px;right:10px;color:white;cursor:pointer}
#messages{position:absolute;top:10px;right:50px;color:white;cursor:pointer}

/* APPLICATION POPUP */
#applicationPopup{
  display:none;
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.7);
  justify-content:center;
  align-items:center;
}

.popup-box{
  background:white;
  padding:20px;
  border-radius:10px;
  text-align:center;
  width:280px;
}

input{
  width:100%;
  padding:8px;
  margin:5px 0;
}

button{
  padding:10px;
  width:100%;
  background:lightblue;
  border:none;
  cursor:pointer;
}

/* REFERENCE POPUP */
#referencePopup{
  display:none;
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:black;
  color:white;
  justify-content:center;
  align-items:center;
  text-align:center;
}
</style>
</head>

<body>

<div id="logout" onclick="location.href='index.html'">🔙</div>
<div id="messages" onclick="location.href='messages.html'">✉</div>
<div id="profile" onclick="location.href='profile.html'">👤</div>

<div class="tabs">
  <div class="tab" onclick="location.href='prizes.html'">PRIZES</div>
  <div class="tab" onclick="location.href='scores.html'">SCORES</div>
  <div class="tab" id="playBtn">PLAY</div>
  <div class="tab" onclick="location.href='wallet.html'">WALLET</div>
</div>

<!-- APPLICATION -->
<div id="applicationPopup">
  <div class="popup-box">

    <div id="form">
      <h3>Apply</h3>
      <input id="name" placeholder="Name">
      <input id="surname" placeholder="Surname">
      <input id="number" placeholder="Number">
      <input id="age" placeholder="Age">
      <input id="referral" placeholder="Referral (optional)">
      <button onclick="submitApp()">Submit</button>
    </div>

    <div id="waiting" style="display:none;">
      WAITING FOR APPROVAL<span id="dots">.</span>
    </div>

  </div>
</div>

<div id="referencePopup">
  <div>
    <h2 id="refText"></h2>
    <p>Click anywhere to continue</p>
  </div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBqJTLjxhZBCsvjrTH_cG0fkXlElG6BqTg",
  authDomain: "tose-ccf8f.firebaseapp.com",
  databaseURL: "https://tose-ccf8f-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "tose-ccf8f",
  storageBucket: "tose-ccf8f.appspot.com",
  messagingSenderId: "475447495901",
  appId: "1:475447495901:web:9189276a162a3680afdf34"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

let user;

onAuthStateChanged(auth, async (u)=>{
  if(!u){
    location.href="index.html";
  }else{
    user = u;

    // 🔥 CHECK APPROVAL FROM FIREBASE (optional)
    const snap = await get(ref(db,"users/"+user.uid));
    const data = snap.val() || {};

    if(!data.approved){
      document.getElementById("applicationPopup").style.display="flex";
    }
  }
});

/* PLAY BUTTON */
document.getElementById("playBtn").onclick = async () => {

  if(!user) return;

  const snap = await get(ref(db,"wallet/"+user.uid));
  const data = snap.val() || {};

  let lives = data.lives || 0;

  if(lives <= 0){
    alert("NO LIVES");
    return;
  }

  window.location.href = "game.html";
};

/* CLOSE POPUP */
document.getElementById("applicationPopup").onclick = () => {
  document.getElementById("applicationPopup").style.display = "none";
};

  </script>

</body>
</html>
