<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transactions Log - Muustandi Gaming</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #000000, #0a192f, #000000);
            background-attachment: fixed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        /* Top Header Navigation */
        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto 20px auto;
        }

        .back-btn {
            text-decoration: none;
            color: #00f0ff;
            border: 1px solid #00f0ff;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            transition: all 0.2s;
        }

        .back-btn:hover {
            background: #00f0ff;
            color: #000;
        }

        .page-title {
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.6);
        }

        /* Dual Column Split Layout */
        .split-container {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            flex: 1;
            min-height: 80vh;
        }

        .column {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #001428;
            border-radius: 12px;
            border: 1px solid #004080;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7);
        }

        .column-tab {
            padding: 15px;
            font-size: 1.25rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
            border-bottom: 2px solid;
        }

        /* Left Column Tab (Redeemed) */
        .redeemed-tab {
            background-color: rgba(16, 185, 129, 0.15);
            color: #10b981;
            border-color: #10b981;
            text-shadow: 0 0 8px rgba(16, 185, 129, 0.5);
        }

        /* Right Column Tab (Rejected) */
        .rejected-tab {
            background-color: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border-color: #ef4444;
            text-shadow: 0 0 8px rgba(239, 68, 68, 0.5);
        }

        /* Embedded Iframe Container */
        .frame-content {
            width: 100%;
            height: 100%;
            min-height: 650px;
            border: none;
            flex: 1;
        }

        @media (max-width: 900px) {
            .split-container {
                flex-direction: column;
            }
            .column {
                min-height: 500px;
            }
        }
    </style>
</head>
<body>

    <div class="nav-bar">
        <a href="index.html" class="back-btn">← Back to Hub</a>
        <h1 class="page-title">TRANSACTIONS LEDGER</h1>
        <div style="width: 120px;"></div>
    </div>

    <div class="split-container">
        
        <!-- LEFT COLUMN: REDEEMED -->
        <div class="column">
            <div class="column-tab redeemed-tab">Redeemed</div>
            <iframe src="granted.html" class="frame-content" title="Redeemed Transactions Log"></iframe>
        </div>

        <!-- RIGHT COLUMN: REJECTED -->
        <div class="column">
            <div class="column-tab rejected-tab">Rejected</div>
            <iframe src="denied.html" class="frame-content" title="Rejected Transactions Log"></iframe>
        </div>

    </div>

</body>
</html>
