<!DOCTYPE html>  
<html lang="en">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1.0">  
<title>Quizer Game</title>  
<style>  
  body {   
    margin: 0;   
    font-family: Arial, sans-serif;   
    background-color: #87CEEB;   
    color: #333;   
    height: 100vh;   
    display: flex;   
    flex-direction: column;   
  }  
  header {   
    display: flex;   
    justify-content: space-between;   
    padding: 15px;   
    font-weight: bold;   
    font-size: 20px;   
    background: rgba(255,255,255,0.2);   
  }  
  #game-zone {   
    flex: 1;   
    display: flex;   
    flex-direction: column;   
    justify-content: center;   
    align-items: center;   
    padding: 20px;   
    position: relative;   
  }  
  #start-btn {   
    font-size: 80px;   
    cursor: pointer;   
    background: none;   
    border: none;   
    color: #004d00;   
  }  
  #display-box {   
    width: 100%;   
    max-width: 500px;   
    height: 300px;   
    background: #000;   
    border-radius: 8px;   
    display: none;   
    justify-content: center;   
    align-items: center;   
    overflow: hidden;   
    position: relative;   
  }  
  #display-box img, #display-box video {   
    width: 100%;   
    height: 100%;   
    object-fit: contain;   
  }  
  #audio-icon {   
    font-size: 80px;   
    color: white;   
  }  
  #question-text {   
    font-size: 22px;   
    font-weight: bold;   
    margin-bottom: 15px;   
    text-align: center;   
    min-height: 30px;   
  }  
  #answer-input {   
    padding: 12px;   
    width: 80%;   
    max-width: 400px;   
    border-radius: 4px;   
    border: 2px solid #333;   
    font-size: 16px;   
    margin-top: 15px;   
    text-align: center;   
    display: none;   
    box-sizing: border-box;  
  }  
  #submit-ans-btn {  
    display: none;  
    margin-top: 15px;  
    width: 80%;  
    max-width: 400px;  
    padding: 12px;  
    background-color: #228B22; /* Forest Green */  
    color: white;  
    font-size: 18px;  
    font-weight: bold;  
    border: none;  
    border-radius: 4px;  
    cursor: pointer;  
    text-align: center;  
  }  
  #replay-btn {   
    position: absolute;   
    bottom: 10px;   
    right: 10px;   
    background: red;   
    color: white;   
    border: none;   
    padding: 5px 10px;   
    font-weight: bold;   
    cursor: pointer;   
    display: none;   
    border-radius: 4px;   
    z-index: 10;   
  }  

  /*  NAVIGATION CONTROLS */
  #nav-controls {
    display: none;
    justify-content: space-between;
    width: 80%;
    max-width: 400px;
    margin-top: 15px;
  }
  .nav-btn {
    background-color: #004d00;
    color: white;
    border: none;
    padding: 10px 20px;
    font-size: 24px;
    font-weight: bold;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .nav-btn:hover {
    background-color: #007700;
  }
  
  /* POPUP CONTAINER MODAL */
  .game-popup {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.85);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 1000;
  }
  .popup-content {
    background: white;
    padding: 30px;
    border-radius: 12px;
    text-align: center;
    max-width: 320px;
    width: 90%;
    box-sizing: border-box;
  }
  .popup-content h2 { margin-top: 0; color: #cc0000; }
  .popup-content button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    font-size: 16px;
    font-weight: bold;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }

  /* GREEN CORRECT ANSWER POPUP STYLE */
  #correctAnswerPopup .popup-content {
    border: 4px solid #228B22;
  }
  #correctAnswerPopup h2 {
    color: #228B22;
  }
  .revealed-answer {
    font-size: 24px;
    font-weight: bold;
    color: #333;
    margin: 15px 0;
    padding: 10px;
    background: #e6f7e6;
    border-radius: 6px;
    border: 1px dashed #228B22;
  }
</style>

</head>  
<body>  
<header>  
  <div>Score: <span id="score">0</span></div>  
  <div>Quizer Game</div>  
</header>  

<div id="game-zone">  
  <button id="start-btn">▶</button>    
  <div id="question-text"></div>  
  <div id="display-box">  
    <button id="replay-btn">replay</button>  
    <img id="game-img" style="display:none;" alt="Quiz Element">  
    <video id="game-video" style="display:none;"></video>  
    <div id="audio-icon" style="display:none;">🔊</div>  
  </div>  
  <input type="text" id="answer-input" placeholder="Type your answer here...">  
  <button id="submit-ans-btn">SUBMIT</button>  

  <div id="nav-controls">
    <button class="nav-btn" id="prev-btn">◀</button>
    <button class="nav-btn" id="next-btn">▶</button>
  </div>
</div>  

<div class="game-popup" id="correctAnswerPopup">  
  <div class="popup-content">  
    <h2>💡 REVEALED ANSWER</h2>  
    <p>The correct answer is:</p>
    <div class="revealed-answer" id="revealedAnswerText">---</div>  
    <p style="font-size:12px; color:#666;">Moving to next challenge in 5s...</p>
  </div>  
</div>  

<script type="module">  
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";  
  import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";  
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";  
  
  const firebaseConfig = {  
    apiKey: "AIzaSyBqJTLjxhZBCsvjrTH_cG0fkXlElG6BqTg",  
    authDomain: "tose-ccf8f.firebaseapp.com",  
    databaseURL: "https://tose-ccf8f-default-rtdb.europe-west1.firebasedatabase.app",  
    projectId: "tose-ccf8f",  
    storageBucket: "tose-ccf8f.appspot.com",  
  };  
  
  const app = initializeApp(firebaseConfig);  
  const db = getDatabase(app);  
  const auth = getAuth(app);  
  
  let uid, score = 0;  
  let flatQuestionsList = []; 
  let currentPointer = -1;  
  let activeAudio = null;  
  let revealTimeout = null;
  
  onAuthStateChanged(auth, async (user) => {  
    if(!user) { location.href = "login.html"; return; }  
    uid = user.uid;  
  });  
  
  document.getElementById('start-btn').onclick = async function() {  
    this.style.display = 'none';  
      
    document.getElementById('display-box').style.display = 'flex';  
    document.getElementById('answer-input').style.display = 'block';  
    document.getElementById('submit-ans-btn').style.display = 'block';  
    document.getElementById('nav-controls').style.display = 'flex';  
      
    await loadAndShuffleMediaPool();  
    if(flatQuestionsList.length > 0) {
      currentPointer = 0;
      renderCurrentChallenge();
    } else {
      alert("No challenges found in the database!");
    }
  };  
  
  // Load media and shuffle all individual questions into a random sequence
  async function loadAndShuffleMediaPool() {  
    const types = ['audio', 'video', 'image'];  
    let rawPool = [];  
    for(let t of types){  
      let snap = await get(ref(db, "quizMedia/" + t));  
      let val = snap.val() || {};  
      for(let key in val){  
        rawPool.push({id: key, ...val[key]});  
      }  
    }  

    // Flatten into individual question items
    flatQuestionsList = [];
    for(let item of rawPool) {
      if(item.questions && Array.isArray(item.questions)) {
        for(let qIdx = 0; qIdx < item.questions.length; qIdx++) {
          if(item.questions[qIdx] !== undefined && item.questions[qIdx] !== "") {
            flatQuestionsList.push({
              itemData: item,
              questionIdx: qIdx,
              question: item.questions[qIdx],
              answer: item.answers ? item.answers[qIdx] : ""
            });
          }
        }
      }
    }

    // Shuffle the entire pool
    flatQuestionsList.sort(() => Math.random() - 0.5);
  }  
  
  function renderCurrentChallenge() {  
    if(revealTimeout) clearTimeout(revealTimeout);
    document.getElementById('correctAnswerPopup').style.display = 'none';

    if(activeAudio) { activeAudio.pause(); activeAudio = null; }  
      
    document.getElementById('game-img').style.display = 'none';  
    document.getElementById('game-video').style.display = 'none';  
    document.getElementById('audio-icon').style.display = 'none';  
    document.getElementById('replay-btn').style.display = 'none';  
    document.getElementById('answer-input').value = '';  

    if(currentPointer < 0 || currentPointer >= flatQuestionsList.length) return;

    const currentEntry = flatQuestionsList[currentPointer];
    const item = currentEntry.itemData;

    document.getElementById('question-text').innerText = currentEntry.question;  
      
    if(item.type === 'image'){  
      const img = document.getElementById('game-img');  
      img.src = item.data;  
      img.style.display = 'block';  
    } else if(item.type === 'video'){  
      const vid = document.getElementById('game-video');  
      vid.src = item.data;  
      vid.style.display = 'block';  
      vid.play().catch(e => console.log("Autoplay caught, user interaction needed."));  
      document.getElementById('replay-btn').style.display = 'block';  
    } else if(item.type === 'audio'){  
      document.getElementById('audio-icon').style.display = 'block';  
      activeAudio = new Audio(item.data);  
      activeAudio.play().catch(e => console.log("Autoplay caught, user interaction needed."));  
      document.getElementById('replay-btn').style.display = 'block';  
    }  
  }  
  
  document.getElementById('replay-btn').onclick = function() {  
    if(currentPointer < 0) return;
    const item = flatQuestionsList[currentPointer].itemData;
    if(item.type === 'video') {  
      const vid = document.getElementById('game-video');  
      vid.currentTime = 0;  
      vid.play();  
    } else if(item.type === 'audio' && activeAudio) {  
      activeAudio.currentTime = 0;  
      activeAudio.play();  
    }  
  };  

  // Next and Previous Button Navigation Handlers
  document.getElementById('prev-btn').onclick = function() {
    if(flatQuestionsList.length === 0) return;
    revealAnswerAndNavigate(-1);
  };

  document.getElementById('next-btn').onclick = function() {
    if(flatQuestionsList.length === 0) return;
    revealAnswerAndNavigate(1);
  };

  function revealAnswerAndNavigate(step) {
    if(activeAudio) activeAudio.pause();
    
    // Show current answer
    const currentEntry = flatQuestionsList[currentPointer];
    const correctAns = (currentEntry.answer || "").toString().trim();
    
    document.getElementById('revealedAnswerText').innerText = correctAns;
    document.getElementById('correctAnswerPopup').style.display = 'flex';

    if(revealTimeout) clearTimeout(revealTimeout);

    // Wait 5 seconds, reveal answer, then move to requested index
    revealTimeout = setTimeout(() => {
      document.getElementById('correctAnswerPopup').style.display = 'none';
      currentPointer = (currentPointer + step + flatQuestionsList.length) % flatQuestionsList.length;
      renderCurrentChallenge();
    }, 5000);
  }

  document.getElementById('submit-ans-btn').onclick = function() {  
    validateUserResponse();  
  };  
  
  function normalizeText(str) {
    if (!str) return "";
    return str.toString()
              .toLowerCase()
              .replace(/[^a-z0-9]/g, "")
              .trim();
  }

  async function validateUserResponse() {  
    if(currentPointer < 0 || currentPointer >= flatQuestionsList.length) return;  
      
    let userAnsRaw = document.getElementById('answer-input').value;  
    let currentEntry = flatQuestionsList[currentPointer];
    let correctAnsRaw = currentEntry.answer;  
  
    if(normalizeText(userAnsRaw) === normalizeText(correctAnsRaw)) {  
      score += 10;   
      document.getElementById('score').innerText = score;  
        
      await set(ref(db, `history/${uid}/${currentEntry.itemData.id}/${currentEntry.questionIdx}`), true);  
      
      currentPointer = (currentPointer + 1) % flatQuestionsList.length;
      renderCurrentChallenge();  
    } else {  
      // Show revealed answer modal on wrong submission, wait 5s then advance
      revealAnswerAndNavigate(1);
    }  
  }  
</script>  
</body>  
</html>
