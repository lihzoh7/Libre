<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MUUSTANDI WALLET</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  width: 100vw;
  padding: 10px;
  font-family: Arial, sans-serif;
  background: #001f3f;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow-x: hidden;
}

#wallet {
  width: 100%;
  height: 100%;
  min-height: 95vh;
  max-width: 100%;
  padding: 16px;
  text-align: center;
  background: #001428;
  border: 1px solid #004080;
  border-radius: 12px;
  box-shadow: 0 0 15px rgba(0,0,0,0.5);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.hawk-logo {
  display: block;
  width: 60px;
  height: 60px;
  object-fit: contain;
  margin: 0 auto 4px;
}

/* BANK DETAILS NAVIGATION LINK */
.bank-link {
  display: inline-block;
  color: #001f3f;
  background: #ffffff;
  padding: 6px 14px;
  border-radius: 6px;
  font-weight: bold;
  font-size: 14px;
  text-decoration: none;
  margin-bottom: 14px;
  box-shadow: 0 0 8px rgba(255,255,255,0.3);
  transition: background 0.2s;
}
.bank-link:hover {
  background: #e0e0e0;
}

.tiles {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  margin-bottom: 14px;
  align-items: stretch;
}

.tile {
  min-width: 0;
  min-height: 83px;
  padding: 12px 4px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
  background: #003366;
  border: 1px solid #004080;
  border-radius: 8px;
  font-size: clamp(14px, 3.5vw, 18px);
  font-weight: bold;
  overflow-wrap: anywhere;
}

.balance-tile {
  background: #004080;
  border-color: #00f0ff;
  color: #00f0ff;
}

.tile-label {
  font-size: 11px;
  letter-spacing: 0.5px;
  color: #c8eaff;
}

/* CASH OUT BUTTON TILE */
.cashout-tile {
  background: #004080;
  border-color: #00f0ff;
  color: #00f0ff;
  cursor: pointer;
  text-decoration: none;
  transition: background 0.2s, transform 0.2s;
}
.cashout-tile:hover {
  background: #0059b3;
}
.cashout-tile:disabled, .cashout-tile.disabled {
  background: #333333 !important;
  border-color: #555555 !important;
  color: #888888 !important;
  cursor: not-allowed !important;
  transform: none !important;
}

.buy-tile {
  padding: 6px 3px;
  background: #064c70;
  border: 1px solid #00f0ff;
  color: #00f0ff;
  cursor: pointer;
  transition: background 0.2s, transform 0.2s;
}

.buy-tile:hover {
  background: #08648e;
}

.buy-tile:active {
  transform: scale(0.97);
}

.buy-tile:disabled {
  opacity: 0.6;
  cursor: wait;
}

.buy-word {
  font-size: 20px;
  font-weight: 900;
  letter-spacing: 1px;
}

.buy-cost {
  font-size: 10px;
  line-height: 1.3;
  color: #ffffff;
  font-weight: normal;
}

.lives-tile {
  border-color: #e75d83;
  color: #ffffff;
}

.life-number {
  color: #ff668e;
  font-size: 22px;
}

.deposit-card {
  background: #002244;
  border: 1px solid #0055a5;
  padding: 15px;
  border-radius: 8px;
  margin-bottom: 12px;
  text-align: center;
}

.deposit-card h3 {
  margin: 0 0 10px;
  color: #ffcc00;
  font-size: 17px;
}

.min-cashout-label {
  display: block;
  font-size: 11px;
  color: #ffcc00;
  margin-top: 6px;
  font-style: italic;
}

.form-group {
  margin-bottom: 12px;
  text-align: left;
}

.form-group label {
  display: block;
  font-size: 12px;
  color: #ccc;
  margin-bottom: 5px;
}

.form-group input {
  display: block;
  width: 100%;
  min-width: 0;
  padding: 11px;
  border-radius: 5px;
  border: 1px solid #004080;
  background: #001020;
  color: #fff;
  font-size: 16px;
}

.submit-btn {
  width: 100%;
  padding: 12px 8px;
  background: #00f0ff;
  color: #001f3f;
  font-weight: bold;
  font-size: 14px;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}

.submit-btn:hover {
  background: #00c4d4;
}

.submit-btn:disabled {
  opacity: 0.6;
  cursor: wait;
}

#message {
  display: none;
  margin: 10px 0 0;
  padding: 9px;
  border-radius: 6px;
  font-size: 13px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

#message.success {
  display: block;
  color: #a8ffbf;
  background: #103b2a;
}

#message.error {
  display: block;
  color: #ffb3b3;
  background: #451d27;
}

#message.info {
  display: block;
  color: #b8edff;
  background: #12344b;
}
</style>
</head>

<body>
<div id="wallet">

  <div>
    <img class="hawk-logo" src="hawk.png" alt="Muustandi Hawk">
    <a href="bank.html" class="bank-link">BANK DETAILS</a>

    <div class="tiles">

      <div class="tile balance-tile">
        <span class="tile-label">CASH BALANCE</span>
        <span>R <span id="cashBalance">0.00</span></span>
      </div>

      <!-- CASH OUT TILE -->
      <button type="button" class="tile cashout-tile disabled" id="cashOutBtn" disabled>
        <span class="tile-label" style="color:#00f0ff;">ACTION</span>
        <span class="buy-word" style="font-size:16px;">Cash Out</span>
      </button>

      <button type="button" class="tile buy-tile" id="buyLife" aria-label="Buy one life for 50 cents">
        <span class="buy-word">BUY</span>
        <span class="buy-cost">1 Life Cost<br>50 cent</span>
      </button>

      <div class="tile lives-tile">
        <span class="tile-label">LIVES</span>
        <span class="life-number">❤️ <span id="lives">0</span></span>
      </div>

    </div>
  </div>

  <div class="deposit-card">
    <h3>TOP UP VIA 1VOUCHER</h3>

    <div class="form-group">
      <label for="depositAmount">Deposit Amount (Rand):</label>
      <input type="number" id="depositAmount" value="20" min="5" step="0.01" placeholder="e.g. 20">
    </div>

    <button class="submit-btn" id="submitVoucherBtn">
      CONTINUE TO 1VOUCHER PAYMENT
    </button>
    <span class="min-cashout-label">Minimum To Cash Out Is R50 And Above</span>
  </div>

  <div id="message" role="status" aria-live="polite"></div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getDatabase, ref, runTransaction, onValue, get, push } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBqJTLjxhZBCsvjrTH_cG0fkXlElG6BqTg",
  authDomain: "tose-ccf8f.firebaseapp.com",
  databaseURL: "https://tose-ccf8f-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "tose-ccf8f",
  storageBucket: "tose-ccf8f.appspot.com"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

let currentUid = null;
let walletListenerStartedFor = null;
let walletData = {};
let purchaseInProgress = false;

const cashBalanceElement = document.getElementById("cashBalance");
const livesElement = document.getElementById("lives");
const buyLifeButton = document.getElementById("buyLife");
const cashOutButton = document.getElementById("cashOutBtn");
const depositButton = document.getElementById("submitVoucherBtn");
const messageElement = document.getElementById("message");

function showMessage(message, type = "info") {
  messageElement.textContent = message;
  messageElement.className = type;
}

function clearMessage() {
  messageElement.textContent = "";
  messageElement.className = "";
}

function money(value) {
  const amount = Number(value);
  return Number.isFinite(amount) ? amount.toFixed(2) : "0.00";
}

function renderWallet(data = {}) {
  walletData = data;
  const balance = Number(data.cashBalance || 0);
  cashBalanceElement.textContent = money(balance);
  livesElement.textContent = String(Math.max(0, Number(data.lives) || 0));

  // Enable/Disable Cash Out button based on R50 minimum threshold
  if (balance >= 50) {
    cashOutButton.disabled = false;
    cashOutButton.classList.remove("disabled");
  } else {
    cashOutButton.disabled = true;
    cashOutButton.classList.add("disabled");
  }
}

onAuthStateChanged(auth, (user) => {
  currentUid = user ? user.uid : null;

  if (!currentUid) {
    walletListenerStartedFor = null;
    renderWallet({});
    buyLifeButton.disabled = true;
    depositButton.disabled = true;
    cashOutButton.disabled = true;
    cashOutButton.classList.add("disabled");

    showMessage("Please log in to view and use your wallet.", "info");
    return;
  }

  buyLifeButton.disabled = false;
  depositButton.disabled = false;

  if (walletListenerStartedFor === currentUid) {
    return;
  }

  walletListenerStartedFor = currentUid;
  listenToWalletUpdates(currentUid);
});

function listenToWalletUpdates(uid) {
  onValue(
    ref(db, "wallet/" + uid),
    (snapshot) => {
      const data = snapshot.val() || {};
      renderWallet(data);

      if (!purchaseInProgress) {
        clearMessage();
      }
    },
    (error) => {
      console.error("Wallet listener error:", error);
      showMessage("Unable to load your wallet. Please refresh and try again.", "error");
    }
  );
}

/* CASH OUT EVENT HANDLER */
cashOutButton.addEventListener("click", async () => {
  if (!currentUid) {
    showMessage("Please log in before initiating a cash out.", "error");
    return;
  }

  const currentBalance = Number(walletData.cashBalance || 0);
  if (currentBalance < 50) {
    showMessage("Minimum cash out amount is R50.", "error");
    return;
  }

  if (purchaseInProgress) return;
  purchaseInProgress = true;
  cashOutButton.disabled = true;
  cashOutButton.textContent = "Processing...";

  showMessage("Processing your cash out request...", "info");

  try {
    const uid = currentUid;
    const walletRef = ref(db, "wallet/" + uid);
    let cashOutAmount = 0;
    let userName = "Player";
    let userSurname = "";

    // Fetch user name and surname
    const userSnap = await get(ref(db, `users/${uid}`));
    if (userSnap.exists()) {
      const uData = userSnap.val();
      userName = uData.name || "Player";
      userSurname = uData.surname || "";
    }

    // Run transaction to deduct balance
    const result = await runTransaction(walletRef, (currentData) => {
      if (!currentData || Number(currentData.cashBalance || 0) < 50) {
        return; // Abort transaction
      }
      cashOutAmount = Number(currentData.cashBalance);
      return {
        ...currentData,
        cashBalance: 0, // Deduct total cash balance for cash out
        updatedAt: new Date().toISOString()
      };
    });

    if (!result.committed) {
      throw new Error("Cash out failed. Insufficient funds or network error.");
    }

    const timeIso = new Date().toISOString();
    const timeTimestamp = Date.now();
    const fullName = `${userName} ${userSurname}`.trim();

    // 1. Push record to admin cashouts collection
    await push(ref(db, "adminCashouts"), {
      uid: uid,
      name: fullName,
      amount: cashOutAmount,
      timestamp: timeTimestamp,
      timeString: timeIso,
      status: "PENDING"
    });

    // 2. Push notification message to player's notifications endpoint
    const notificationMsg = `${fullName} You have cashed out this amount R ${cashOutAmount.toFixed(2)}, Prizes Take 30 To 60 minutes to Reflect Please Be Patient With Us, Thank You`;
    await push(ref(db, `notifications/${uid}`), {
      message: notificationMsg,
      timestamp: timeTimestamp,
      read: false
    });

    renderWallet(result.snapshot.val() || {});
    showMessage(`Cash out request of R ${cashOutAmount.toFixed(2)} submitted successfully! Check your notifications.`, "success");

  } catch (error) {
    console.error("Cash out error:", error);
    showMessage(error.message || "Unable to complete cash out. Please try again.", "error");
  } finally {
    purchaseInProgress = false;
    cashOutButton.textContent = "Cash Out";
  }
});

buyLifeButton.addEventListener("click", async () => {
  if (!currentUid) {
    showMessage("Please log in before buying a life.", "error");
    return;
  }

  if (purchaseInProgress) return;
  purchaseInProgress = true;
  buyLifeButton.disabled = true;

  const originalButtonHTML = buyLifeButton.innerHTML;
  buyLifeButton.innerHTML = '<span class="buy-word">BUY...</span><span class="buy-cost">Please wait</span>';

  try {
    const uid = currentUid;
    const walletRef = ref(db, "wallet/" + uid);
    let purchaseCommitted = false;

    const result = await runTransaction(walletRef, (currentData) => {
      if (!currentData || Number(currentData.cashBalance || 0) < 0.50) return;
      purchaseCommitted = true;
      const cashCents = Math.round(Number(currentData.cashBalance) * 100);
      const currentLives = Number(currentData.lives || 0);
      return {
        ...currentData,
        cashBalance: (cashCents - 50) / 100,
        lives: currentLives + 1,
        updatedAt: new Date().toISOString()
      };
    });

    if (!result.committed || !purchaseCommitted) {
      showMessage("Insufficient cash balance. You need at least R0.50 to buy one life.", "error");
      return;
    }

    await push(ref(db, `lives_purchases/${uid}`), {
      count: 1,
      cost: 0.50,
      time: new Date().toISOString()
    });

    renderWallet(result.snapshot.val() || {});
    showMessage("Success! R0.50 was deducted and 1 life was added.", "success");
  } catch (error) {
    showMessage("Unable to complete the purchase.", "error");
  } finally {
    purchaseInProgress = false;
    buyLifeButton.disabled = !currentUid;
    buyLifeButton.innerHTML = originalButtonHTML;
  }
});

depositButton.addEventListener("click", async () => {
  const amountInput = document.getElementById("depositAmount");
  const amountRand = Number(amountInput.value);

  if (!Number.isFinite(amountRand) || amountRand < 5) {
    showMessage("Please enter a valid deposit amount. Minimum is R5.", "error");
    return;
  }

  if (!currentUid) {
    showMessage("Please log in to make a deposit.", "error");
    return;
  }

  const amountInCents = Math.round(amountRand * 100);
  depositButton.disabled = true;
  depositButton.textContent = "REDIRECTING...";

  try {
    let userFirstName = "Gamer";
    let userLastName = "Customer";
    const userSnapshot = await get(ref(db, "users/" + currentUid));
    if (userSnapshot.exists()) {
      const userData = userSnapshot.val();
      userFirstName = userData.name || "Gamer";
      userLastName = userData.surname || "Customer";
    }

    const response = await fetch("https://muustandibackend.onrender.com/deposit/1voucher", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ amountInCents, userId: currentUid, firstName: userFirstName, lastName: userLastName })
    });

    const result = await response.json();
    if (!response.ok || !result.success) throw new Error(result.message || "Failed to initialize payment.");
    window.location.href = result.redirectUri;
  } catch (error) {
    showMessage("Deposit error: " + error.message, "error");
    depositButton.disabled = false;
    depositButton.textContent = "CONTINUE TO 1VOUCHER PAYMENT";
  }
});
</script>

</body>
</html>
