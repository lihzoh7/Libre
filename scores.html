<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Leaderboard</title>

<style>
body{
  margin:0;
  background:#001f3f;
  color:white;
  font-family:Arial;
  text-align:center;
}

#date, #timer{
  font-size:42px;
  margin:10px;
  font-weight:bold;
}

#content{
  display:grid;
  grid-template-columns: repeat(3, 1fr);
  gap:10px;
  padding:10px;
}

.card{
  background:#002b55;
  padding:10px;
  border-radius:10px;
  font-size:18px;
}

.gold{ color:gold; }
.silver{ color:silver; }
.bronze{ color:#cd7f32; }
.normal{ color:#ccc; }

#rank{
  position:fixed;
  bottom:10px;
  left:10px;
  font-size:20px;
}

#popup{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:white;
  color:green;
  padding:40px;
  font-size:30px;
  display:none;
  border-radius:10px;
}
</style>
</head>

<body>

<div id="date"></div>
<div id="timer"></div>

<div id="content"></div>
<div id="rank">RANK: N/A</div>
<div id="popup"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

/* FIREBASE */
const app = initializeApp({
  apiKey: "AIzaSyBqJTLjxhZBCsvjrTH_cG0fkXlElG6BqTg",
  databaseURL: "https://tose-ccf8f-default-rtdb.europe-west1.firebasedatabase.app"
});

const db = getDatabase(app);
const auth = getAuth(app);

let currentUser = null;

/* =========================
   🇿🇦 SOUTH AFRICAN BOT SYSTEM
========================= */

const firstNames = [
"Thabo","Sipho","Lethabo","Pieter","Johan","Mandla","Kagiso","Sanele","Bongani","Nandi",
"Zanele","Lerato","Tshepo","Karabo","Andile","Ayanda","Nomsa","Themba","Vusi","Dineo"
];

const surnames = [
"Nkosi","Mkhize","Dlamini","Botha","Van Wyk","Naidoo","Zulu","Mokoena","Khumalo","Sithole",
"Van der Merwe","Nkuna","Baloyi","Ncube","Mahlangu","Motloung","Pillay","Govender","Maseko","Ngwenya"
];

/* CREATE 99 BOTS */
let bots = [];

function createBots(){
  bots = [];
  for(let i=0;i<99;i++){
    let name =
      firstNames[Math.floor(Math.random()*firstNames.length)] + " " +
      surnames[Math.floor(Math.random()*surnames.length)];

    bots.push({
      id: "bot"+i,
      name,
      score: Math.floor(Math.random()*1300),
      isBot:true
    });
  }
}

/* RANDOM BOT SCORE UPDATES (ARCade FEEL) */
function updateBots(){
  bots.forEach(b=>{
    let change = Math.floor(Math.random()*60 - 25); // -25 to +35
    b.score += change;
    if(b.score < 0) b.score = 0;
    if(b.score > 1300) b.score = 1300;
  });
}

/* =========================
   TIMER
========================= */
function updateTime(){
  let now = new Date();

  document.getElementById("date").innerText =
    now.toLocaleDateString() + " " + now.toLocaleTimeString();

  let end = new Date();

  if(now.getHours() < 17){
    end.setHours(17,30,0,0);
  } else {
    end.setDate(end.getDate()+1);
    end.setHours(5,30,0,0);
  }

  let diff = end - now;

  let h = Math.floor(diff/1000/60/60);
  let m = Math.floor((diff/1000/60)%60);

  document.getElementById("timer").innerText = `${h}H:${m}M`;
}
setInterval(updateTime,1000);

/* =========================
   LOAD USER
========================= */
onAuthStateChanged(auth, async (u)=>{
  if(!u) location.href="index.html";
  currentUser = u;

  createBots();
  startLoop();
});

/* =========================
   GET USER SCORE
========================= */
async function getUserScore(){
  if(!currentUser) return 0;

  const snap = await get(ref(db,"leaderboard/current/"+currentUser.uid));
  const data = snap.val();

  return data?.score || 0;
}

/* =========================
   MAIN LOOP
========================= */
async function startLoop(){

  setInterval(async ()=>{

    updateBots();

    let userScore = await getUserScore();

    let userName = "YOU";

    /* USER OBJECT */
    let user = {
      id: currentUser.uid,
      name: userName,
      score: userScore,
      isBot:false
    };

    /* MERGE */
    let all = [...bots, user];

    /* SORT */
    all.sort((a,b)=>b.score - a.score);

    /* RENDER TOP 65 */
    const content = document.getElementById("content");
    content.innerHTML="";

    all.slice(0,65).forEach((p,i)=>{

      let cls="normal";
      if(i===0) cls="gold";
      if(i===1) cls="silver";
      if(i===2) cls="bronze";

      let div = document.createElement("div");
      div.className="card "+cls;

      div.innerHTML = `
        <b>${i+1}. ${p.name}</b><br>
        ${p.score}
      `;

      content.appendChild(div);

      if(p.id === currentUser.uid){
        document.getElementById("rank").innerText = "RANK: " + (i+1);
      }
    });

  },2000);
}

</script>

</body>
  </html>
