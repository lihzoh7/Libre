<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Leaderboard</title>

<style>
body{
  margin:0;
  background:#001f3f;
  color:white;
  font-family:Arial;
  text-align:center;
}

/* ✅ SAME AS ADMIN */
#date, #timer{
  font-size:42px;
  margin:10px;
  font-weight:bold;
}

#content{
  display:grid;
  grid-template-columns: repeat(3, 1fr);
  gap:10px;
  padding:10px;
}

.card{
  background:#002b55;
  padding:10px;
  border-radius:10px;
  font-size:20px;
}

.gold{ color:gold; }
.silver{ color:silver; }
.bronze{ color:#cd7f32; }
.normal{ color:#ccc; }

#popup{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:white;
  color:green;
  padding:40px;
  font-size:30px;
  display:none;
  border-radius:10px;
}

#rank{
  position:fixed;
  bottom:10px;
  left:10px;
  font-size:20px;
}
</style>
</head>

<body>

<!-- ✅ NOW MATCHES ADMIN -->
<div id="date"></div>
<div id="timer"></div>

<div id="content"></div>
<div id="rank">RANK: N/A</div>
<div id="popup"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getDatabase, ref, onValue, set, get } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

const app = initializeApp({
  apiKey: "AIzaSyBqJTLjxhZBCsvjrTH_cG0fkXlElG6BqTg",
  databaseURL: "https://tose-ccf8f-default-rtdb.europe-west1.firebasedatabase.app"
});

const db = getDatabase(app);
const auth = getAuth(app);

let currentUser = null;
let resetLock = false;

onAuthStateChanged(auth,(u)=>{
  if(!u) location.href="index.html";
  currentUser = u;
});

/* ✅ FULL DATE + TIMER (MATCH ADMIN EXACTLY) */
/* ✅ DYNAMIC COUNTDOWN & BREAK SYSTEM */
function updateTime() {
  const now = new Date();
  const dateEl = document.getElementById("date");
  const timerEl = document.getElementById("timer");

  // Display current Date/Time
  dateEl.innerText = now.toLocaleDateString() + " " + now.toLocaleTimeString();

  const hours = now.getHours();
  const minutes = now.getMinutes();
  const currentTimeInMinutes = hours * 60 + minutes;

  // Define Time Markers in minutes from midnight
  const m530AM = 5 * 60 + 30; // 330
  const m600AM = 6 * 60;      // 360
  const m530PM = 17 * 60 + 30; // 1050
  const m600PM = 18 * 60;      // 1080

  let targetTime = new Date(now);
  let isBreak = false;

  // 1. Morning Break (05:30 - 06:00)
  if (currentTimeInMinutes >= m530AM && currentTimeInMinutes < m600AM) {
    isBreak = true;
  } 
  // 2. Daytime Active (06:00 - 17:30)
  else if (currentTimeInMinutes >= m600AM && currentTimeInMinutes < m530PM) {
    targetTime.setHours(17, 30, 0, 0);
  }
  // 3. Evening Break (17:30 - 18:00)
  else if (currentTimeInMinutes >= m530PM && currentTimeInMinutes < m600PM) {
    isBreak = true;
  }
  // 4. Nighttime Active (18:00 - 05:30 next day)
  else {
    // If it's after 6PM, the target is 5:30 AM tomorrow
    if (currentTimeInMinutes >= m600PM) {
      targetTime.setDate(now.getDate() + 1);
    }
    // If it's before 5:30 AM, target is 5:30 AM today
    targetTime.setHours(5, 30, 0, 0);
  }

  // Update UI
  if (isBreak) {
    timerEl.innerText = "BREAK TIME";
    timerEl.style.color = "orange"; // Optional: make it look distinct
  } else {
    const diff = targetTime - now;
    const h = Math.floor(diff / 1000 / 60 / 60);
    const m = Math.floor((diff / 1000 / 60) % 60);
    const s = Math.floor((diff / 1000) % 60); // Added seconds for better feel

    timerEl.innerText = `${h}H:${m}M:${s}S`;
    timerEl.style.color = "white";
  }
}


/* 🔥 RESET SYSTEM (UNCHANGED BUT CLEAN) */
async function checkReset(){
  let now = new Date();
  let h = now.getHours();
  let m = now.getMinutes();

  let isResetTime =
    (h === 5 && m === 30) ||
    (h === 17 && m === 30);

  if(!isResetTime){
    resetLock = false;
    return;
  }

  if(resetLock) return;
  resetLock = true;

  const lastResetSnap = await get(ref(db,"admin/lastReset"));
  const lastReset = lastResetSnap.val();

  const currentKey = `${h}:${m}`;

  if(lastReset === currentKey) return;

  const snap = await get(ref(db,"leaderboard/current"));
  const data = snap.val();

  if(data){
    await set(ref(db,"leaderboard/adminHistory/"+Date.now()), data);
  }

  await set(ref(db,"leaderboard/current"), null);
  await set(ref(db,"admin/lastReset"), currentKey);

  document.getElementById("popup").innerText="RESET!";
  document.getElementById("popup").style.display="block";

  setTimeout(()=>{
    document.getElementById("popup").style.display="none";
  },2000);
}
setInterval(checkReset,1000);

/* 📊 LEADERBOARD */
const content=document.getElementById("content");
const rankEl=document.getElementById("rank");

onValue(ref(db,"leaderboard/current"), snap=>{
  const data=snap.val()||{};
  let arr=[];

  for(let uid in data){
    arr.push({
      uid,
      name:data[uid].name || "Player",
      score:data[uid].score,
      time:data[uid].timestamp
    });
  }

  arr.sort((a,b)=>b.score-a.score);

  content.innerHTML="";

  arr.slice(0,75).forEach((p,i)=>{
    let cls="normal";
    if(i===0) cls="gold";
    if(i===1) cls="silver";
    if(i===2) cls="bronze";

    let date=new Date(p.time).toLocaleString();

    let div=document.createElement("div");
    div.className="card "+cls;

    div.innerHTML=`
      <b>${i+1}. ${p.name}</b><br>
      ${p.score}<br>
      <small>${date}</small>
    `;

    content.appendChild(div);

    if(currentUser && currentUser.uid===p.uid){
      rankEl.innerText="RANK: "+(i+1);
    }
  });

  if(!arr.find(p=>p.uid===currentUser?.uid)){
    rankEl.innerText="RANK: N/A";
  }
});
</script>

</body>
</html>
