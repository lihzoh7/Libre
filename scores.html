<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Leaderboard</title>

<style>
body{
  margin:0;
  background:#001f3f;
  color:white;
  font-family:Arial;
  text-align:center;
}

#timer{
  font-size:14px;
  margin:10px;
}

#grid{
  display:grid;
  grid-template-columns:repeat(25,1fr);
  gap:4px;
  padding:10px;
}

.player{
  padding:6px;
  font-size:14px;
  border-bottom:1px solid #333;
}

.gold{color:gold;}
.silver{color:silver;}
.bronze{color:#cd7f32;}
.normal{color:#ccc;}

#popup{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:white;
  color:green;
  padding:30px;
  font-size:22px;
  display:none;
}
</style>
</head>

<body>

<div id="timer"></div>
<div id="grid"></div>
<div id="popup"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBqJTLjxhZBCsvjrTH_cG0fkXlElG6BqJ",
  authDomain: "tose-ccf8f.firebaseapp.com",
  databaseURL: "https://tose-ccf8f-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "tose-ccf8f",
  storageBucket: "tose-ccf8f.appspot.com",
  messagingSenderId: "475447495901",
  appId: "1:475447495901:web:9189276a162a3680afdf34"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const grid = document.getElementById("grid");
const popup = document.getElementById("popup");
const timer = document.getElementById("timer");

/* ⏰ TIME SYSTEM */
function getSlotTimes(){
  const now = new Date();
  let start,end;

  let h = now.getHours();
  let m = now.getMinutes();

  let t = h*60+m;

  if(t>=360 && t<=1050){ // 06:00 - 17:30
    start = new Date(now.setHours(6,0,0,0));
    end = new Date(now.setHours(17,30,0,0));
  }else if(t>=1080 || t<=330){ // 18:00 - 05:30
    start = new Date();
    end = new Date();

    if(t>=1080){
      start.setHours(18,0,0,0);
      end.setDate(end.getDate()+1);
      end.setHours(5,30,0,0);
    }else{
      start.setDate(start.getDate()-1);
      start.setHours(18,0,0,0);
      end.setHours(5,30,0,0);
    }
  }

  return {start,end};
}

function updateTimer(){
  const {start,end} = getSlotTimes();
  const now = new Date();

  let diff = end - now;

  if(diff<0) diff=0;

  let h = Math.floor(diff/1000/60/60);
  let m = Math.floor((diff/1000/60)%60);

  timer.innerText = `${h}H:${m}M`;
}

setInterval(updateTimer,1000);

/* 🔥 RESET SYSTEM */
function handlePhase(){
  const now = new Date();
  const m = now.getMinutes();

  if(m>=28 && m<30){
    popup.innerText="RESETTING...";
    popup.style.display="block";
    set(ref(db,"leaderboard/current"), null);
  }
  else if(m>=30 && m<31){
    popup.innerText="GETTING READY...";
    popup.style.display="block";
  }
  else{
    popup.style.display="none";
  }
}

setInterval(handlePhase,1000);

/* 🏆 LEADERBOARD */
onValue(ref(db,"leaderboard/current"), snap=>{
  const data = snap.val()||{};
  let arr=[];

  for(let uid in data){
    arr.push(data[uid]);
  }

  arr.sort((a,b)=>b.score-a.score);

  grid.innerHTML="";

  arr.slice(0,75).forEach((p,i)=>{
    let cls="normal";
    if(i===0) cls="gold";
    else if(i===1) cls="silver";
    else if(i===2) cls="bronze";

    grid.innerHTML+=`
      <div class="player ${cls}">
        ${i+1}. ${p.name} - ${p.score}
      </div>
    `;
  });
});
</script>

</body>
  </html>
