<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Leaderboard</title>

<style>
body{
  margin:0;
  background:#001f3f;
  color:white;
  font-family:Arial;
  text-align:center;
}

/* HEADER */
#topBar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px;
}

#timer{
  font-size:32px;
  font-weight:bold;
}

#date{
  font-size:18px;
}

/* GRID */
#content{
  display:grid;
  grid-template-columns: repeat(3, 1fr);
  gap:10px;
  padding:10px;
}

.card{
  background:#002b55;
  padding:10px;
  border-radius:10px;
  font-size:20px;
}

/* COLORS */
.gold{ color:gold; }
.silver{ color:silver; }
.bronze{ color:#cd7f32; }
.normal{ color:#ccc; }

/* POPUP */
#popup{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:white;
  color:green;
  padding:40px;
  font-size:30px;
  display:none;
  border-radius:10px;
}

/* RANK */
#rank{
  position:fixed;
  bottom:10px;
  left:10px;
  font-size:20px;
}
</style>
</head>

<body>

<div id="topBar">
  <div id="timer">--:--</div>
  <div id="date"></div>
</div>

<div id="content"></div>

<div id="rank">RANK: N/A</div>
<div id="popup"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBqJTLjxhZBCsvjrTH_cG0fkXlElG6BqTg",
  authDomain: "tose-ccf8f.firebaseapp.com",
  databaseURL: "https://tose-ccf8f-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "tose-ccf8f"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

let currentUser=null;

/* AUTH */
onAuthStateChanged(auth,(u)=>{
  if(!u) location.href="index.html";
  currentUser=u;
});

/* 🧠 SLOT START (IMPORTANT FIX) */
function getSlotStart(){
  let now = new Date();
  let start = new Date();

  let total = now.getHours()*60 + now.getMinutes();

  let morningStart = 6*60;
  let morningEnd = 17*60+30;
  let nightStart = 18*60;

  // MORNING SLOT
  if(total >= morningStart && total <= morningEnd){
    start.setHours(6,0,0,0);
    return start.getTime();
  }

  // NIGHT SLOT SAME DAY
  if(total >= nightStart){
    start.setHours(18,0,0,0);
    return start.getTime();
  }

  // NIGHT SLOT AFTER MIDNIGHT
  if(total <= 5*60+30){
    start.setDate(start.getDate()-1);
    start.setHours(18,0,0,0);
    return start.getTime();
  }

  return null;
}

/* ⏱ TIMER */
function updateTimer(){
  let now = new Date();
  let total = now.getHours()*60 + now.getMinutes();
  let end = new Date();

  let morningStart = 6*60;
  let morningEnd = 17*60+30;
  let nightStart = 18*60;
  let nightEnd = 5*60+30;

  let diff = 0;

  if(total >= morningStart && total <= morningEnd){
    end.setHours(17,30,0,0);
    diff = end - now;
  }
  else if(total >= nightStart){
    end.setDate(end.getDate()+1);
    end.setHours(5,30,0,0);
    diff = end - now;
  }
  else if(total <= nightEnd){
    end.setHours(5,30,0,0);
    diff = end - now;
  }
  else{
    document.getElementById("timer").innerText = "BREAK";
    return;
  }

  let h = Math.floor(diff/1000/60/60);
  let m = Math.floor((diff/1000/60)%60);

  document.getElementById("timer").innerText = `${h}H:${m}M`;
}
setInterval(updateTimer,1000);

/* 📅 DATE */
function updateDate(){
  let now = new Date();
  document.getElementById("date").innerText =
    now.toLocaleString();
}
setInterval(updateDate,1000);

/* 🔥 PHASE HANDLER */
const popup=document.getElementById("popup");

setInterval(()=>{
  let now = new Date();
  let minutes = now.getMinutes();

  // only trigger once at exact reset window
  if(minutes === 29 || minutes === 59){
    popup.innerText="RESETTING...";
    popup.style.display="block";

    // optional cleanup
    set(ref(db,"leaderboard/current"),null);
  } else {
    popup.style.display="none";
  }
},60000); // check every minute (FIXED)

/* 📊 LEADERBOARD */
const content=document.getElementById("content");
const rankEl=document.getElementById("rank");

onValue(ref(db,"leaderboard/current"), snap=>{
  const data=snap.val()||{};
  let arr=[];

  const slotStart = getSlotStart();

  for(let uid in data){
    let p = data[uid];

    if(!p.timestamp) continue;

    // ✅ FILTER OLD SCORES
    if(slotStart && p.timestamp < slotStart) continue;

    arr.push({
      uid,
      name:p.name || "Player",
      score:p.score,
      time:p.timestamp
    });
  }

  arr.sort((a,b)=>b.score-a.score);

  content.innerHTML="";

  arr.slice(0,75).forEach((p,i)=>{
    let cls="normal";
    if(i===0) cls="gold";
    if(i===1) cls="silver";
    if(i===2) cls="bronze";

    let date=new Date(p.time).toLocaleString();

    let div=document.createElement("div");
    div.className="card "+cls;

    div.innerHTML=`
      <b>${i+1}. ${p.name}</b><br>
      ${p.score}<br>
      <small>${date}</small>
    `;

    content.appendChild(div);

    if(currentUser && currentUser.uid===p.uid){
      rankEl.innerText="RANK: "+(i+1);
    }
  });

  if(!arr.find(p=>p.uid===currentUser?.uid)){
    rankEl.innerText="RANK: N/A";
  }
});
</script>

</body>
</html>
