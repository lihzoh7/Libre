<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Leaderboard</title>

<style>
body{
  margin:0;
  background:#001f3f;
  color:white;
  font-family:Arial;
  overflow-x:hidden;
}

#date,#timer{
  text-align:center;
  font-size:38px;
  margin-top:10px;
  font-weight:bold;
}

#content{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  padding:10px;
}

.card{
  background:#002b55;
  border-radius:10px;
  padding:10px;
  font-size:18px;
}

.gold{color:gold;}
.silver{color:silver;}
.bronze{color:#cd7f32;}
.normal{color:white;}

#rank{
  position:fixed;
  bottom:10px;
  left:10px;
  font-size:20px;
  font-weight:bold;
}

#myscore{
  position:fixed;
  bottom:10px;
  right:10px;
  font-size:20px;
  font-weight:bold;
}

#breakPopup{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:white;
  color:red;
  padding:40px;
  border-radius:15px;
  font-size:50px;
  display:none;
  z-index:999;
}
</style>
</head>

<body>

<div id="date"></div>
<div id="timer"></div>

<div id="content"></div>

<div id="rank">RANK: N/A</div>
<div id="myscore">SCORE: 0</div>

<div id="breakPopup">BREAK</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";

import {
getDatabase,
ref,
onValue,
set,
get,
update,
remove
} from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

import {
getAuth,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

const app = initializeApp({
apiKey:"AIzaSyBqJTLjxhZBCsvjrTH_cG0fkXlElG6BqTg",
databaseURL:"https://tose-ccf8f-default-rtdb.europe-west1.firebasedatabase.app"
});

const db=getDatabase(app);
const auth=getAuth(app);

let currentUser=null;
let breakMode=false;

/* =========================
   SOUTH AFRICAN BOT NAMES
========================= */

const names=[
"Thabo","Sipho","Lebo","Ayanda","Sanele",
"Nkosi","Lunga","Musa","Sandile","Themba",
"Katlego","Bongani","Zanele","Naledi","Nandi",
"Khaya","Vusi","Sibusiso","Mpho","Aphiwe",
"Yanga","Luyanda","Simphiwe","Anele","Mandla"
];

const surnames=[
"Dlamini","Nkosi","Zulu","Khumalo","Mokoena",
"Ndlovu","Mabaso","Buthelezi","Cele","Shabalala",
"Ngcobo","Mthembu","Mahlangu","Mokoena","Zulu",
"Khoza","Molefe","Mkhize","Radebe","Ntuli"
];

/* =========================
   CREATE BOTS
========================= */

async function createBots(){

const snap=await get(ref(db,"leaderboard/bots"));

if(snap.exists()) return;

let bots={};

for(let i=1;i<=100;i++){

let score=Math.floor(Math.random()*250);

if(Math.random()<0.15){
score=Math.floor(Math.random()*1450);
}

bots["bot"+i]={
name:
names[Math.floor(Math.random()*names.length)]
+" "+
surnames[Math.floor(Math.random()*surnames.length)],

score,
timestamp:Date.now(),
bot:true
};
}

await set(ref(db,"leaderboard/bots"),bots);
}

createBots();

/* =========================
   RANDOM BOT UPDATES
========================= */

function randomBotUpdates(){

setInterval(async ()=>{

if(breakMode) return;

const snap=await get(ref(db,"leaderboard/bots"));
const data=snap.val()||{};

let keys=Object.keys(data);

for(let i=0;i<keys.length;i++){

if(Math.random()<0.22){

let id=keys[i];
let bot=data[id];

let increase=Math.floor(Math.random()*35);

if(bot.score<200){
increase=Math.floor(Math.random()*15);
}

if(bot.score>1000){
increase=Math.floor(Math.random()*6);
}

bot.score+=increase;

if(bot.score>1450){
bot.score=1450;
}

await update(ref(db,"leaderboard/bots/"+id),{
score:bot.score,
timestamp:Date.now()
});
}
}

},30000);

/* 45s */

setInterval(async ()=>{

if(breakMode) return;

const snap=await get(ref(db,"leaderboard/bots"));
const data=snap.val()||{};

let keys=Object.keys(data);

for(let i=0;i<keys.length;i++){

if(Math.random()<0.15){

let id=keys[i];

let newName=
names[Math.floor(Math.random()*names.length)]
+" "+
surnames[Math.floor(Math.random()*surnames.length)];

await update(ref(db,"leaderboard/bots/"+id),{
name:newName,
score:Math.floor(Math.random()*700),
timestamp:Date.now()
});
}
}

},45000);

/* 50s */

setInterval(async ()=>{

if(breakMode) return;

const snap=await get(ref(db,"leaderboard/bots"));
const data=snap.val()||{};

let keys=Object.keys(data);

for(let i=0;i<keys.length;i++){

if(Math.random()<0.08){

let id=keys[i];

await update(ref(db,"leaderboard/bots/"+id),{
score:Math.floor(Math.random()*1450),
timestamp:Date.now()
});
}
}

},50000);

}

randomBotUpdates();

/* =========================
   TIME
========================= */

function updateClock(){

let now=new Date();

document.getElementById("date").innerText=
now.toLocaleDateString()+" "+
now.toLocaleTimeString();

let end=new Date();

if(now.getHours()<17){
end.setHours(17,30,0,0);
}else{
end.setDate(end.getDate()+1);
end.setHours(5,30,0,0);
}

let diff=end-now;

let h=Math.floor(diff/1000/60/60);
let m=Math.floor((diff/1000/60)%60);

document.getElementById("timer").innerText=
`${h}H : ${m}M`;
}

setInterval(updateClock,1000);

/* =========================
   BREAK SYSTEM
========================= */

async function checkBreak(){

let now=new Date();

let h=now.getHours();
let m=now.getMinutes();

let breakTime=
(h===5 && m>=30 && m<60) ||
(h===17 && m>=30);

if(breakTime){

breakMode=true;

document.getElementById("breakPopup").style.display="block";

await set(ref(db,"leaderboard/break"),true);

}else{

document.getElementById("breakPopup").style.display="none";

const snap=await get(ref(db,"leaderboard/break"));

if(snap.val()===true){

breakMode=false;

await set(ref(db,"leaderboard/current"),null);
await remove(ref(db,"leaderboard/bots"));

await createBots();

await set(ref(db,"leaderboard/break"),false);
}
}
}

setInterval(checkBreak,1000);

/* =========================
   AUTH
========================= */

onAuthStateChanged(auth,(u)=>{

if(!u){
location.href="index.html";
return;
}

currentUser=u;

});

/* =========================
   LEADERBOARD DISPLAY
========================= */

const content=document.getElementById("content");

onValue(ref(db),snap=>{

const root=snap.val()||{};

const players=root.leaderboard?.current||{};
const bots=root.leaderboard?.bots||{};

let arr=[];

/* REAL PLAYERS */

for(let uid in players){

arr.push({
uid,
name:players[uid].name||"Player",
score:players[uid].score||0,
timestamp:players[uid].timestamp||0,
bot:false
});
}

/* BOTS */

for(let uid in bots){

arr.push({
uid,
name:bots[uid].name,
score:bots[uid].score,
timestamp:bots[uid].timestamp,
bot:true
});
}

arr.sort((a,b)=>b.score-a.score);

content.innerHTML="";

arr.slice(0,65).forEach((p,i)=>{

let cls="normal";

if(i===0) cls="gold";
if(i===1) cls="silver";
if(i===2) cls="bronze";

let div=document.createElement("div");

div.className="card "+cls;

div.innerHTML=`
<b>${i+1}. ${p.name}</b><br>
Score: ${p.score}<br>
<small>${new Date(p.timestamp).toLocaleString()}</small>
`;

content.appendChild(div);
});

/* USER RANK */

if(currentUser){

let myIndex=arr.findIndex(x=>x.uid===currentUser.uid);

if(myIndex!==-1){

document.getElementById("rank").innerText=
"RANK: "+(myIndex+1);

document.getElementById("myscore").innerText=
"SCORE: "+arr[myIndex].score;

}else{

document.getElementById("rank").innerText="RANK: N/A";
}
}

});
</script>

</body>
  </html>
