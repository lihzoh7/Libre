<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Scores</title>

<style>
body{
  background:#001f3f;
  color:white;
  font-family:Arial;
  text-align:center;
}

.tab{
  display:inline-block;
  padding:15px 30px;
  margin:10px;
  font-size:22px;
  background:#003366;
  cursor:pointer;
}

.active{ background:#0074D9; }

#content{
  width:90%;
  max-width:500px;
  margin:20px auto;
}

.score{
  font-size:28px;
  padding:15px;
  display:flex;
  justify-content:space-between;
  border-bottom:1px solid #444;
}

#rankBox{
  position:fixed;
  bottom:10px;
  left:10px;
  font-size:20px;
}

#popup{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:white;
  color:green;
  padding:40px;
  font-size:28px;
  display:none;
}
</style>
</head>

<body>

<div>
  <div id="highTab" class="tab active">HIGH SCORES</div>
  <div id="leaderTab" class="tab">LEADERBOARD</div>
</div>

<div id="content"></div>
<div id="rankBox">RANK: N/A</div>
<div id="popup"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getDatabase, ref, get, onValue, set } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";
import { getAuth } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

const app = initializeApp({
  apiKey:"AIzaSyBqJTLjxhZBCsvjrTH_cG0fkXlElG6BqTg",
  databaseURL:"https://tose-ccf8f-default-rtdb.europe-west1.firebasedatabase.app"
});

const db = getDatabase(app);
const auth = getAuth(app);

const content = document.getElementById("content");
const popup = document.getElementById("popup");
const rankBox = document.getElementById("rankBox");

let user = null;

/* ================= TIME SYSTEM ================= */

function getPhase(){
  let now = new Date();
  let m = now.getMinutes();

  if(m < 28) return "game";
  if(m < 30) return "reset";
  return "ready";
}

function handlePhase(){
  let phase = getPhase();

  if(phase==="reset"){
    popup.innerText="RESETTING...";
    popup.style.display="block";
    set(ref(db,"leaderboard/current"), null);
  }
  else if(phase==="ready"){
    popup.innerText="GETTING READY...";
    popup.style.display="block";
  }
  else{
    popup.style.display="none";
  }
}
setInterval(handlePhase,1000);

/* ================= HIGH SCORES ================= */

async function loadHigh(){
  const snap = await get(ref(db,"highScores"));
  const data = snap.val()||{};

  let bestPerUser = {};

  for(let uid in data){
    let max = 0;
    let time = 0;

    for(let k in data[uid]){
      let s = data[uid][k];
      if(s.score > max){
        max = s.score;
        time = s.timestamp;
      }
    }

    bestPerUser[uid] = {score:max, timestamp:time};
  }

  let arr = Object.values(bestPerUser);
  arr.sort((a,b)=>b.score-a.score);
  arr = arr.slice(0,5);

  content.innerHTML="";

  arr.forEach((s,i)=>{
    content.innerHTML += `
      <div class="score">
        <span>${i+1}. ${s.score}</span>
        <span>${new Date(s.timestamp).toLocaleString()}</span>
      </div>
    `;
  });
}

/* ================= LEADERBOARD ================= */

function loadLeaderboard(){
  onValue(ref(db,"leaderboard/current"), snap=>{
    let data = snap.val()||{};
    let arr = Object.values(data);

    arr.sort((a,b)=>b.score-a.score);

    content.innerHTML="";

    arr.slice(0,20).forEach((s,i)=>{
      content.innerHTML+=`
        <div class="score">
          <span>${i+1}. ${s.name || "Player"}</span>
          <span>${s.score}</span>
        </div>
      `;
    });

    updateRank(arr);
  });
}

/* ================= RANK ================= */

function updateRank(arr){
  if(!user){
    rankBox.innerText="RANK: N/A";
    return;
  }

  let index = arr.findIndex(p=>p.email===user.email);

  if(index === -1){
    rankBox.innerText="RANK: N/A";
  }else{
    rankBox.innerText="RANK: " + (index+1);
  }
}

/* ================= SWITCH ================= */

highTab.onclick=()=>{
  highTab.classList.add("active");
  leaderTab.classList.remove("active");
  loadHigh();
};

leaderTab.onclick=()=>{
  leaderTab.classList.add("active");
  highTab.classList.remove("active");
  loadLeaderboard();
};

import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
onAuthStateChanged(auth,(u)=>{
  if(!u) location.href="index.html";
  user=u;
});

loadHigh();
</script>

</body>
  </html>
