<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leaderboard - Player Claims</title>

<style>
body{
  margin:0;
  background:#001f3f;
  color:white;
  font-family:Arial;
  text-align:center;
  padding: 12px;
}

#header-title{
  font-size:36px;
  margin:15px 0;
  font-weight:bold;
  color: #00f0ff;
  text-transform: uppercase;
  letter-spacing: 2px;
  text-shadow: 0 0 10px rgba(0,240,255,0.6);
}

#content{
  display:grid;
  grid-template-columns: repeat(3, 1fr);
  gap:10px;
  padding:10px;
  max-width: 600px;
  margin: 0 auto;
}

.card{
  background:#002b55;
  padding:15px 10px;
  border-radius:10px;
  border: 1px solid #004080;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.score-text{
  color: gold;
  font-weight: bold;
  font-size: 20px;
}

.card small{
  color: #c8eaff;
  font-size: 11px;
  line-height: 1.3;
}

/* CLAIM BUTTONS */
.claim-btn{
  background: #28a745;
  color: white;
  border: none;
  padding: 8px 12px;
  border-radius: 6px;
  font-weight: bold;
  cursor: pointer;
  font-size: 13px;
  width: 100%;
  transition: background 0.2s;
}
.claim-btn:hover{
  background: #218838;
}

.claimed-btn{
  background: #6c757d;
  color: #d6d6d6;
  border: none;
  padding: 8px 12px;
  border-radius: 6px;
  font-weight: bold;
  cursor: not-allowed;
  font-size: 13px;
  width: 100%;
}

.insufficient-lbl{
  color: #adb5bd;
  font-size: 11px;
  font-style: italic;
  font-weight: bold;
  padding: 6px;
}

#popup{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:#111;
  color:#a8ffbf;
  border: 2px solid #28a745;
  padding:30px;
  font-size:22px;
  display:none;
  border-radius:12px;
  z-index: 1000;
  box-shadow: 0 0 25px rgba(0,0,0,0.9);
}
</style>
</head>

<body>

<div id="header-title">EARNINGS</div>

<div id="content"></div>
<div id="popup"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getDatabase, ref, onValue, set, runTransaction } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

const app = initializeApp({
  apiKey: "AIzaSyBqJTLjxhZBCsvjrTH_cG0fkXlElG6BqTg",
  databaseURL: "https://tose-ccf8f-default-rtdb.europe-west1.firebasedatabase.app"
});

const db = getDatabase(app);
const auth = getAuth(app);

onAuthStateChanged(auth, (u) => {
  if(!u) {
    location.href = "index.html";
    return;
  }
  initPlayerEarnings(u.uid);
});

function initPlayerEarnings(uid){
  const content = document.getElementById("content");

  // ✅ Listens to the exact database path where the game writes earnings entries
  onValue(ref(db, "earnings/" + uid), snap => {
    const data = snap.val() || {};
    let arr = [];

    for(let entryId in data){
      arr.push({
        id: entryId,
        score: Number(data[entryId].score || 0),
        time: data[entryId].timestamp || Date.now(),
        claimed: data[entryId].claimed || false
      });
    }

    // Sort newest first
    arr.sort((a, b) => b.time - a.time);

    content.innerHTML = "";

    if(arr.length === 0){
      content.innerHTML = "<div class='card' style='grid-column: span 3;'>No game scores recorded yet. Play Ring-Master to generate earnings!</div>";
      return;
    }

    arr.forEach((item) => {
      let dateObj = new Date(item.time);
      let dateStr = dateObj.toLocaleDateString();
      let timeStr = dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      let div = document.createElement("div");
      div.className = "card";

      let actionHTML = "";

      if(item.score > 0){
        if(item.claimed){
          actionHTML = `<button class="claimed-btn" disabled>CLAIMED</button>`;
        } else {
          actionHTML = `<button class="claim-btn" data-id="${item.id}" data-score="${item.score}">CLAIM</button>`;
        }
      } else {
        actionHTML = `<span class="insufficient-lbl">Insufficient Funds</span>`;
      }

      div.innerHTML = `
        <div class="score-text">R ${item.score.toFixed(2)}</div>
        <small>${dateStr}<br>${timeStr}</small>
        ${actionHTML}
      `;

      content.appendChild(div);
    });

    // Attach click listeners to claim buttons
    document.querySelectorAll(".claim-btn").forEach(btn => {
      btn.addEventListener("click", async (e) => {
        let entryId = e.target.getAttribute("data-id");
        let claimAmount = parseFloat(e.target.getAttribute("data-score"));

        if(isNaN(claimAmount) || claimAmount <= 0) return;

        btn.disabled = true;
        btn.textContent = "CLAIMING...";

        try {
          // 1. Mark score as claimed in earnings history
          await set(ref(db, `earnings/${uid}/${entryId}/claimed`), true);

          // 2. Add amount securely to wallet cash balance via transaction
          const walletRef = ref(db, `wallet/${uid}`);
          await runTransaction(walletRef, (currentWallet) => {
            if(!currentWallet) currentWallet = { cashBalance: 0, lives: 0 };
            let currentBalance = Number(currentWallet.cashBalance || 0);
            return {
              ...currentWallet,
              cashBalance: currentBalance + claimAmount,
              updatedAt: new Date().toISOString()
            };
          });

          // Show success feedback popup
          let popupEl = document.getElementById("popup");
          popupEl.innerText = `Successfully Claimed R ${claimAmount.toFixed(2)}!`;
          popupEl.style.display = "block";
          setTimeout(() => {
            popupEl.style.display = "none";
          }, 2000);

        } catch(err) {
          console.error("Claim error:", err);
          alert("Failed to claim amount. Please try again.");
          btn.disabled = false;
          btn.textContent = "CLAIM";
        }
      });
    });

  });
}
</script>

</body>
</html>
