<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Scores</title>

<style>
body{
  background:#001f3f;
  color:white;
  font-family:Arial;
  text-align:center;
}

.tab{
  display:inline-block;
  padding:10px 20px;
  margin:5px;
  background:#003366;
  cursor:pointer;
}

.active{ background:#0074D9; }

.score{
  font-size:20px;
  padding:10px;
  border-bottom:1px solid #444;
}

#popup{
  position:fixed;
  top:40%;
  left:50%;
  transform:translate(-50%,-50%);
  background:white;
  color:green;
  padding:30px;
  font-size:24px;
  display:none;
}
</style>
</head>

<body>

<div>
  <div id="highTab" class="tab active">HIGH SCORES</div>
  <div id="leaderTab" class="tab">LEADERBOARD</div>
</div>

<div id="timer"></div>
<div id="content"></div>

<div id="popup"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getDatabase, ref, get, onValue, set } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";
import { getAuth } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

const app = initializeApp({
  apiKey:"AIzaSy...",
  databaseURL:"https://tose-ccf8f-default-rtdb.europe-west1.firebasedatabase.app"
});

const db = getDatabase(app);
const auth = getAuth(app);

const content = document.getElementById("content");
const popup = document.getElementById("popup");

let currentTab="high";

/* ---------------- TIME SYSTEM ---------------- */

function getPhase(){
  const now = new Date();
  const minutes = now.getMinutes();

  if(minutes < 28) return "game";
  if(minutes < 30) return "reset";
  if(minutes < 30.5) return "ready";
}

function handlePhase(){
  const phase = getPhase();

  if(phase==="reset"){
    popup.innerText="RESETTING...";
    popup.style.display="block";

    set(ref(db,"leaderboard/current"), null); // clear
  }
  else if(phase==="ready"){
    popup.innerText="GETTING READY...";
    popup.style.display="block";
  }
  else{
    popup.style.display="none";
  }
}

setInterval(handlePhase,1000);

/* ---------------- HIGH SCORES ---------------- */

async function loadHigh(){
  const snap = await get(ref(db,"highScores"));
  const data = snap.val() || {};

  let arr=[];

  for(let uid in data){
    for(let k in data[uid]){
      arr.push(data[uid][k]);
    }
  }

  arr.sort((a,b)=>b.score-a.score);

  arr = arr.slice(0,5);

  content.innerHTML="";

  arr.forEach((s,i)=>{
    content.innerHTML+=`
      <div class="score">
        ${i+1}. ${s.score}
      </div>
    `;
  });
}

/* ---------------- LEADERBOARD ---------------- */

function loadLeaderboard(){
  onValue(ref(db,"leaderboard/current"), snap=>{
    const data = snap.val()||{};
    let arr=[];

    for(let uid in data){
      arr.push(data[uid]);
    }

    arr.sort((a,b)=>b.score-a.score);

    content.innerHTML="";

    arr.slice(0,20).forEach((s,i)=>{
      content.innerHTML+=`
        <div class="score">
          ${i+1}. ${s.score}
        </div>
      `;
    });
  });
}

/* ---------------- SWITCH ---------------- */

highTab.onclick=()=>{
  currentTab="high";
  highTab.classList.add("active");
  leaderTab.classList.remove("active");
  loadHigh();
};

leaderTab.onclick=()=>{
  currentTab="leader";
  leaderTab.classList.add("active");
  highTab.classList.remove("active");
  loadLeaderboard();
};

loadHigh();

</script>
</body>
</html>
