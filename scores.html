<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Leaderboard</title>

<style>
body{
  margin:0;
  background:#001f3f;
  color:white;
  font-family:Arial;
  text-align:center;
}

#timer, #date{
  font-size:42px;
  margin:10px;
  font-weight:bold;
}

#content{
  display:grid;
  grid-template-columns: repeat(3, 1fr);
  gap:10px;
  padding:10px;
}

.card{
  background:#002b55;
  padding:10px;
  border-radius:10px;
  font-size:20px;
}

.gold{ color:gold; }
.silver{ color:silver; }
.bronze{ color:#cd7f32; }
.normal{ color:#ccc; }

#rank{
  position:fixed;
  bottom:10px;
  left:10px;
  font-size:20px;
}
</style>
</head>

<body>

<div id="date"></div>
<div id="timer">--:--</div>
<div id="content"></div>
<div id="rank">RANK: N/A</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

const app = initializeApp({
  apiKey: "AIzaSyBqJTLjxhZBCsvjrTH_cG0fkXlElG6BqTg",
  databaseURL: "https://tose-ccf8f-default-rtdb.europe-west1.firebasedatabase.app"
});

const db = getDatabase(app);
const auth = getAuth(app);

let currentUser = null;

onAuthStateChanged(auth,(u)=>{
  if(!u) location.href="index.html";
  currentUser = u;
});

/* DATE + TIMER */
function updateTime(){
  let now = new Date();

  document.getElementById("date").innerText =
    now.toLocaleDateString()+" "+now.toLocaleTimeString();

  let end = new Date();

  if(now.getHours() < 17){
    end.setHours(17,30,0,0);
  } else {
    end.setDate(end.getDate()+1);
    end.setHours(5,30,0,0);
  }

  let diff = end - now;

  let h = Math.floor(diff/1000/60/60);
  let m = Math.floor((diff/1000/60)%60);

  document.getElementById("timer").innerText = `${h}H:${m}M`;
}
setInterval(updateTime,1000);

/* LEADERBOARD */
const content=document.getElementById("content");
const rankEl=document.getElementById("rank");

onValue(ref(db,"leaderboard/current"), snap=>{
  const data=snap.val()||{};
  let arr=[];

  for(let uid in data){
    arr.push({uid,...data[uid]});
  }

  arr.sort((a,b)=>b.score-a.score);

  content.innerHTML="";

  arr.slice(0,75).forEach((p,i)=>{
    let cls = i===0?"gold":i===1?"silver":i===2?"bronze":"normal";

    let div=document.createElement("div");
    div.className="card "+cls;

    div.innerHTML=`
      <b>${i+1}. ${p.name}</b><br>
      ${p.score}
    `;

    content.appendChild(div);

    if(currentUser && currentUser.uid===p.uid){
      rankEl.innerText="RANK: "+(i+1);
    }
  });
});
</script>

</body>
</html>
