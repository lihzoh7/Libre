<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Leaderboard</title>

<style>
body{
  margin:0;
  background:#001f3f;
  color:white;
  font-family:Arial;
  text-align:center;
}

/* HEADER */
#timer{
  font-size:42px;
  margin:10px;
  font-weight:bold;
}

/* GRID = 3 COLUMNS */
#content{
  display:grid;
  grid-template-columns: repeat(3, 1fr);
  gap:10px;
  padding:10px;
}

/* PLAYER CARD */
.card{
  background:#002b55;
  padding:10px;
  border-radius:10px;
  font-size:20px;
}

/* COLORS */
.gold{ color:gold; }
.silver{ color:silver; }
.bronze{ color:#cd7f32; }
.normal{ color:#ccc; }

/* POPUP */
#popup{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:white;
  color:green;
  padding:40px;
  font-size:30px;
  display:none;
  border-radius:10px;
}

/* RANK */
#rank{
  position:fixed;
  bottom:10px;
  left:10px;
  font-size:20px;
}
</style>
</head>

<body>
<div id="date"></div>
<div id="timer">--:--</div>

<div id="content"></div>

<div id="rank">RANK: N/A</div>

<div id="popup"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBqJTLjxhZBCsvjrTH_cG0fkXlElG6BqTg",
  authDomain: "tose-ccf8f.firebaseapp.com",
  databaseURL: "https://tose-ccf8f-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "tose-ccf8f",
  storageBucket: "tose-ccf8f.appspot.com",
  messagingSenderId: "475447495901",
  appId: "1:475447495901:web:9189276a162a3680afdf34"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

let currentUser=null;

/* AUTH */
onAuthStateChanged(auth,(u)=>{
  if(!u) location.href="index.html";
  currentUser=u;
});

/* ⏰ SLOT SYSTEM */
function getSlotStart(){

  let now = new Date();
  let start = new Date();

  let h = now.getHours();
  let m = now.getMinutes();
  let total = h*60+m;

  let morningStart = 6*60;
  let morningEnd = 17*60+30;
  let nightStart = 18*60;

  // 🌅 MORNING SLOT
  if(total >= morningStart && total <= morningEnd){
    start.setHours(6,0,0,0);
    return start.getTime();
  }

  // 🌙 NIGHT SLOT (same day)
  if(total >= nightStart){
    start.setHours(18,0,0,0);
    return start.getTime();
  }

  // 🌙 NIGHT SLOT (after midnight)
  if(total <= 5*60+30){
    start.setDate(start.getDate()-1); // go to yesterday
    start.setHours(18,0,0,0);
    return start.getTime();
  }

  return null;
}
function updateDate(){
  let now = new Date();
  document.getElementById("date").innerText =
    now.toLocaleString();
}
setInterval(updateDate,1000);
  
/* ⏱ TIMER */
function updateTimer(){
  let now = new Date();

  let h = now.getHours();
  let m = now.getMinutes();
  let total = h*60 + m;

  let end = new Date();

  let morningStart = 6*60;
  let morningEnd = 17*60+30;

  let nightStart = 18*60;
  let nightEnd = 5*60+30;

  let diff = 0;

  // ✅ MORNING SLOT (06:00 - 17:30)
  if(total >= morningStart && total <= morningEnd){
    end.setHours(17,30,0,0);
    diff = end - now;
  }

  // ✅ NIGHT SLOT (18:00 - 23:59)
  else if(total >= nightStart){
    end.setDate(end.getDate()+1);
    end.setHours(5,30,0,0);
    diff = end - now;
  }

  // ✅ NIGHT SLOT CONTINUED (00:00 - 05:30)
  else if(total <= nightEnd){
    end.setHours(5,30,0,0);
    diff = end - now;
  }

  // ❌ BREAK TIME (17:30 - 18:00)
  else{
    document.getElementById("timer").innerText = "00H:00M";
    return;
  }

  let hours = Math.floor(diff / 1000 / 60 / 60);
  let minutes = Math.floor((diff / 1000 / 60) % 60);

  document.getElementById("timer").innerText =
    `${hours}H:${minutes}M`;
  }
setInterval(updateTimer,1000);

/* 🔥 PHASE HANDLER */
const popup=document.getElementById("popup");

setInterval(()=>{
  let phase=getPhase();

  if(phase==="reset"){
    popup.innerText="RESETTING...";
    popup.style.display="block";
    set(ref(db,"leaderboard/current"),null);
  }
  else if(phase==="break"){
    popup.innerText="GETTING READY...";
    popup.style.display="block";
  }
  else{
    popup.style.display="none";
  }
},1000);

/* 📊 LEADERBOARD */
const content=document.getElementById("content");
const rankEl=document.getElementById("rank");

onValue(ref(db,"leaderboard/current"), snap=>{
  const data=snap.val()||{};
  let arr=[];

  const slotStart = getSlotStart();

for(let uid in data){

  let player = data[uid];

  if(!player.timestamp) continue;

  // ❌ IGNORE OLD SLOT SCORES
  if(player.timestamp < slotStart) continue;

  arr.push({
    uid,
    name:player.name || "Player",
    score:player.score,
    time:player.timestamp
  });
  }

  arr.sort((a,b)=>b.score-a.score);

  content.innerHTML="";

  arr.slice(0,75).forEach((p,i)=>{
    let cls="normal";
    if(i===0) cls="gold";
    if(i===1) cls="silver";
    if(i===2) cls="bronze";

    let date=new Date(p.time).toLocaleString();

    let div=document.createElement("div");
    div.className="card "+cls;

    div.innerHTML=`
      <b>${i+1}. ${p.name}</b><br>
      ${p.score}<br>
      <small>${date}</small>
    `;

    content.appendChild(div);

    if(currentUser && currentUser.uid===p.uid){
      rankEl.innerText="RANK: "+(i+1);
    }
  });

  if(!arr.find(p=>p.uid===currentUser?.uid)){
    rankEl.innerText="RANK: N/A";
  }
});
</script>

</body>
  </html>
