<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Leaderboard</title>

<style>
body{
  margin:0;
  background:#001f3f;
  color:white;
  font-family:Arial;
  text-align:center;
}

#date{
  font-size:32px;
  font-weight:bold;
  margin-top:10px;
}

#timer{
  font-size:42px;
  font-weight:bold;
  margin:10px;
}

#status{
  font-size:24px;
  margin-bottom:10px;
  color:gold;
}

#content{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  padding:10px;
}

.card{
  background:#002b55;
  padding:10px;
  border-radius:10px;
  font-size:20px;
}

.gold{color:gold;}
.silver{color:silver;}
.bronze{color:#cd7f32;}
.normal{color:#ccc;}

#rank{
  position:fixed;
  bottom:10px;
  left:10px;
  font-size:20px;
}

#popup{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:white;
  color:green;
  padding:30px;
  border-radius:10px;
  display:none;
  font-size:26px;
  z-index:999;
}
</style>
</head>

<body>

<div id="date"></div>
<div id="timer"></div>
<div id="status">LOADING...</div>

<div id="content"></div>

<div id="rank">
RANK: N/A
</div>

<div id="popup"></div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";

import {
getDatabase,
ref,
get,
set,
onValue
}
from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

import {
getAuth,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

const app = initializeApp({
 apiKey:"AIzaSyBqJTLjxhZBCsvjrTH_cG0fkXlElG6BqTg",
 databaseURL:"https://tose-ccf8f-default-rtdb.europe-west1.firebasedatabase.app"
});

const db = getDatabase(app);
const auth = getAuth(app);

const content = document.getElementById("content");
const rankEl = document.getElementById("rank");
const timerEl = document.getElementById("timer");
const dateEl = document.getElementById("date");
const statusEl = document.getElementById("status");
const popup = document.getElementById("popup");

let currentUser = null;

let freezeLock = false;
let clearLock = false;

onAuthStateChanged(auth,(u)=>{

 if(!u){
   location.href="index.html";
   return;
 }

 currentUser = u;

});

/* ==========================
   ROUND TIMES
========================== */

const rounds = [

 {start:8,end:8.5},
 {start:9,end:9.5},
 {start:10,end:10.5},
 {start:11,end:11.5},
 {start:12,end:12.5}

];

/* ==========================
   DATE DISPLAY
========================== */

function updateDate(){

 const now = new Date();

 dateEl.innerText =
 now.toLocaleDateString() +
 " " +
 now.toLocaleTimeString();

}

setInterval(updateDate,1000);

/* ==========================
   FIND CURRENT STATE
========================== */

function getState(){

 const now = new Date();

 const h = now.getHours();
 const m = now.getMinutes();

 const current =
 h + (m/60);

 if(current >= 8 && current < 8.5){

   return {
     mode:"active",
     endsAt:new Date(
       now.getFullYear(),
       now.getMonth(),
       now.getDate(),
       8,
       30,
       0
     )
   };

 }

 if(current >= 8.5 && current < 9){

   return {
     mode:"frozen",
     opensAt:new Date(
       now.getFullYear(),
       now.getMonth(),
       now.getDate(),
       9,
       0,
       0
     )
   };

 }

 if(current >= 9 && current < 9.5){

   return {
     mode:"active",
     endsAt:new Date(
       now.getFullYear(),
       now.getMonth(),
       now.getDate(),
       9,
       30,
       0
     )
   };

 }

 if(current >= 9.5 && current < 10){

   return {
     mode:"frozen",
     opensAt:new Date(
       now.getFullYear(),
       now.getMonth(),
       now.getDate(),
       10,
       0,
       0
     )
   };

 }

 if(current >= 10 && current < 10.5){

   return {
     mode:"active",
     endsAt:new Date(
       now.getFullYear(),
       now.getMonth(),
       now.getDate(),
       10,
       30,
       0
     )
   };

 }

 if(current >= 10.5 && current < 11){

   return {
     mode:"frozen",
     opensAt:new Date(
       now.getFullYear(),
       now.getMonth(),
       now.getDate(),
       11,
       0,
       0
     )
   };

 }

 if(current >= 11 && current < 11.5){

   return {
     mode:"active",
     endsAt:new Date(
       now.getFullYear(),
       now.getMonth(),
       now.getDate(),
       11,
       30,
       0
     )
   };

 }

 if(current >= 11.5 && current < 12){

   return {
     mode:"frozen",
     opensAt:new Date(
       now.getFullYear(),
       now.getMonth(),
       now.getDate(),
       12,
       0,
       0
     )
   };

 }

 if(current >= 12 && current < 12.5){

   return {
     mode:"active",
     endsAt:new Date(
       now.getFullYear(),
       now.getMonth(),
       now.getDate(),
       12,
       30,
       0
     )
   };

 }

 return {
   mode:"night"
 };

}
/* ==========================
   COUNTDOWN DISPLAY
========================== */

function updateTimer(){

 const state = getState();
 const now = new Date();

 if(state.mode === "active"){

   const diff = state.endsAt - now;

   const h = Math.floor(diff/1000/60/60);
   const m = Math.floor((diff/1000/60)%60);
   const s = Math.floor((diff/1000)%60);

   statusEl.innerText = "ROUND ACTIVE";

   timerEl.innerText =
   String(h).padStart(2,"0")+":"+
   String(m).padStart(2,"0")+":"+
   String(s).padStart(2,"0");

 }

 else if(state.mode === "frozen"){

   const diff = state.opensAt - now;

   const h = Math.floor(diff/1000/60/60);
   const m = Math.floor((diff/1000/60)%60);
   const s = Math.floor((diff/1000)%60);

   statusEl.innerText = "LEADERBOARD FROZEN";

   timerEl.innerText =
   String(h).padStart(2,"0")+":"+
   String(m).padStart(2,"0")+":"+
   String(s).padStart(2,"0");

 }

 else{

   statusEl.innerText =
   "NEXT ROUND OPENS AT 08:00";

   timerEl.innerText = "--:--:--";

 }

}

setInterval(updateTimer,1000);

/* ==========================
   WINNER CAPTURE
========================== */

async function captureWinner(){

 const snap =
 await get(ref(db,"leaderboard/current"));

 const data = snap.val();

 if(!data) return;

 let arr = [];

 for(let uid in data){

   arr.push({
     uid,
     name:data[uid].name || "",
     surname:data[uid].surname || "",
     score:data[uid].score || 0,
     timestamp:data[uid].timestamp || Date.now()
   });

 }

 arr.sort((a,b)=>b.score-a.score);

 if(arr.length===0) return;

 const winner = arr[0];

 const winnerKey = Date.now();

 await set(
   ref(db,"winners/"+winnerKey),
   {
     uid:winner.uid,
     name:winner.name,
     surname:winner.surname,
     score:winner.score,
     timestamp:winnerKey
   }
 );

 popup.innerText =
 "WINNER SAVED";

 popup.style.display="block";

 setTimeout(()=>{
   popup.style.display="none";
 },2000);

}

/* ==========================
   FREEZE / UNFREEZE
========================== */

async function updateFreezeState(){

 const now = new Date();

 const h = now.getHours();
 const m = now.getMinutes();

 const state = getState();

 if(state.mode === "active"){

   await set(
     ref(db,"leaderboard/status/frozen"),
     false
   );

 }

 else{

   await set(
     ref(db,"leaderboard/status/frozen"),
     true
   );

 }

}

setInterval(updateFreezeState,5000);

/* ==========================
   ROUND END CHECK
========================== */

async function checkRoundEnd(){

 const now = new Date();

 const h = now.getHours();
 const m = now.getMinutes();

 const key = h + ":" + m;

 const lastSnap =
 await get(ref(db,"leaderboard/lastWinner"));

 const lastWinner = lastSnap.val();

 const captureTimes = [
   "8:30",
   "9:30",
   "10:30",
   "11:30",
   "12:30"
 ];

 if(
   captureTimes.includes(key)
   &&
   lastWinner !== key
 ){

   await captureWinner();

   await set(
     ref(db,"leaderboard/lastWinner"),
     key
   );

 }

}

setInterval(checkRoundEnd,1000);

/* ==========================
   CLEAR BOARD AT :55
========================== */

async function checkClear(){

 const now = new Date();

 const h = now.getHours();
 const m = now.getMinutes();

 const key = h + ":" + m;

 const clearTimes = [
   "8:55",
   "9:55",
   "10:55",
   "11:55",
   "7:55"
 ];

 const lastSnap =
 await get(ref(db,"leaderboard/lastClear"));

 const lastClear = lastSnap.val();

 if(
   clearTimes.includes(key)
   &&
   lastClear !== key
 ){

   await set(
     ref(db,"leaderboard/current"),
     null
   );

   await set(
     ref(db,"leaderboard/lastClear"),
     key
   );

   popup.innerText =
   "LEADERBOARD CLEARED";

   popup.style.display="block";

   setTimeout(()=>{
     popup.style.display="none";
   },2000);

 }

}

setInterval(checkClear,1000);

/* ==========================
   LEADERBOARD DISPLAY
========================== */

onValue(
 ref(db,"leaderboard/current"),
 snap=>{

 const data = snap.val() || {};

 let arr=[];

 for(let uid in data){

   arr.push({
     uid,
     name:data[uid].name || "Player",
     surname:data[uid].surname || "",
     score:data[uid].score || 0,
     time:data[uid].timestamp || 0
   });

 }

 arr.sort((a,b)=>b.score-a.score);

 content.innerHTML="";

 arr.slice(0,75).forEach((p,i)=>{

   let cls="normal";

   if(i===0) cls="gold";
   if(i===1) cls="silver";
   if(i===2) cls="bronze";

   const date =
   new Date(p.time)
   .toLocaleString();

   const div =
   document.createElement("div");

   div.className =
   "card "+cls;

   div.innerHTML = `
   <b>${i+1}. ${p.name}</b><br>
   ${p.score}<br>
   <small>${date}</small>
   `;

   content.appendChild(div);

   if(
     currentUser &&
     currentUser.uid === p.uid
   ){
     rankEl.innerText =
     "RANK: "+(i+1);
   }

 });

 if(
   !arr.find(
     p=>p.uid===currentUser?.uid
   )
 ){
   rankEl.innerText =
   "RANK: N/A";
 }

});

/* START */

updateDate();
updateTimer();

</script>

</body>
  </html>
