<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Leaderboard</title>

<style>

body{
  margin:0;
  background:#001f3f;
  color:white;
  font-family:Arial;
  text-align:center;
  overflow-x:hidden;
}

/* DATE + TIMER */

#date,
#timer{
  font-size:42px;
  margin:10px;
  font-weight:bold;
}

/* LEADERBOARD GRID */

#content{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  padding:10px;
}

.card{
  background:#002b55;
  padding:10px;
  border-radius:10px;
  font-size:20px;
  word-break:break-word;
}

.gold{
  color:gold;
}

.silver{
  color:silver;
}

.bronze{
  color:#cd7f32;
}

.normal{
  color:#ccc;
}

/* POPUP */

#popup{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:white;
  color:green;
  padding:40px;
  font-size:30px;
  display:none;
  border-radius:10px;
  z-index:999;
}

/* PLAYER RANK */

#rank{
  position:fixed;
  bottom:10px;
  left:10px;
  font-size:20px;
  z-index:1000;
}

/* WINNER OVERLAY */

#winnerOverlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.70);
  display:none;
  overflow-y:auto;
  z-index:5000;
  padding-top:100px;
  box-sizing:border-box;
}

#winnerTitle{
  text-align:center;
  font-size:60px;
  font-weight:bold;
  color:white;
  opacity:0.18;
}

#winnerDate{
  text-align:center;
  font-size:22px;
  color:white;
  margin-top:10px;
  margin-bottom:40px;
  opacity:0.18;
}

#winnerBoard{
  width:95%;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  padding-bottom:40px;
}

.winnerCard{
  background:#002b55;
  padding:10px;
  border-radius:10px;
  font-size:20px;
}

/* MOBILE */

@media(max-width:900px){

  #content,
  #winnerBoard{
    grid-template-columns:repeat(2,1fr);
  }

}

@media(max-width:600px){

  #date,
  #timer{
    font-size:28px;
  }

  #content,
  #winnerBoard{
    grid-template-columns:1fr;
  }

  .card,
  .winnerCard{
    font-size:18px;
  }

  #winnerTitle{
    font-size:45px;
  }

}

</style>
</head>

<body>

<div id="date"></div>
<div id="timer"></div>

<div id="content"></div>

<div id="rank">
  RANK: N/A
</div>

<div id="popup"></div>

<!-- WINNER OVERLAY -->

<div id="winnerOverlay">

  <div id="winnerTitle">
    WINNERS
  </div>

  <div id="winnerDate"></div>

  <div id="winnerBoard"></div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";

import {
  getDatabase,
  ref,
  onValue,
  set,
  get
}
from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

import {
  getAuth,
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

/* FIREBASE */

const app = initializeApp({

  apiKey: "AIzaSyBqJTLjxhZBCsvjrTH_cG0fkXlElG6BqTg",

  databaseURL:
  "https://tose-ccf8f-default-rtdb.europe-west1.firebasedatabase.app"

});

const db = getDatabase(app);
const auth = getAuth(app);

let currentUser = null;

/* RESET LOCK */

let resetLock = false;

/* FREEZE SYSTEM */

let frozen = false;

/* 30 MINUTE START */

let countdownStart = Date.now();

/* AUTH */

onAuthStateChanged(auth,(u)=>{

  if(!u){

    location.href = "index.html";

    return;
  }

  currentUser = u;

});

/* DATE + COUNTDOWN */

function updateTime(){

  let now = new Date();

  document.getElementById("date").innerText =

    now.toLocaleDateString() + " " +

    now.toLocaleTimeString();

  /* STOP TIMER IF FROZEN */

  if(frozen){

    document.getElementById("timer").innerText =
      "COMPETITION ENDED";

    return;
  }

  /* 30 MINUTES */

  let duration = 30 * 60 * 1000;

  let diff = duration - (Date.now() - countdownStart);

  /* FREEZE */

  if(diff <= 0){

    freezeLeaderboard();

    return;
  }

  let m = Math.floor(diff / 1000 / 60);

  let s = Math.floor((diff / 1000) % 60);

  document.getElementById("timer").innerText =

    `${m}M:${s}S`;

}

setInterval(updateTime,1000);

/* FREEZE LEADERBOARD */

function freezeLeaderboard(){

  if(frozen) return;

  frozen = true;

  const overlay =
    document.getElementById("winnerOverlay");

  const board =
    document.getElementById("winnerBoard");

  /* SHOW OVERLAY */

  overlay.style.display = "block";

  /* DATE */

  document.getElementById("winnerDate").innerText =

    new Date().toLocaleString();

  /* COPY LEADERBOARD */

  board.innerHTML = content.innerHTML;

}

/* RESET SYSTEM */

async function checkReset(){

  let resetSnap =
    await get(ref(db,"admin/resetTrigger"));

  let resetValue = resetSnap.val();

  if(!resetValue) return;

}

/* OPTIONAL POPUP RESET */

async function doReset(){

  if(resetLock) return;

  resetLock = true;

  /* SAVE HISTORY */

  const snap =
    await get(ref(db,"leaderboard/current"));

  const data = snap.val();

  if(data){

    await set(

      ref(db,"leaderboard/adminHistory/" + Date.now()),

      data

    );

  }

  /* CLEAR CURRENT */

  await set(ref(db,"leaderboard/current"), null);

  /* RESET TIMER */

  frozen = false;

  countdownStart = Date.now();

  /* HIDE WINNER SCREEN */

  document.getElementById("winnerOverlay").style.display =
    "none";

  /* RESET POPUP */

  document.getElementById("popup").innerText =
    "RESET!";

  document.getElementById("popup").style.display =
    "block";

  setTimeout(()=>{

    document.getElementById("popup").style.display =
      "none";

    resetLock = false;

  },2000);

}

/* ADMIN RESET LISTENER */

onValue(ref(db,"admin/resetTrigger"), ()=>{

  doReset();

});

/* LEADERBOARD */

const content =
  document.getElementById("content");

const rankEl =
  document.getElementById("rank");

/* LIVE LEADERBOARD */

onValue(ref(db,"leaderboard/current"), snap=>{

  /* STOP LIVE CHANGES IF FROZEN */

  if(frozen) return;

  const data = snap.val() || {};

  let arr = [];

  for(let uid in data){

    arr.push({

      uid,

      name:data[uid].name || "Player",

      score:data[uid].score || 0,

      time:data[uid].timestamp || Date.now()

    });

  }

  /* SORT */

  arr.sort((a,b)=>b.score-a.score);

  content.innerHTML = "";

  /* TOP 75 */

  arr.slice(0,75).forEach((p,i)=>{

    let cls = "normal";

    if(i===0) cls = "gold";

    if(i===1) cls = "silver";

    if(i===2) cls = "bronze";

    let date =
      new Date(p.time).toLocaleString();

    let div =
      document.createElement("div");

    div.className =
      "card " + cls;

    div.innerHTML = `

      <b>${i+1}. ${p.name}</b><br>

      ${p.score}<br>

      <small>${date}</small>

    `;

    content.appendChild(div);

    /* PLAYER RANK */

    if(currentUser &&
       currentUser.uid === p.uid){

      rankEl.innerText =
        "RANK: " + (i+1);

    }

  });

  /* PLAYER NOT FOUND */

  if(!arr.find(p=>p.uid===currentUser?.uid)){

    rankEl.innerText = "RANK: N/A";

  }

});

</script>

</body>
  </html>
