<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Scores</title>

<style>
body{
  background:#001f3f;
  color:white;
  font-family:Arial;
  text-align:center;
}

.tab{
  display:inline-block;
  padding:10px 20px;
  margin:5px;
  background:#003366;
  cursor:pointer;
}

.active{ background:#0074D9; }

.score{
  font-size:20px;
  padding:10px;
  border-bottom:1px solid #444;
}

#popup{
  position:fixed;
  top:40%;
  left:50%;
  transform:translate(-50%,-50%);
  background:white;
  color:green;
  padding:30px;
  font-size:24px;
  display:none;
}
</style>
</head>

<body>

<div>
  <div id="highTab" class="tab active">HIGH SCORES</div>
  <div id="rankBox">RANK: <span id="rank">N/A</span></div>
  <div id="leaderTab" class="tab">LEADERBOARD</div>
</div>

<div id="timer"></div>
<div id="content"></div>

<div id="popup"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getDatabase, ref, get, onValue, set } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";
import { getAuth } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

const app = initializeApp({
  apiKey:"AIzaSy...",
  databaseURL:"https://tose-ccf8f-default-rtdb.europe-west1.firebasedatabase.app"
});

const db = getDatabase(app);
const auth = getAuth(app);

const content = document.getElementById("content");
const popup = document.getElementById("popup");

let currentTab="high";

/* ---------------- TIME SYSTEM ---------------- */

function getSlotInfo(){
  const now = new Date();
  const h = now.getHours();
  const m = now.getMinutes();

  const currentMinutes = h*60 + m;

  const morningStart = 6*60;
  const morningEnd = 17*60+30;

  const nightStart = 18*60;
  const nightEnd = 5*60+30;

  let phase = "closed";

  if(currentMinutes >= morningStart && currentMinutes <= morningEnd){
    phase = "game";
  }
  else if(currentMinutes >= morningEnd && currentMinutes <= morningEnd+2){
    phase = "reset";
  }
  else if(currentMinutes >= morningEnd+2 && currentMinutes <= morningEnd+2.5){
    phase = "ready";
  }

  // SAME for night slot
  if(currentMinutes >= nightStart || currentMinutes <= nightEnd){
    phase = "game";
  }

  return phase;
  }

let resetDone = false;

function handlePhase(){
  const phase = getSlotInfo();

  if(phase==="reset"){
    popup.innerText="RESETTING...";
    popup.style.display="block";

    if(!resetDone){
      resetDone = true;

      // 🔥 CLEAR leaderboard
      set(ref(db,"leaderboard/current"), null);

      // 🔥 RESET rank tracking
      set(ref(db,"leaderboard/ranks"), null);
    }
  }
  else if(phase==="ready"){
    popup.innerText="GETTING READY...";
    popup.style.display="block";
  }
  else if(phase==="game"){
    popup.style.display="none";
    resetDone = false;
  }
}

setInterval(handlePhase,1000);

/* ---------------- HIGH SCORES ---------------- */

async function loadHigh(){
  const snap = await get(ref(db,"highScores"));
  const data = snap.val() || {};

  let bestPerUser = {};

  for(let uid in data){
    let max = 0;

    for(let k in data[uid]){
      max = Math.max(max, data[uid][k].score);
    }

    bestPerUser[uid] = max;
  }

  let arr = Object.values(bestPerUser);

  arr.sort((a,b)=>b-a);
  arr = arr.slice(0,5);

  content.innerHTML="";

  arr.forEach((score,i)=>{
    content.innerHTML+=`
      <div class="score" style="font-size:32px;">
        ${i+1}. ${score}
      </div>
    `;
  });
  }

/* ---------------- LEADERBOARD ---------------- */

function loadLeaderboard(){
  onValue(ref(db,"leaderboard/current"), snap=>{
    const data = snap.val()||{};
    let arr=[];

    for(let uid in data){
      arr.push(data[uid]);
    }

    arr.sort((a,b)=>b.score-a.score);

    content.innerHTML="";

    arr.slice(0,20).forEach((s,i)=>{
      content.innerHTML+=`
        <div class="score">
          ${i+1}. ${s.score}
        </div>
      `;
    });
  });
}
function loadPlayerRank(userId){
  onValue(ref(db,"leaderboard/current"), snap=>{
    const data = snap.val() || {};
    let arr=[];

    for(let uid in data){
      arr.push({uid, score:data[uid].score});
    }

    arr.sort((a,b)=>b.score-a.score);

    let rank = arr.findIndex(x=>x.uid===userId);

    document.getElementById("rank").innerText =
      rank >= 0 ? (rank+1) : "N/A";
  });
      }
  
/* ---------------- SWITCH ---------------- */

highTab.onclick=()=>{
  currentTab="high";
  highTab.classList.add("active");
  leaderTab.classList.remove("active");
  loadHigh();
};

leaderTab.onclick=()=>{
  currentTab="leader";
  leaderTab.classList.add("active");
  highTab.classList.remove("active");
  loadLeaderboard();
};

loadHigh();

</script>
</body>
</html>
