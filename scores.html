<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Earnings - Claims Ledger</title>

<style>
* {
  box-sizing: border-box;
}

body{
  margin:0;
  background:#001f3f;
  color:white;
  font-family:Arial;
  text-align:center;
  padding: 12px;
}

.top-bar{
  position: relative;
  max-width: 600px;
  margin: 10px auto 18px auto;
  display: flex;
  justify-content: center;
  align-items: center;
}

#header-title{
  font-size:32px;
  font-weight:bold;
  color: #00f0ff;
  text-transform: uppercase;
  letter-spacing: 2px;
  text-shadow: 0 0 10px rgba(0,240,255,0.6);
}

#clearBtn{
  position: absolute;
  right: 0;
  top: 50%;
  transform: translateY(-50%);
  background: #ff9999;
  color: #2b0000;
  border: 1px solid #ff6b6b;
  padding: 7px 12px;
  border-radius: 6px;
  font-weight: bold;
  font-size: 12px;
  cursor: pointer;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  transition: background 0.2s, transform 0.1s;
}

#clearBtn:hover:not(:disabled){
  background: #ff7b7b;
}

#clearBtn:active:not(:disabled){
  transform: translateY(-50%) scale(0.97);
}

#clearBtn:disabled{
  opacity: 0.5;
  cursor: not-allowed;
}

#content{
  display:grid;
  grid-template-columns: repeat(3, 1fr);
  gap:10px;
  padding:10px;
  max-width: 600px;
  margin: 0 auto;
}

.card{
  background:#002b55;
  padding:15px 10px;
  border-radius:10px;
  border: 1px solid #004080;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.score-text{
  color: gold;
  font-weight: bold;
  font-size: 20px;
}

.card small{
  color: #c8eaff;
  font-size: 11px;
  line-height: 1.3;
}

/* CLAIM BUTTONS */
.claim-btn{
  background: #28a745;
  color: white;
  border: none;
  padding: 8px 12px;
  border-radius: 6px;
  font-weight: bold;
  cursor: pointer;
  font-size: 13px;
  width: 100%;
  transition: background 0.2s;
}
.claim-btn:hover{
  background: #218838;
}

.claimed-btn{
  background: #6c757d;
  color: #d6d6d6;
  border: none;
  padding: 8px 12px;
  border-radius: 6px;
  font-weight: bold;
  cursor: not-allowed;
  font-size: 13px;
  width: 100%;
}

.insufficient-lbl{
  color: #adb5bd;
  font-size: 11px;
  font-style: italic;
  font-weight: bold;
  padding: 6px;
}

#popup{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:#111;
  color:#a8ffbf;
  border: 2px solid #28a745;
  padding:30px;
  font-size:22px;
  display:none;
  border-radius:12px;
  z-index: 1000;
  box-shadow: 0 0 25px rgba(0,0,0,0.9);
}
</style>
</head>

<body>

<div class="top-bar">
  <div id="header-title">EARNINGS</div>
  <button type="button" id="clearBtn">CLEAR</button>
</div>

<div id="content"></div>
<div id="popup"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getDatabase, ref, onValue, set, remove, runTransaction } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBqJTLjxhZBCsvjrTH_cG0fkXlElG6BqTg",
  authDomain: "tose-ccf8f.firebaseapp.com",
  databaseURL: "https://tose-ccf8f-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "tose-ccf8f",
  storageBucket: "tose-ccf8f.appspot.com",
  messagingSenderId: "475447495901",
  appId: "1:475447495901:web:9189276a162a3680afdf34"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

let claimsInFlight = new Set();
let activeUid = null;

function formatDateTimeKey(ts) {
  const d = new Date(ts);
  const dd = String(d.getDate()).padStart(2, "0");
  const mm = String(d.getMonth() + 1).padStart(2, "0");
  const yyyy = d.getFullYear();
  const hh = String(d.getHours()).padStart(2, "0");
  const min = String(d.getMinutes()).padStart(2, "0");
  return `${dd}/${mm}/${yyyy} ${hh}:${min}`;
}

document.getElementById("clearBtn").addEventListener("click", async () => {
  if (!activeUid) return;
  const btn = document.getElementById("clearBtn");
  btn.disabled = true;
  btn.textContent = "CLEARING...";
  try {
    await remove(ref(db, "earnings/" + activeUid));
  } catch (err) {
    console.error("Clear error:", err);
    alert("Failed to clear earnings.");
  } finally {
    btn.disabled = false;
    btn.textContent = "CLEAR";
  }
});

onAuthStateChanged(auth, (u) => {
  if(!u) {
    location.href = "index.html";
    return;
  }
  activeUid = u.uid;
  initPlayerEarnings(u.uid);
});

function initPlayerEarnings(uid){
  const content = document.getElementById("content");

  onValue(ref(db, "earnings/" + uid), snap => {
    const data = snap.val() || {};
    const byDateMinute = new Map();

    for(let entryId in data){
      const raw = data[entryId] || {};
      const ts = Number(raw.timestamp || Date.now());
      const scoreVal = Number(raw.score || 0);
      const claimedVal = Boolean(raw.claimed);
      const dtKey = formatDateTimeKey(ts);

      const candidate = {
        id: entryId,
        score: scoreVal,
        time: ts,
        claimed: claimedVal,
        dtKey: dtKey
      };

      // Only allow ONE entry per date and time (DD/MM/YYYY HH:mm)
      if (!byDateMinute.has(dtKey)) {
        byDateMinute.set(dtKey, candidate);
      } else {
        const existing = byDateMinute.get(dtKey);
        // Prefer an already claimed record, or the newer/higher-scoring one for that minute
        if (
          (!existing.claimed && candidate.claimed) ||
          (existing.claimed === candidate.claimed && (candidate.time >= existing.time || candidate.score > existing.score))
        ) {
          byDateMinute.set(dtKey, candidate);
        }
      }
    }

    let arr = Array.from(byDateMinute.values());
    arr.sort((a, b) => b.time - a.time);

    content.innerHTML = "";

    if(arr.length === 0){
      content.innerHTML = "<div class='card' style='grid-column: span 3;'>No game scores recorded yet. Play Ring-Master to generate earnings!</div>";
      return;
    }

    arr.forEach((item) => {
      let dateObj = new Date(item.time);
      let dateStr = dateObj.toLocaleDateString("en-GB");
      let timeStr = dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      let div = document.createElement("div");
      div.className = "card";

      let actionHTML = "";
      let isBusy = claimsInFlight.has(item.id);

      if(item.score > 0){
        if(item.claimed){
          actionHTML = `<button class="claimed-btn" disabled>CLAIMED</button>`;
        } else if(isBusy){
          actionHTML = `<button class="claimed-btn" disabled>CLAIMING...</button>`;
        } else {
          actionHTML = `<button class="claim-btn" data-id="${item.id}" data-score="${item.score}">CLAIM</button>`;
        }
      } else {
        actionHTML = `<span class="insufficient-lbl">Insufficient<br>Funds</span>`;
      }

      div.innerHTML = `
        <div class="score-text">R ${item.score.toFixed(2)}</div>
        <small>${dateStr}<br>${timeStr}</small>
        ${actionHTML}
      `;

      content.appendChild(div);
    });

    document.querySelectorAll(".claim-btn").forEach(btn => {
      btn.addEventListener("click", async (e) => {
        let entryId = e.target.getAttribute("data-id");
        let claimAmount = parseFloat(e.target.getAttribute("data-score"));

        if(!entryId || isNaN(claimAmount) || claimAmount <= 0 || claimsInFlight.has(entryId)) return;

        claimsInFlight.add(entryId);
        btn.disabled = true;
        btn.textContent = "CLAIMING...";

        try {
          await set(ref(db, `earnings/${uid}/${entryId}/claimed`), true);

          const walletRef = ref(db, `wallet/${uid}`);
          await runTransaction(walletRef, (currentWallet) => {
            if(!currentWallet) currentWallet = { cashBalance: 0, lives: 0 };
            let currentBalance = Number(currentWallet.cashBalance || 0);
            return {
              ...currentWallet,
              cashBalance: Number((currentBalance + claimAmount).toFixed(2)),
              updatedAt: new Date().toISOString()
            };
          });

          let popupEl = document.getElementById("popup");
          popupEl.innerText = `Successfully Claimed R ${claimAmount.toFixed(2)}!`;
          popupEl.style.display = "block";
          setTimeout(() => {
            popupEl.style.display = "none";
          }, 2000);

        } catch(err) {
          console.error("Claim error:", err);
          alert("Failed to claim amount. Please check your connection and try again.");
          btn.disabled = false;
          btn.textContent = "CLAIM";
        } finally {
          claimsInFlight.delete(entryId);
        }
      });
    });

  });
}
</script>

</body>
</html>
