<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Leaderboard</title>

<style>
body{
  margin:0;
  background:#001f3f;
  color:white;
  font-family:Arial;
  text-align:center;
}

#date, #timer{
  font-size:42px;
  margin:10px;
  font-weight:bold;
}

#content{
  display:grid;
  grid-template-columns: repeat(3, 1fr);
  gap:10px;
  padding:10px;
}

.card{
  background:#002b55;
  padding:10px;
  border-radius:10px;
  font-size:20px;
}

.gold{ color:gold; }
.silver{ color:silver; }
.bronze{ color:#cd7f32; }
.normal{ color:#ccc; }

#popup{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:white;
  color:green;
  padding:40px;
  font-size:30px;
  display:none;
  border-radius:10px;
}

#rank{
  position:fixed;
  bottom:10px;
  left:10px;
  font-size:20px;
}
</style>
</head>

<body>

<div id="date"></div>
<div id="timer"></div>

<div id="content"></div>
<div id="rank">RANK: N/A</div>
<div id="popup"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getDatabase, ref, onValue, set, get } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

/* FIREBASE */
const app = initializeApp({
  apiKey: "AIzaSyBqJTLjxhZBCsvjrTH_cG0fkXlElG6BqTg",
  databaseURL: "https://tose-ccf8f-default-rtdb.europe-west1.firebasedatabase.app"
});

const db = getDatabase(app);
const auth = getAuth(app);

let currentUser = null;

/* =========================
   🇿🇦 SOUTH AFRICAN NAMES
========================= */
const firstNames = [
  "Thabo","Sipho","Lerato","Naledi","Kagiso","Sibusiso","Bongani",
  "Zanele","Mandla","Ayanda","Nandi","Tshiamo","Lukhanyo","Palesa",
  "Refilwe","Tshepo","Nokuthula","Vuyo","Simphiwe","Boitumelo"
];

const lastNames = [
  "Mokoena","Dlamini","Nkosi","Naidoo","van Wyk","Botha","Mabaso",
  "Khumalo","Mthembu","van der Merwe","Sithole","Ndlovu","Pretorius",
  "Ramaphosa","Maseko","Zuma","Bhengu","Hendricks","Jacobs","Pillay"
];

/* =========================
   🤖 BOT GENERATOR
========================= */
function createBots(count){
  let bots = [];

  for(let i=0;i<count;i++){
    let name =
      firstNames[Math.floor(Math.random()*firstNames.length)] + " " +
      lastNames[Math.floor(Math.random()*lastNames.length)];

    // 🎯 realistic arcade score (weighted randomness)
    let base = Math.random();
    let score;

    if(base < 0.2) score = Math.floor(Math.random()*300);        // low
    else if(base < 0.7) score = 300 + Math.floor(Math.random()*600); // mid
    else score = 900 + Math.floor(Math.random()*400);           // high

    bots.push({
      uid:"bot_"+i,
      name,
      score,
      time:Date.now() - Math.floor(Math.random()*100000000)
    });
  }

  return bots;
}

/* =========================
   DATE + TIMER
========================= */
function updateTime(){
  let now = new Date();

  document.getElementById("date").innerText =
    now.toLocaleDateString() + " " + now.toLocaleTimeString();

  let end = new Date();

  if(now.getHours() < 17){
    end.setHours(17,30,0,0);
  } else {
    end.setDate(end.getDate()+1);
    end.setHours(5,30,0,0);
  }

  let diff = end - now;
  let h = Math.floor(diff/1000/60/60);
  let m = Math.floor((diff/1000/60)%60);

  document.getElementById("timer").innerText = `${h}H:${m}M`;
}
setInterval(updateTime,1000);

/* =========================
   AUTH
========================= */
onAuthStateChanged(auth,(u)=>{
  if(!u) location.href="index.html";
  currentUser = u;
});

/* =========================
   LEADERBOARD LOGIC
========================= */
const content = document.getElementById("content");
const rankEl = document.getElementById("rank");

onValue(ref(db,"leaderboard/current"), snap=>{
  let data = snap.val() || {};
  let realPlayers = [];

  /* REAL PLAYERS */
  for(let uid in data){
    realPlayers.push({
      uid,
      name: data[uid].name || "Player",
      score: data[uid].score || 0,
      time: data[uid].timestamp
    });
  }

  /* SORT REAL PLAYERS */
  realPlayers.sort((a,b)=>b.score-a.score);

  /* LIMIT REAL TO FIT 100 TOTAL */
  let botsNeeded = Math.max(0, 100 - realPlayers.length);
  let bots = createBots(botsNeeded);

  /* COMBINE */
  let all = [...realPlayers, ...bots];

  /* SORT ALL */
  all.sort((a,b)=>b.score - a.score);

  /* FIND USER RANK */
  let userRank = all.findIndex(p => p.uid === currentUser?.uid) + 1;
  rankEl.innerText = "RANK: " + (userRank || "N/A");

  /* DISPLAY TOP 65 */
  content.innerHTML = "";

  all.slice(0,65).forEach((p,i)=>{
    let cls = "normal";
    if(i===0) cls="gold";
    if(i===1) cls="silver";
    if(i===2) cls="bronze";

    let div = document.createElement("div");
    div.className = "card " + cls;

    div.innerHTML = `
      <b>${i+1}. ${p.name}</b><br>
      ${p.score}<br>
    `;

    content.appendChild(div);
  });

});

</script>

</body>
  </html>
