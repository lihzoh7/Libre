<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Leaderboard</title>

<style>
body{
  margin:0;
  background:#001f3f;
  color:white;
  font-family:Arial;
  text-align:center;
}

#topBar{
  display:flex;
  justify-content:space-between;
  padding:10px;
  font-size:18px;
}

#timer{
  font-size:32px;
  font-weight:bold;
}

#date{
  font-size:18px;
}

#content{
  display:grid;
  grid-template-columns: repeat(3, 1fr);
  gap:10px;
  padding:10px;
}

.card{
  background:#002b55;
  padding:10px;
  border-radius:10px;
  font-size:20px;
}

.gold{ color:gold; }
.silver{ color:silver; }
.bronze{ color:#cd7f32; }

#rank{
  position:fixed;
  bottom:10px;
  left:10px;
}
</style>
</head>

<body>

<div id="topBar">
  <div id="date"></div>
  <div id="timer"></div>
</div>

<div id="content"></div>
<div id="rank">RANK: N/A</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getDatabase, ref, onValue, set, get } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

const app = initializeApp({
  apiKey: "AIzaSy...",
  databaseURL: "https://tose-ccf8f-default-rtdb.europe-west1.firebasedatabase.app"
});

const db = getDatabase(app);

/* 📅 REAL DATE */
setInterval(()=>{
  document.getElementById("date").innerText =
    new Date().toLocaleString();
},1000);

/* ⏱ TIMER */
function updateTimer(){
  let now=new Date();
  let end=new Date();

  let h=now.getHours();
  let m=now.getMinutes();
  let total=h*60+m;

  if(total>=6*60 && total<=17*60+30){
    end.setHours(17,30,0,0);
  } else if(total>=18*60){
    end.setDate(end.getDate()+1);
    end.setHours(5,30,0,0);
  } else {
    end.setHours(5,30,0,0);
  }

  let diff=end-now;
  let H=Math.floor(diff/1000/60/60);
  let M=Math.floor((diff/1000/60)%60);

  document.getElementById("timer").innerText=`${H}H:${M}M`;
}
setInterval(updateTimer,1000);

/* 🔥 RESET SYSTEM */
let lastResetKey="lastReset";

setInterval(async ()=>{
  let now=new Date();
  let h=now.getHours();
  let m=now.getMinutes();

  if((h===5 && m===30) || (h===17 && m===30)){

    let lastSnap=await get(ref(db,"system/"+lastResetKey));
    let last=lastSnap.val();

    let nowKey = now.toDateString()+"-"+h+"-"+m;

    if(last !== nowKey){

      // CLEAR leaderboard
      await set(ref(db,"leaderboard/current"),null);

      // SAVE reset marker
      await set(ref(db,"system/"+lastResetKey), nowKey);

      console.log("RESET DONE");
    }
  }
},5000);

/* 📊 LOAD */
onValue(ref(db,"leaderboard/current"), snap=>{
  const data=snap.val()||{};
  let arr=[];

  for(let uid in data){
    arr.push(data[uid]);
  }

  arr.sort((a,b)=>b.score-a.score);

  const content=document.getElementById("content");
  content.innerHTML="";

  arr.slice(0,75).forEach((p,i)=>{
    let cls="";
    if(i===0) cls="gold";
    if(i===1) cls="silver";
    if(i===2) cls="bronze";

    let div=document.createElement("div");
    div.className="card "+cls;

    div.innerHTML=`
      ${i+1}. ${p.name}<br>
      ${p.score}<br>
      <small>${new Date(p.timestamp).toLocaleString()}</small>
    `;

    content.appendChild(div);
  });
});
</script>

</body>
</html>
