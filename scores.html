/* =========================================
   CREATE BOTS IF EMPTY
========================================= */

async function createBots(){

  const snap = await get(ref(db,"leaderboard/bots"));

  if(snap.exists()) return;

  let data = {};

  botNames.forEach((name,i)=>{

    data["bot_"+i] = {
      uid:"bot_"+i,
      bot:true,
      name:name,
      score:Math.floor(Math.random()*5000)+500,
      timestamp:Date.now()
    };

  });

  await set(ref(db,"leaderboard/bots"), data);
}

createBots();

/* =========================================
   RANDOM BOT UPDATES
========================================= */

function randomBotUpdates(){

  setInterval(async ()=>{

    if(breakMode) return;

    const snap = await get(ref(db,"leaderboard/bots"));
    const bots = snap.val() || {};

    let updates = {};

    Object.keys(bots).forEach(uid=>{

      let chance = Math.random();

      /* ONLY SOME PLAYERS UPDATE */
      if(chance < 0.18){

        let current = bots[uid].score || 0;

        /* SMALL REALISTIC IMPROVEMENT */
        let increase = Math.floor(Math.random()*120);

        updates[uid+"/score"] = current + increase;
        updates[uid+"/timestamp"] = Date.now();
      }

    });

    if(Object.keys(updates).length > 0){
      await update(ref(db,"leaderboard/bots"), updates);
    }

  },30000);

  /* BIGGER RANDOM UPDATES */
  setInterval(async ()=>{

    if(breakMode) return;

    const snap = await get(ref(db,"leaderboard/bots"));
    const bots = snap.val() || {};

      if(chance < 0.08){

        let increase = Math.floor(Math.random()*300);

        updates[uid+"/score"] = current + increase;
        updates[uid+"/timestamp"] = Date.now();
      }

    });

    if(Object.keys(updates).length > 0){

    }

  },45000);

  /* RARE HUGE IMPROVEMENTS */

    });

    }

  },50000);

}

/* =========================================
   DATE + TIMER
========================================= */

function updateTime(){

  let now = new Date();

  document.getElementById("date").innerText =
    now.toLocaleDateString() + " " +
    now.toLocaleTimeString();

  let end = new Date();

  if(now.getHours() < 17){
    end.setHours(17,30,0,0);
  }else{
    end.setDate(end.getDate()+1);
    end.setHours(5,30,0,0);
  }

  let diff = end - now;

  let h = Math.floor(diff/1000/60/60);
  let m = Math.floor((diff/1000/60)%60);

  document.getElementById("timer").innerText =
    `${h}H:${m}M`;
}

setInterval(updateTime,1000);

/* =========================================
   BREAK + RESET SYSTEM
========================================= */

async function checkReset(){

  let now = new Date();

  let h = now.getHours();
  let m = now.getMinutes();

  let isReset =
    (h === 5 && m === 30) ||
    (h === 17 && m === 30);

  if(!isReset){
    resetLock = false;
    return;
  }

  if(resetLock) return;

  resetLock = true;

  breakMode = true;

  document.getElementById("popup").style.display="block";

  /* CLEAR PLAYER SCORES */
  await set(ref(db,"leaderboard/current"), null);

  /* RESET BOT SCORES */
  const botSnap = await get(ref(db,"leaderboard/bots"));
  const bots = botSnap.val() || {};

  let updates = {};

  Object.keys(bots).forEach(uid=>{

    updates[uid+"/score"] =
      Math.floor(Math.random()*5000)+500;

    updates[uid+"/timestamp"] = Date.now();
  });

  await update(ref(db,"leaderboard/bots"), updates);

  /* 30 MINUTE BREAK */
  setTimeout(()=>{

    breakMode = false;

    document.getElementById("popup").style.display="none";

  },1800000); // 30 mins
}

setInterval(checkReset,1000);

/* =========================================
   LOAD LEADERBOARD
========================================= */

const content = document.getElementById("content");
const rankEl = document.getElementById("rank");

function loadBoard(){

  onValue(ref(db,"leaderboard"), snap=>{

    const data = snap.val() || {};

    let arr = [];

    /* REAL PLAYERS */
    const players = data.current || {};

    for(let uid in players){

      arr.push({
        uid,
        name:players[uid].name || "Player",
        score:players[uid].score || 0,
        time:players[uid].timestamp || 0
      });
    }

    /* COMPUTER PLAYERS */
    const bots = data.bots || {};

    for(let uid in bots){

      arr.push({
        uid,
        name:bots[uid].name,
        score:bots[uid].score,
        time:bots[uid].timestamp
      });
    }

    /* SORT */
    arr.sort((a,b)=>b.score-a.score);

    content.innerHTML="";

    arr.slice(0,100).forEach((p,i)=>{

      let cls="normal";

      if(i===0) cls="gold";
      if(i===1) cls="silver";
      if(i===2) cls="bronze";

      let date =
        new Date(p.time).toLocaleString();

      let div = document.createElement("div");

      div.className = "card "+cls;

      div.innerHTML = `
        <b>${i+1}. ${p.name}</b><br>
        SCORE: ${p.score}<br>
        <small>${date}</small>
      `;

      content.appendChild(div);

      if(currentUser && currentUser.uid===p.uid){
        rankEl.innerText="RANK: "+(i+1);
      }

    });

    if(!arr.find(x=>x.uid===currentUser?.uid)){
      rankEl.innerText="RANK: N/A";
    }

  });

}
