<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Leaderboard</title>

<style>
body{
  margin:0;
  background:#001f3f;
  color:white;
  font-family:Arial;
  text-align:center;
}

#date,#timer{
  font-size:42px;
  margin:10px;
  font-weight:bold;
}

#content{
  display:grid;
  grid-template-columns: repeat(3, 1fr);
  gap:10px;
  padding:10px;
}

.card{
  background:#002b55;
  padding:10px;
  border-radius:10px;
  font-size:18px;
}

.gold{color:gold;}
.silver{color:silver;}
.bronze{color:#cd7f32;}
.normal{color:#ccc;}

#rank{
  position:fixed;
  bottom:10px;
  left:10px;
  font-size:20px;
}
</style>
</head>

<body>

<div id="date"></div>
<div id="timer"></div>
<div id="content"></div>
<div id="rank">RANK: N/A</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

/* ================= FIREBASE ================= */
const app = initializeApp({
  apiKey: "AIzaSyBqJTLjxhZBCsvjrTH_cG0fkXlElG6BqTg",
  databaseURL: "https://tose-ccf8f-default-rtdb.europe-west1.firebasedatabase.app"
});

const db = getDatabase(app);
const auth = getAuth(app);

/* ================= SA NAMES ================= */
const firstNames = [
"Thabo","Sipho","Lerato","Naledi","Kagiso","Bongani","Palesa","Mpho","Sanele","Zanele",
"Junior","Vusi","Ayanda","Nandi","Tshepo","Boitumelo","Neo","Lungelo","Siyanda","Refilwe"
];

const surnames = [
"Nkosi","Mahlangu","Dlamini","Mokoena","Khumalo","Zuma","Ndlovu","Sithole","Mthembu","Maseko",
"Modise","Shabalala","Ngwenya","Baloyi","Mabaso","Zulu","Morake","Moyo","Ramaphosa","Nkuna"
];

/* ================= BOT SYSTEM ================= */
let bots = [];
let currentUser = null;

function rand(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function makeBots(){
  for(let i=0;i<100;i++){
    bots.push({
      uid:"bot-"+i,
      name: rand(firstNames)+" "+rand(surnames),
      score: Math.floor(Math.random()*250)
    });
  }
}
makeBots();

/* ================= SCORE UPDATE SYSTEM ================= */
const increments = [7,10,15,2,0,5];

function updateBots(percent){
  bots.forEach(b=>{
    if(Math.random() < percent){
      let inc = increments[Math.floor(Math.random()*increments.length)];
      b.score += inc;

      if(b.score > 1300) b.score = 1300;
    }
  });
}

/* every 2 min → 40% */
setInterval(()=>updateBots(0.4), 160000);

/* every 7 min → 60% */
setInterval(()=>updateBots(0.6), 420000);

/* ================= TIME ================= */
function updateTime(){
  let now=new Date();
  document.getElementById("date").innerText =
    now.toLocaleDateString()+" "+now.toLocaleTimeString();

  let end=new Date();
  if(now.getHours()<17){
    end.setHours(17,30,0,0);
  }else{
    end.setDate(end.getDate()+1);
    end.setHours(5,30,0,0);
  }

  let diff=end-now;
  let h=Math.floor(diff/3600000);
  let m=Math.floor((diff%3600000)/60000);

  document.getElementById("timer").innerText=`${h}H:${m}M`;
}
setInterval(updateTime,1000);

/* ================= LEADERBOARD ================= */
const content=document.getElementById("content");
const rankEl=document.getElementById("rank");

function getAllPlayers(firebaseUsers){
  let list=[...bots];

  for(let uid in firebaseUsers){
    list.push({
      uid,
      name: firebaseUsers[uid].name || "Player",
      score: firebaseUsers[uid].score || 0,
      time: firebaseUsers[uid].timestamp || Date.now()
    });
  }

  return list;
}

onAuthStateChanged(auth,(u)=>{
  if(!u) location.href="index.html";
  currentUser=u;
});

/* Firebase real players */
onValue(ref(db,"leaderboard/current"), snap=>{
  const data=snap.val()||{};

  let players=getAllPlayers(data);
  players.sort((a,b)=>b.score-a.score);

  content.innerHTML="";

  let top65 = players.slice(0,65);

  top65.forEach((p,i)=>{
    let cls="normal";
    if(i===0) cls="gold";
    if(i===1) cls="silver";
    if(i===2) cls="bronze";

    let div=document.createElement("div");
    div.className="card "+cls;

    div.innerHTML=`
      <b>${i+1}. ${p.name}</b><br>
      ${p.score}
    `;

    content.appendChild(div);

    if(currentUser && p.uid===currentUser.uid){
      rankEl.innerText="RANK: "+(i+1);
    }
  });

  /* FIND USER RANK EVEN IF NOT IN TOP 65 */
  if(currentUser){
    let fullRank = players.findIndex(p=>p.uid===currentUser.uid)+1;
    if(fullRank>0){
      rankEl.innerText="RANK: "+fullRank;
    }else{
      rankEl.innerText="RANK: N/A";
    }
  }
});

</script>

</body>
</html>
