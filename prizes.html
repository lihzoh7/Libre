<!DOCTYPE html>
<html>
<head>
<title>Prizes</title>
<style>
body{background:navy;color:white;text-align:center;}
.cell{padding:10px;border:1px solid white;}
.past{background:red;}
.active{background:green;}
</style>
</head>

<body>

<h2 id="week"></h2>
<div id="grid"></div>

<h3>🥇 <span id="g"></span></h3>
<h3>🥈 <span id="s"></span></h3>
<h3>🥉 <span id="b"></span></h3>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

const app = initializeApp({ databaseURL:"https://tose-ccf8f-default-rtdb.europe-west1.firebasedatabase.app" });
const db = getDatabase(app);

onValue(ref(db,"admin/prizes"), snap=>{
  const data = snap.val();
  if(!data) return;

  document.getElementById("week").innerText =
    data.fromDate+" - "+data.toDate;

  let nowDay = (new Date().getDay()+6)%7;

  let current=0;

  let html="";

  for(let d=0;d<7;d++){
    let val = data.schedule?.[d]?.[0]?.value || 0;

    let cls="";
    if(d<nowDay) cls="past";
    if(d===nowDay) { cls="active"; current=val; }

    html+=`<div class="cell ${cls}">${val}</div>`;
  }

  document.getElementById("grid").innerHTML=html;

  document.getElementById("g").innerText = Math.round(current*0.65);
  document.getElementById("s").innerText = Math.round(current*0.25);
  document.getElementById("b").innerText = Math.round(current*0.10);
});
</script>
</body>
</html>
