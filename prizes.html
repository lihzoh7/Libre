<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Winners</title>

<style>

body{
  margin:0;
  padding:15px;
  background:#1d3557;
  font-family:Arial, sans-serif;
  color:white;
}

h1{
  text-align:center;
  margin-bottom:20px;
}

.winnerBlock{
  margin-bottom:15px;
}

.header{
  width:100%;
  background:#ffb3b3;
  color:black;
  padding:18px;
  border-radius:10px;
  cursor:pointer;
  font-size:22px;
  font-weight:bold;
  box-sizing:border-box;
}

.details{
  display:none;
  background:#002b55;
  padding:15px;
  border-radius:0 0 10px 10px;
  font-size:20px;
}

.card{
  background:#003d73;
  padding:15px;
  border-radius:10px;
  margin-top:10px;
}

.gold{
  color:gold;
}

.label{
  font-weight:bold;
}

#empty{
  text-align:center;
  font-size:24px;
  margin-top:40px;
}

</style>
</head>

<body>

<h1>WINNERS</h1>

<div id="container"></div>

<div id="empty" style="display:none;">
No winners yet
</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";

import {
getDatabase,
ref,
onValue
}
from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

const app = initializeApp({
 apiKey:"AIzaSyBqJTLjxhZBCsvjrTH_cG0fkXlElG6BqTg",
 databaseURL:"https://tose-ccf8f-default-rtdb.europe-west1.firebasedatabase.app"
});

const db = getDatabase(app);

const container =
document.getElementById("container");

const empty =
document.getElementById("empty");

onValue(
 ref(db,"winners"),
 snap=>{

 container.innerHTML="";

 const data = snap.val();

 if(!data){

   empty.style.display="block";
   return;

 }

 empty.style.display="none";

 let arr=[];

 for(let key in data){

   arr.push({
     id:key,
     ...data[key]
   });

 }

 arr.sort(
   (a,b)=>
   b.timestamp-a.timestamp
 );

 arr.forEach(w=>{

   const winnerDate =
   new Date(w.timestamp);

   const dayDateTime =
   winnerDate.toLocaleString(
     undefined,
     {
       weekday:"long",
       year:"numeric",
       month:"long",
       day:"numeric",
       hour:"2-digit",
       minute:"2-digit"
     }
   );

   const block =
   document.createElement("div");

   block.className =
   "winnerBlock";

   const header =
   document.createElement("div");

   header.className =
   "header";

   header.innerText =
   dayDateTime;

   const details =
   document.createElement("div");

   details.className =
   "details";

   details.innerHTML = `

   <div class="card">

     <div class="gold">
       🏆 FIRST PLACE
     </div>

     <br>

     <div>
       <span class="label">
       Name:
       </span>
       ${w.name}
     </div>

     <br>

     <div>
       <span class="label">
       Surname:
       </span>
       ${w.surname}
     </div>

     <br>

     <div>
       <span class="label">
       Score:
       </span>
       ${w.score}
     </div>

     <br>

     <div>
       <span class="label">
       Date:
       </span>
       ${winnerDate.toLocaleDateString()}
     </div>

     <br>

     <div>
       <span class="label">
       Time:
       </span>
       ${winnerDate.toLocaleTimeString()}
     </div>

   </div>

   `;

   header.onclick = ()=>{

     if(
       details.style.display
       === "block"
     ){
       details.style.display =
       "none";
     }
     else{
       details.style.display =
       "block";
     }

   };

   block.appendChild(header);
   block.appendChild(details);

   container.appendChild(block);

 });

});

</script>

</body>
</html>
