<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EARNINGS & WALLET</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 12px;
  font-family: 'Segoe UI', Arial, sans-serif;
  background: radial-gradient(circle at center, #1a0000 0%, #000000 100%);
  color: #ffffff;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* WALLET SECTION STYLES */
#wallet {
  width: 100%;
  max-width: 480px;
  padding: 18px;
  text-align: center;
  background: #001428;
  border: 1px solid #004080;
  border-radius: 12px;
  box-shadow: 0 0 15px rgba(0,0,0,0.5);
  margin-bottom: 25px;
}

.hawk-logo {
  display: block;
  width: 64px;
  height: 64px;
  object-fit: contain;
  margin: 0 auto 8px;
}

.winter-header {
  color: #00f0ff;
  font-size: clamp(20px, 5vw, 26px);
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: 2px;
  margin-bottom: 16px;
  text-shadow: 0 0 10px rgba(0,240,255,0.6);
}

.tiles {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  margin-bottom: 18px;
  align-items: stretch;
}

.tile {
  min-width: 0;
  min-height: 83px;
  padding: 12px 4px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
  background: #003366;
  border: 1px solid #004080;
  border-radius: 8px;
  font-size: clamp(14px, 3.5vw, 18px);
  font-weight: bold;
  overflow-wrap: anywhere;
}

.balance-tile {
  background: #004080;
  border-color: #00f0ff;
  color: #00f0ff;
}

.tile-label {
  font-size: 11px;
  letter-spacing: 0.5px;
  color: #c8eaff;
}

.buy-tile {
  padding: 6px 3px;
  background: #064c70;
  border: 1px solid #00f0ff;
  color: #00f0ff;
  cursor: pointer;
  transition: background 0.2s, transform 0.2s;
}

.buy-tile:hover {
  background: #08648e;
}

.buy-tile:active {
  transform: scale(0.97);
}

.buy-tile:disabled {
  opacity: 0.6;
  cursor: wait;
}

.buy-word {
  font-size: 20px;
  font-weight: 900;
  letter-spacing: 1px;
}

.buy-cost {
  font-size: 10px;
  line-height: 1.3;
  color: #ffffff;
  font-weight: normal;
}

.lives-tile {
  border-color: #e75d83;
  color: #ffffff;
}

.life-number {
  color: #ff668e;
  font-size: 22px;
}

.deposit-card {
  background: #002244;
  border: 1px solid #0055a5;
  padding: 15px;
  border-radius: 8px;
  margin-bottom: 12px;
  text-align: center;
}

.deposit-card h3 {
  margin: 0 0 14px;
  color: #ffcc00;
  font-size: 17px;
}

.form-group {
  margin-bottom: 12px;
  text-align: left;
}

.form-group label {
  display: block;
  font-size: 12px;
  color: #ccc;
  margin-bottom: 5px;
}

.form-group input {
  display: block;
  width: 100%;
  min-width: 0;
  padding: 11px;
  border-radius: 5px;
  border: 1px solid #004080;
  background: #001020;
  color: #fff;
  font-size: 16px;
}

.submit-btn {
  width: 100%;
  padding: 12px 8px;
  background: #00f0ff;
  color: #001f3f;
  font-weight: bold;
  font-size: 14px;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}

.submit-btn:hover {
  background: #00c4d4;
}

.submit-btn:disabled {
  opacity: 0.6;
  cursor: wait;
}

#message {
  display: none;
  margin: 10px 0 0;
  padding: 9px;
  border-radius: 6px;
  font-size: 13px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

#message.success {
  display: block;
  color: #a8ffbf;
  background: #103b2a;
}

#message.error {
  display: block;
  color: #ffb3b3;
  background: #451d27;
}

#message.info {
  display: block;
  color: #b8edff;
  background: #12344b;
}

/* EARNINGS SECTION STYLES */
h2.section-title {
  color: #ff3333;
  margin: 10px 0 15px 0;
  letter-spacing: 1px;
}

#content {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 15px;
  padding: 10px 20px;
  max-width: 1200px;
  width: 100%;
  margin: 0 auto;
}

.card {
  background: linear-gradient(135deg, #1f0505 0%, #0d0000 100%);
  padding: 20px;
  border-radius: 12px;
  font-size: 20px;
  border: 1px solid #400000;
  box-shadow: 0 4px 15px rgba(0,0,0,0.5);
  position: relative;
  text-align: center;
}

.card b {
  color: #ffcccc;
  font-size: 22px;
}

.claim-btn {
  margin-top: 12px;
  padding: 8px 16px;
  background: #28a745;
  color: white;
  border: none;
  border-radius: 6px;
  font-weight: bold;
  cursor: pointer;
  font-size: 16px;
  transition: background 0.2s;
}

.claim-btn:hover {
  background: #218838;
}

.claim-btn.claimed {
  background: #6c757d !important;
  color: #d6d6d6 !important;
  cursor: not-allowed;
}

.claim-btn.insufficient {
  background: #495057 !important;
  color: #adb5bd !important;
  cursor: not-allowed;
}
</style>
</head>

<body>

<!-- WALLET SECTION -->
<div id="wallet">
  <img class="hawk-logo" src="hawk.png" alt="Muustandi Hawk">
  <div class="winter-header">WINTER SPECIAL</div>

  <div class="tiles">
    <div class="tile balance-tile">
      <span class="tile-label">CASH BALANCE</span>
      <span>R <span id="cashBalance">0.00</span></span>
    </div>

    <button type="button" class="tile buy-tile" id="buyLife" aria-label="Buy one life for 50 cents">
      <span class="buy-word">BUY</span>
      <span class="buy-cost">1 Life Cost<br>50 cent</span>
    </button>

    <div class="tile lives-tile">
      <span class="tile-label">LIVES</span>
      <span class="life-number">❤️ <span id="lives">0</span></span>
    </div>
  </div>

  <div class="deposit-card">
    <h3>TOP UP VIA 1VOUCHER</h3>
    <div class="form-group">
      <label for="depositAmount">Deposit Amount (Rand):</label>
      <input type="number" id="depositAmount" value="20" min="5" step="0.01" placeholder="e.g. 20">
    </div>
    <button class="submit-btn" id="submitVoucherBtn">CONTINUE TO 1VOUCHER PAYMENT</button>
  </div>

  <div id="message" role="status" aria-live="polite"></div>
</div>

<!-- EARNINGS SECTION -->
<h2 class="section-title">EARNINGS</h2>
<div id="content"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getDatabase, ref, onValue, set, get, push, runTransaction } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBqJTLjxhZBCsvjrTH_cG0fkXlElG6BqTg",
  authDomain: "tose-ccf8f.firebaseapp.com",
  databaseURL: "https://tose-ccf8f-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "tose-ccf8f",
  storageBucket: "tose-ccf8f.appspot.com"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

let currentUser = null;
let currentUid = null;
let walletListenerStartedFor = null;
let purchaseInProgress = false;

const cashBalanceElement = document.getElementById("cashBalance");
const livesElement = document.getElementById("lives");
const buyLifeButton = document.getElementById("buyLife");
const depositButton = document.getElementById("submitVoucherBtn");
const messageElement = document.getElementById("message");
const content = document.getElementById("content");

function showMessage(message, type = "info") {
  messageElement.textContent = message;
  messageElement.className = type;
}

function clearMessage() {
  messageElement.textContent = "";
  messageElement.className = "";
}

function money(value) {
  const amount = Number(value);
  return Number.isFinite(amount) ? amount.toFixed(2) : "0.00";
}

function renderWallet(data = {}) {
  cashBalanceElement.textContent = money(data.cashBalance);
  livesElement.textContent = String(Math.max(0, Number(data.lives) || 0));
}

/* =====================================================
   AUTHENTICATION & LIVE WALLET SYNC
   ===================================================== */
onAuthStateChanged(auth, (user) => {
  currentUser = user;
  currentUid = user ? user.uid : null;

  if (!currentUid) {
    walletListenerStartedFor = null;
    renderWallet({});
    buyLifeButton.disabled = true;
    depositButton.disabled = true;
    content.innerHTML = "<div class='card'>Please log in to view your earnings.</div>";
    showMessage("Please log in to view and use your wallet.", "info");
    return;
  }

  buyLifeButton.disabled = false;
  depositButton.disabled = false;

  if (walletListenerStartedFor !== currentUid) {
    walletListenerStartedFor = currentUid;
    listenToWalletUpdates(currentUid);
  }

  loadPlayerEarnings(currentUid);
});

function listenToWalletUpdates(uid) {
  onValue(ref(db, "wallet/" + uid), (snapshot) => {
    const data = snapshot.val() || {};
    renderWallet(data);
    if (!purchaseInProgress) clearMessage();
  }, (error) => {
    console.error("Wallet listener error:", error);
    showMessage("Unable to load your wallet.", "error");
  });
}

/* =====================================================
   LOAD PLAYER SCORES (EARNINGS)
   ===================================================== */
function loadPlayerEarnings(uid) {
  // Listen directly to the player's highScores or quizer records
  onValue(ref(db, "highScores/ringmaster/" + uid), (snap) => {
    const data = snap.val() || {};
    let arr = [];

    for (let key in data) {
      arr.push({
        id: key,
        score: Number(data[key].score || 0),
        claimed: data[key].claimed || false
      });
    }

    // Sort descending by score or timestamp
    arr.sort((a, b) => b.score - a.score);
    content.innerHTML = "";

    if (arr.length === 0) {
      content.innerHTML = "<div class='card'>No game earnings recorded yet. Play a game to see your scores here!</div>";
      return;
    }

    arr.forEach((item, index) => {
      let div = document.createElement("div");
      div.className = "card";

      let scoreFormatted = "R " + item.score.toFixed(2);
      let btnHtml = "";

      if (item.claimed) {
        btnHtml = `<button class="claim-btn claimed" disabled>CLAIMED</button>`;
      } else if (item.score > 0) {
        btnHtml = `<button class="claim-btn" onclick="claimEarnings('${item.id}', ${item.score})">CLAIM</button>`;
      } else {
        btnHtml = `<button class="claim-btn insufficient" disabled>INSUFFICIENT</button>`;
      }

      div.innerHTML = `<b>Score ${index + 1}</b><br>${scoreFormatted}<br>${btnHtml}`;
      content.appendChild(div);
    });
  });
}

/* =====================================================
   CLAIM EARNINGS & ADD TO WALLET
   ===================================================== */
window.claimEarnings = async function(scoreId, scoreAmount) {
  if (!currentUid) return;

  try {
    const walletRef = ref(db, "wallet/" + currentUid);
    const scoreRef = ref(db, `highScores/ringmaster/${currentUid}/${scoreId}`);

    // Verify score hasn't already been claimed
    const scoreSnap = await get(scoreRef);
    if (scoreSnap.exists() && scoreSnap.val().claimed) {
      alert("This reward has already been claimed.");
      return;
    }

    // Run transaction to increment cash balance
    await runTransaction(walletRef, (currentData) => {
      const data = currentData || { cashBalance: 0, lives: 0 };
      const currentCash = Number(data.cashBalance) || 0;

      return {
        ...data,
        cashBalance: currentCash + scoreAmount,
        updatedAt: new Date().toISOString()
      };
    });

    // Mark score as claimed in Firebase
    await set(ref(db, `highScores/ringmaster/${currentUid}/${scoreId}/claimed`), true);

    showMessage(`Successfully claimed R ${scoreAmount.toFixed(2)} to your cash balance!`, "success");
  } catch (err) {
    console.error("Claim error:", err);
    showMessage("Failed to claim earnings. Please try again.", "error");
  }
};

/* =====================================================
   BUY LIFE BUTTON
   ===================================================== */
buyLifeButton.addEventListener("click", async () => {
  if (!currentUid || purchaseInProgress) return;

  purchaseInProgress = true;
  buyLifeButton.disabled = true;
  const originalButtonHTML = buyLifeButton.innerHTML;
  buyLifeButton.innerHTML = '<span class="buy-word">BUY...</span><span class="buy-cost">Please wait</span>';

  showMessage("Processing your life purchase...", "info");

  try {
    const walletRef = ref(db, "wallet/" + currentUid);
    let insufficientBalance = false;
    let purchaseCommitted = false;

    const result = await runTransaction(walletRef, (currentData) => {
      insufficientBalance = false;
      if (!currentData || typeof currentData !== "object") {
        insufficientBalance = true;
        return;
      }

      const cash = Number(currentData.cashBalance);
      if (!Number.isFinite(cash) || cash < 0.50) {
        insufficientBalance = true;
        return;
      }

      const currentLives = Number(currentData.lives || 0);
      const cashCents = Math.round(cash * 100);

      if (cashCents < 50) {
        insufficientBalance = true;
        return;
      }

      purchaseCommitted = true;
      return {
        ...currentData,
        cashBalance: (cashCents - 50) / 100,
        lives: currentLives + 1,
        updatedAt: new Date().toISOString()
      };
    }, { applyLocally: false });

    if (!result.committed || !purchaseCommitted) {
      if (insufficientBalance) {
        showMessage("Insufficient cash balance. You need at least R0.50 to buy one life.", "error");
      } else {
        showMessage("The purchase was not completed.", "error");
      }
      return;
    }

    await push(ref(db, `lives_purchases/${currentUid}`), {
      count: 1,
      cost: 0.50,
      time: new Date().toISOString()
    });

    renderWallet(result.snapshot.val() || {});
    showMessage("Success! R0.50 was deducted and 1 life was added.", "success");
  } catch (error) {
    console.error("Buy life error:", error);
    showMessage("Unable to complete purchase.", "error");
  } finally {
    purchaseInProgress = false;
    buyLifeButton.disabled = !currentUid;
    buyLifeButton.innerHTML = originalButtonHTML;
  }
});

/* =====================================================
   1VOUCHER DEPOSIT
   ===================================================== */
depositButton.addEventListener("click", async () => {
  const amountRand = Number(document.getElementById("depositAmount").value);

  if (!Number.isFinite(amountRand) || amountRand < 5) {
    showMessage("Please enter a valid deposit amount. Minimum is R5.", "error");
    return;
  }

  if (!currentUid) {
    showMessage("Please log in to make a deposit.", "error");
    return;
  }

  depositButton.disabled = true;
  depositButton.textContent = "REDIRECTING TO PAYMENT...";
  showMessage("Connecting to the 1Voucher payment gateway...", "info");

  try {
    let userFirstName = "Gamer";
    let userLastName = "Customer";

    const userSnapshot = await get(ref(db, "users/" + currentUid));
    if (userSnapshot.exists()) {
      const userData = userSnapshot.val();
      userFirstName = userData.name || "Gamer";
      userLastName = userData.surname || "Customer";
    }

    const requestTimeIso = new Date().toISOString();
    await push(ref(db, `transactions/${currentUid}`), {
      amount: amountRand,
      requestTime: requestTimeIso,
      grantedTime: requestTimeIso,
      status: "GRANTED"
    });

    const response = await fetch("https://muustandibackend.onrender.com/deposit/1voucher", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        amountInCents: Math.round(amountRand * 100),
        userId: currentUid,
        firstName: userFirstName,
        lastName: userLastName
      })
    });

    const result = await response.json();
    if (!response.ok || !result.success) {
      throw new Error(result.message || result.error || "Failed to initialize payment.");
    }

    if (!result.redirectUri) {
      throw new Error("Payment gateway did not return a redirect link.");
    }

    window.location.href = result.redirectUri;
  } catch (error) {
    console.error("1Voucher deposit error:", error);
    showMessage("Deposit error: " + error.message, "error");
    depositButton.disabled = false;
    depositButton.textContent = "CONTINUE TO 1VOUCHER PAYMENT";
  }
});
</script>

</body>
</html>
