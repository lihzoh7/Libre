<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quizer Earnings & Claims</title>
<style>
  body {
    margin: 0;
    background: #001f3f;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 12px;
  }
  #header-title {
    font-size: 32px;
    margin: 15px 0;
    font-weight: bold;
    color: #00f0ff;
    text-transform: uppercase;
  }
  #content {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    padding: 10px;
    max-width: 650px;
    margin: 0 auto;
  }
  .card {
    background: #002b55;
    padding: 15px 10px;
    border-radius: 10px;
    border: 1px solid #004080;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .score-text {
    color: gold;
    font-weight: bold;
    font-size: 20px;
  }
  .card small {
    color: #c8eaff;
    font-size: 11px;
    line-height: 1.3;
  }
  .claim-btn {
    background: #28a745;
    color: white;
    border: none;
    padding: 8px 12px;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    font-size: 13px;
    width: 100%;
  }
  .claim-btn:hover { background: #218838; }
  .claimed-btn {
    background: #6c757d;
    color: #d6d6d6;
    border: none;
    padding: 8px 12px;
    border-radius: 6px;
    font-weight: bold;
    cursor: not-allowed;
    font-size: 13px;
    width: 100%;
  }
  .insufficient-lbl {
    color: #adb5bd;
    font-size: 11px;
    font-style: italic;
    font-weight: bold;
    padding: 6px;
  }
  #popup {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: #111;
    color: #a8ffbf;
    border: 2px solid #28a745;
    padding: 30px;
    font-size: 20px;
    display: none;
    border-radius: 12px;
    z-index: 1000;
  }
</style>
</head>
<body>

<div id="header-title">Quizer Earnings & Claims</div>
<div id="content"></div>
<div id="popup"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
  import { getDatabase, ref, onValue, set, runTransaction } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBqJTLjxhZBCsvjrTH_cG0fkXlElG6BqTg",
    authDomain: "tose-ccf8f.firebaseapp.com",
    databaseURL: "https://tose-ccf8f-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "tose-ccf8f",
    storageBucket: "tose-ccf8f.appspot.com",
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const auth = getAuth(app);

  onAuthStateChanged(auth, (u) => {
    if(!u) { location.href = "login.html"; return; }
    loadEarnings(u.uid);
  });

  function loadEarnings(uid) {
    const content = document.getElementById("content");

    onValue(ref(db, "earnings/" + uid), snap => {
      const data = snap.val() || {};
      let arr = [];

      for(let id in data) {
        arr.push({ id, ...data[id] });
      }
      arr.sort((a, b) => b.timestamp - a.timestamp);

      content.innerHTML = "";
      if(arr.length === 0) {
        content.innerHTML = "<div class='card' style='grid-column: span 3;'>No earnings recorded yet!</div>";
        return;
      }

      arr.forEach(item => {
        let scoreVal = Number(item.score || 0);
        let dateObj = new Date(item.timestamp);
        let dateStr = dateObj.toLocaleDateString();
        let timeStr = dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        let div = document.createElement("div");
        div.className = "card";

        let actionHTML = "";
        if (scoreVal > 0) {
          if (item.claimed) {
            actionHTML = `<button class="claimed-btn" disabled>CLAIMED</button>`;
          } else {
            actionHTML = `<button class="claim-btn" data-id="${item.id}" data-score="${scoreVal}">CLAIM</button>`;
          }
        } else {
          actionHTML = `<span class="insufficient-lbl">Insufficient Funds</span>`;
        }

        div.innerHTML = `
          <div class="score-text">R ${scoreVal.toFixed(2)}</div>
          <small>${dateStr}<br>${timeStr}</small>
          ${actionHTML}
        `;
        content.appendChild(div);
      });

      document.querySelectorAll(".claim-btn").forEach(btn => {
        btn.onclick = async (e) => {
          let entryId = e.target.getAttribute("data-id");
          let claimAmount = parseFloat(e.target.getAttribute("data-score"));

          btn.disabled = true;
          btn.textContent = "CLAIMING...";

          try {
            // 1. Mark as claimed in earnings
            await set(ref(db, `earnings/${uid}/${entryId}/claimed`), true);

            // 2. Add amount to wallet balance via transaction
            const walletRef = ref(db, `wallet/${uid}`);
            await runTransaction(walletRef, (currentWallet) => {
              if(!currentWallet) currentWallet = { cashBalance: 0, lives: 0 };
              let currentBalance = Number(currentWallet.cashBalance || 0);
              return {
                ...currentWallet,
                cashBalance: currentBalance + claimAmount,
                updatedAt: new Date().toISOString()
              };
            });

            let pop = document.getElementById("popup");
            pop.innerText = `Claimed R${claimAmount.toFixed(2)} successfully!`;
            pop.style.display = "block";
            setTimeout(() => { pop.style.display = "none"; }, 2000);

          } catch(err) {
            console.error(err);
            alert("Claim failed. Try again.");
            btn.disabled = false;
            btn.textContent = "CLAIM";
          }
        };
      });
    });
  }
</script>
</body>
</html>
