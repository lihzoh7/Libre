     crossorigin="anonymous"></script>
<style>
body { 
  background-color: navy; 
  font-family: Arial, sans-serif; 
  display:flex; 
  justify-content:center; 
  align-items:center; 
  height:100vh; 
  margin:0; 
}
.container { 
  text-align:center; 
  width:350px; 
}
h1 { 
  color:white; 
  font-size:28px; 
  margin-bottom:20px; 
}
input { 
  width:100%; 
  padding:12px; 
  margin:8px 0; 
  box-sizing:border-box; 
  border-radius:4px; 
  border:none;
  font-size:16px; 
}
#loginBtn { 
  width:100%; 
  padding:12px; 
  margin-top:10px; 
  background-color:green; 
  color:white; 
  border:none; 
  border-radius:4px; 
  cursor:pointer;
  font-size:18px; 
  font-weight:bold;
}
.links { 
  margin-top:15px; 
  display:flex; 
  justify-content:space-between; 
  font-size:13px; 
  color:white; 
}
.footer-link {
  margin-top: 20px;
  font-size: 14px;
}
.links a, .footer-link a { 
  color:white; 
  text-decoration:none; 
}
.links a:hover, .footer-link a:hover { 
  text-decoration:underline; 
}
</style>
</head>

<body>
<div class="container">
  <h1>LOG IN</h1>
  <input id="email" type="email" placeholder="Email Address">
  <input id="password" type="password" placeholder="Password">
  <button id="loginBtn">LOG IN</button>

  <div class="links">
    <a href="signup.html">SIGN UP</a>
    <a href="forgot-password.html">Forgot password?</a>
    <a href="queries.html">QUERIES</a>
  </div>

  <!-- New ABOUT link centered below -->
  <div class="footer-link">
    <a href="about.html">ABOUT</a>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { 
  getAuth, 
  signInWithEmailAndPassword 
} from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
     
const firebaseConfig = {
  apiKey: "AIzaSyBqJTLjxhZBCsvjrTH_cG0fkXlElG6BqTg",
  authDomain: "tose-ccf8f.firebaseapp.com",
  databaseURL: "https://tose-ccf8f-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "tose-ccf8f",
  storageBucket: "tose-ccf8f.appspot.com",
  messagingSenderId: "475447495901",
  appId: "1:475447495901:web:9189276a162a3680afdf34"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
     
document.getElementById("loginBtn").addEventListener("click", async () => {
  const email = document.getElementById("email").value.trim().toLowerCase();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    // Custom UI message box would be better than alert in a real app
    console.log("Enter email and password");
    return;
  }

  try {
    const userCredential = await signInWithEmailAndPassword(auth, email, password);
    const user = userCredential.user;

    localStorage.setItem("currentUserEmail", email);
    localStorage.setItem("uid", user.uid);

    window.location.href = "main-menu.html";

  } catch (err) {
    console.error("Incorrect email or password");
  }
});
</script>

</body>
</html>
