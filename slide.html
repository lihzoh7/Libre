<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPACE GLASS - Main Menu</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: url('https://images.unsplash.com/photo-1549924231-f129b911e442?auto=format&fit=crop&w=1470&q=80') no-repeat center;
  background-size: cover;
  min-height: 100vh;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

/* NAV */
#profile {
  position: absolute;
  top: 10px;
  right: 10px;
  color: white;
  cursor: pointer;
  font-size: 30px;
  z-index: 10;
}

#messages {
  position: absolute;
  top: 10px;
  right: 60px;
  color: white;
  cursor: pointer;
  font-size: 20px;
  font-weight: bold;
  z-index: 10;
}

/* TABS CONTAINER (Centered vertically & horizontally, one below the other) */
.menu-container {
  width: 100%;
  max-width: 480px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  align-items: center;
  justify-content: center;
}

/* INDIVIDUAL TAB STRETCHING LEFT TO RIGHT */
.tab {
  width: 100%;
  height: 60px;
  background: rgba(255, 255, 255, 0.25);
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 12px;
  cursor: pointer;
  color: white;
  font-weight: bold;
  font-size: 20px;
  letter-spacing: 2px;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.4);
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
  transition: all 0.2s ease;
  text-transform: uppercase;
}

.tab:hover {
  transform: scale(1.02);
  background: rgba(255, 255, 255, 0.4);
  box-shadow: 0 6px 20px rgba(0, 240, 255, 0.4);
}

.tab:active {
  transform: scale(0.98);
}

</style>
</head>

<body>

<!-- TOP BUTTONS -->
<div id="messages" onclick="location.href='wallet-form.html'"></div>
<div id="profile" onclick="location.href='profile.html'"></div>

<!-- CENTERED MENU WITH THREE STRETCHED TABS -->
<div class="menu-container">

  <div class="tab" onclick="location.href='prizes.html'">
    PRIZES
  </div>

  <div class="tab" onclick="location.href='life-selector.html'">
    PLAY
  </div>

  <div class="tab" onclick="location.href='scores.html'">
    SCORES
  </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";

import {
  getDatabase,
  ref,
  get
} from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

/* FIREBASE */

const firebaseConfig = {
  apiKey: "AIzaSyBqJTLjxhZBCsvjrTH_cG0fkXlElG6BqTg",
  authDomain: "tose-ccf8f.firebaseapp.com",
  databaseURL: "https://tose-ccf8f-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "tose-ccf8f",
  storageBucket: "tose-ccf8f.appspot.com",
  messagingSenderId: "475447495901",
  appId: "1:475447495901:web:9189276a162a3680afdf34"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

let user;

/* LOGIN CHECK */

onAuthStateChanged(auth, async (u)=>{

  if(!u){
    location.href = "index.html";
    return;
  }

  /* CHECK IF ADMIN */

  const adminSnap = await get(ref(db,"admins/" + u.uid));

  if(adminSnap.exists()){
    alert("Admin must use admin panel");
    location.href = "admin.html";
    return;
  }

  user = u;

});

/* PLAY BUTTON */

document.getElementById("playBtn").onclick = async ()=>{

  if(!user){
    alert("Loading...");
    return;
  }

  const snap = await get(ref(db,"wallet/" + user.uid));

  const data = snap.val() || {};

  /* CHECK LIVES */

  if((data.lives || 0) <= 0){

    alert("NO LIVES");

    return;
  }

  /* ENTER GAME */

  location.href = "life-selecto.html";

};

</script>

</body>
</html>
