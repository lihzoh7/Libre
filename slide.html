<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPACE GLASS - Main Menu</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: url('https://images.unsplash.com/photo-1549924231-f129b911e442?auto=format&fit=crop&w=1470&q=80') no-repeat center;
  background-size: cover;
  min-height: 100vh;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

/* NAV */
#profile {
  position: absolute;
  top: 10px;
  right: 10px;
  color: white;
  cursor: pointer;
  font-size: 30px;
  z-index: 10;
}

#messages {
  position: absolute;
  top: 10px;
  right: 60px;
  color: white;
  cursor: pointer;
  font-size: 20px;
  font-weight: bold;
  z-index: 10;
}

/* WINNERS TOP RIGHT TAB */
#winnersTab {
  position: absolute;
  top: 15px;
  right: 110px;
  background: rgba(0, 128, 0, 0.7);
  color: white;
  padding: 8px 16px;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
  font-size: 14px;
  letter-spacing: 1px;
  z-index: 10;
  display: none; /* Controlled dynamically by admin state */
  border: 1px solid #00ff00;
  backdrop-filter: blur(4px);
}
#winnersTab:hover {
  background: rgba(0, 180, 0, 0.9);
}

/* TABS CONTAINER */
.menu-container {
  width: 100%;
  max-width: 480px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  align-items: center;
  justify-content: center;
}

/* INDIVIDUAL TAB STRETCHING LEFT TO RIGHT */
.tab {
  width: 100%;
  height: 60px;
  background: rgba(255, 255, 255, 0.25);
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 12px;
  cursor: pointer;
  color: white;
  font-weight: bold;
  font-size: 20px;
  letter-spacing: 2px;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.4);
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
  transition: all 0.2s ease;
  text-transform: uppercase;
}

.tab:hover {
  transform: scale(1.02);
  background: rgba(255, 255, 255, 0.4);
  box-shadow: 0 6px 20px rgba(0, 240, 255, 0.4);
}

.tab:active {
  transform: scale(0.98);
}

/* WINNERS FULL VIEW MODAL */
#winnersModal {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.9);
  display: none;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  padding: 20px;
  box-sizing: border-box;
}

#winnersModalContent {
  max-width: 90%;
  max-height: 80vh;
  text-align: center;
}

#winnersDateTime {
  color: #00ff00;
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 15px;
  letter-spacing: 1px;
}

#winnersImg {
  max-width: 100%;
  max-height: 70vh;
  border-radius: 8px;
  border: 2px solid #3b82f6;
  box-shadow: 0 0 20px rgba(59,130,246,0.5);
}

.close-modal-btn {
  margin-top: 20px;
  padding: 10px 25px;
  background: #ff4d4d;
  color: white;
  border: none;
  border-radius: 4px;
  font-weight: bold;
  cursor: pointer;
}
</style>
</head>

<body>

<div id="messages" onclick="location.href='wallet-form.html'"></div>
<div id="profile" onclick="location.href='profile.html'"></div>
<div id="winnersTab" onclick="openActiveWinnerModal()">WINNERS</div>

<div class="menu-container">
  <div class="tab" onclick="location.href='prizes.html'">
    PRIZES
  </div>

  <div class="tab" id="playBtn">
    PLAY
  </div>

  <div class="tab" onclick="location.href='scores.html'">
    SCORES
  </div>
</div>

<!-- WINNERS MODAL POPUP -->
<div id="winnersModal">
  <div id="winnersModalContent">
    <div id="winnersDateTime"></div>
    <img id="winnersImg" src="" alt="Winner Image">
    <br>
    <button class="close-modal-btn" onclick="closeWinnersModal()">Back / Close</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getDatabase, ref, get, onValue } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBqJTLjxhZBCsvjrTH_cG0fkXlElG6BqTg",
  authDomain: "tose-ccf8f.firebaseapp.com",
  databaseURL: "https://tose-ccf8f-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "tose-ccf8f",
  storageBucket: "tose-ccf8f.appspot.com",
  messagingSenderId: "475447495901",
  appId: "1:475447495901:web:9189276a162a3680afdf34"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

let user;
let activeWinnerData = null;

onAuthStateChanged(auth, async (u)=>{
  if(!u){
    location.href = "index.html";
    return;
  }

  const adminSnap = await get(ref(db,"admins/" + u.uid));
  if(adminSnap.exists()){
    alert("Admin must use admin panel");
    location.href = "admin.html";
    return;
  }

  user = u;
  listenToActiveWinner();
});

function listenToActiveWinner() {
  const winnerRef = ref(db, "slideWinnersState/activeWinner");
  onValue(winnerRef, (snapshot) => {
    const data = snapshot.val();
    const tab = document.getElementById("winnersTab");
    if (data && data.visible && data.imageUrl) {
      activeWinnerData = data;
      tab.style.display = "block";
    } else {
      activeWinnerData = null;
      tab.style.display = "none";
      closeWinnersModal();
    }
  });
}

window.openActiveWinnerModal = function() {
  if (!activeWinnerData) return;
  document.getElementById("winnersDateTime").innerText = activeWinnerData.dateTime || "";
  document.getElementById("winnersImg").src = activeWinnerData.imageUrl;
  document.getElementById("winnersModal").style.display = "flex";
};

window.closeWinnersModal = function() {
  document.getElementById("winnersModal").style.display = "none";
};

document.getElementById("playBtn").onclick = async ()=>{
  if(!user){
    alert("Loading...");
    return;
  }

  const snap = await get(ref(db,"wallet/" + user.uid));
  const data = snap.val() || {};

  if((data.lives || 0) <= 0){
    alert("NO LIVES");
    return;
  }

  location.href = "life-selector.html";
};
</script>

</body>
</html>
