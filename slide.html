<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SPACE GLASS - Main Menu</title>

<style>

body{
  margin:0;
  font-family:Arial;
  background:url('https://images.unsplash.com/photo-1549924231-f129b911e442?auto=format&fit=crop&w=1470&q=80') no-repeat center;
  background-size:cover;
  height:100vh;
  overflow:hidden;
}

/* NAV */
#profile{
  position:absolute;
  top:10px;
  right:10px;
  color:white;
  cursor:pointer;
  font-size:30px;
}

#messages{
  position:absolute;
  top:10px;
  right:60px;
  color:white;
  cursor:pointer;
  font-size:20px;
  font-weight:bold;
}

/* TABS */
.tabs{
  position:absolute;
  bottom:50px;
  width:100%;
  display:flex;
  justify-content:center;
  gap:20px;
  flex-wrap:wrap;
}

.tab{
  width:110px;
  height:55px;
  background:rgba(255,255,255,0.25);
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:10px;
  cursor:pointer;
  color:white;
  font-weight:bold;
  backdrop-filter:blur(5px);
  transition:0.2s;
}

.tab:hover{
  transform:scale(1.05);
  background:rgba(255,255,255,0.35);
}

</style>
</head>

<body>

<!-- TOP BUTTONS -->
<div id="messages" onclick="location.href='wallet-form.html'">
</div>

<div id="profile" onclick="location.href='profile.html'">

</div>

<!-- MENU -->
<div class="tabs">

  <div class="tab" onclick="location.href='prizes.html'">
    PRIZES
  </div>

  <div class="tab" onclick="location.href='scores.html'">
    SCORES
  </div>

  <div class="tab" id="playBtn">
    PLAY
  </div>

  <div class="tab" onclick="location.href='wall.html'">
  </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";

import {
  getDatabase,
  ref,
  get
} from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

/* FIREBASE */

const firebaseConfig = {
  apiKey: "AIzaSyBqJTLjxhZBCsvjrTH_cG0fkXlElG6BqTg",
  authDomain: "tose-ccf8f.firebaseapp.com",
  databaseURL: "https://tose-ccf8f-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "tose-ccf8f",
  storageBucket: "tose-ccf8f.appspot.com",
  messagingSenderId: "475447495901",
  appId: "1:475447495901:web:9189276a162a3680afdf34"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

let user;

/* LOGIN CHECK */

onAuthStateChanged(auth, async (u)=>{

  if(!u){
    location.href = "index.html";
    return;
  }

  /* CHECK IF ADMIN */

  const adminSnap = await get(ref(db,"admins/" + u.uid));

  if(adminSnap.exists()){
    alert("Admin must use admin panel");
    location.href = "admin.html";
    return;
  }

  user = u;

});

/* PLAY BUTTON */

document.getElementById("playBtn").onclick = async ()=>{

  if(!user){
    alert("Loading...");
    return;
  }

  const snap = await get(ref(db,"wallet/" + user.uid));

  const data = snap.val() || {};

  /* CHECK LIVES */

  if((data.lives || 0) <= 0){

    alert("NO LIVES");

    return;
  }

  /* ENTER GAME */

  location.href = "life-selector.html";

};

</script>

</body>
</html>
