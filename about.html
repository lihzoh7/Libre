<!DOCTYPE html>  
<html lang="en">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1.0">  
<title>Quizer Game</title>  
<style>  
  body {   
    margin: 0;   
    font-family: Arial, sans-serif;   
    background-color: #87CEEB;   
    color: #333;   
    height: 100vh;   
    display: flex;   
    flex-direction: column;   
  }  
  header {   
    display: flex;   
    justify-content: space-between;   
    padding: 15px;   
    font-weight: bold;   
    font-size: 20px;   
    background: rgba(255,255,255,0.2);   
  }  
  #game-zone {   
    flex: 1;   
    display: flex;   
    flex-direction: column;   
    justify-content: center;   
    align-items: center;   
    padding: 20px;   
    position: relative;   
  }  
  #start-btn {   
    font-size: 80px;   
    cursor: pointer;   
    background: none;   
    border: none;   
    color: #004d00;   
  }  
  #display-box {   
    width: 100%;   
    max-width: 500px;   
    height: 300px;   
    background: #000;   
    border-radius: 8px;   
    display: none;   
    justify-content: center;   
    align-items: center;   
    overflow: hidden;   
    position: relative;   
  }  
  #display-box img, #display-box video {   
    width: 100%;   
    height: 100%;   
    object-fit: contain;   
  }  
  #audio-icon {   
    font-size: 80px;   
    color: white;   
  }  
  #question-text {   
    font-size: 22px;   
    font-weight: bold;   
    margin-bottom: 15px;   
    text-align: center;   
    min-height: 30px;   
  }  

  /* File Navigation Container below file display */
  #nav-controls {
    display: none;
    width: 100%;
    max-width: 500px;
    justify-content: space-between;
    align-items: center;
    margin-top: 20px;
    box-sizing: border-box;
    padding: 0 10px;
  }

  .nav-btn {
    background-color: #004d00;
    color: white;
    border: none;
    border-radius: 50px;
    padding: 12px 24px;
    font-size: 22px;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    transition: background-color 0.2s, transform 0.1s;
  }

  .nav-btn:hover {
    background-color: #006600;
  }

  .nav-btn:active {
    transform: scale(0.95);
  }

  .nav-btn:disabled {
    background-color: #888888;
    cursor: not-allowed;
    opacity: 0.6;
  }

  #replay-btn {   
    position: absolute;   
    bottom: 10px;   
    right: 10px;   
    background: red;   
    color: white;   
    border: none;   
    padding: 5px 10px;   
    font-weight: bold;   
    cursor: pointer;   
    display: none;   
    border-radius: 4px;   
    z-index: 10;   
  }  
  
  /* POPUP CONTAINER MODAL */
  .game-popup {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.85);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 1000;
  }
  .popup-content {
    background: white;
    padding: 30px;
    border-radius: 12px;
    text-align: center;
    max-width: 340px;
    width: 90%;
    box-sizing: border-box;
  }
  .popup-content h2 { margin-top: 0; color: #cc0000; }
  .popup-content button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    font-size: 16px;
    font-weight: bold;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  .btn-continue { background-color: #228B22; color: white; }
  .btn-exit { background-color: #d9534f; color: white; }

  /* GREEN CORRECT ANSWER POPUP STYLE */
  #correctAnswerPopup .popup-content {
    border: 4px solid #228B22;
  }
  #correctAnswerPopup h2 {
    color: #228B22;
  }
  .revealed-answer {
    font-size: 24px;
    font-weight: bold;
    color: #333;
    margin: 15px 0 10px 0;
    padding: 10px;
    background: #e6f7e6;
    border-radius: 6px;
    border: 1px dashed #228B22;
  }
  .popup-timer-text {
    font-size: 14px;
    color: #666;
    margin-bottom: 15px;
  }
</style>

</head>  
<body>  
  <header>  
    <div>Score: <span id="score">0</span></div>  
    <div id="lives-display">Lives: </div>  
  </header>  
  
  <div id="game-zone">  
    <button id="start-btn">▶</button>    
    <div id="question-text"></div>  
    
    <div id="display-box">  
      <button id="replay-btn">replay</button>  
      <img id="game-img" style="display:none;" alt="Quiz Element">  
      <video id="game-video" style="display:none;"></video>  
      <div id="audio-icon" style="display:none;">🔊</div>  
    </div>  

    <!-- File Navigation Buttons -->
    <div id="nav-controls">
      <button id="prev-btn" class="nav-btn">◀ Prev</button>
      <button id="next-btn" class="nav-btn">Next ▶</button>
    </div>
  </div>  

  <!-- Reveal Answer Popup on Nav Transition -->
  <div class="game-popup" id="correctAnswerPopup">  
    <div class="popup-content">  
      <h2>💡 REVEALED ANSWER</h2>  
      <p>The answer for this item was:</p>
      <div class="revealed-answer" id="revealedAnswerText">---</div>  
      <div class="popup-timer-text">Proceeding in <span id="popupCountdown">5</span>s...</div>
      <button class="btn-continue" id="correctPopNextBtn">SKIP & CONTINUE</button>  
    </div>  
  </div>  

  <div class="game-popup" id="lifePopup">  
    <div class="popup-content">  
      <h2>❌ OUT OF LIVES</h2>  
      <p id="life-popup-msg">Would you like to continue?</p>  
      <button class="btn-continue" id="popContinueBtn">CONTINUE</button>  
      <button class="btn-exit" id="popExitBtn">EXIT</button>  
    </div>  
  </div>  

  <div class="game-popup" id="gameOverPopup">  
    <div class="popup-content">  
      <h2 style="color: #004d00;">🎉 GAME OVER</h2>  
      <p style="font-size: 18px; font-weight: bold;">Final Score: <span id="finalScoreLabel">0</span></p>  
      <button class="btn-exit" onclick="location.href='muustandigamin.html'">OK</button>  
    </div>  
  </div>  

<script type="module">  
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";  
  import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";  
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";  
  
  const firebaseConfig = {  
    apiKey: "AIzaSyBqJTLjxhZBCsvjrTH_cG0fkXlElG6BqTg",  
    authDomain: "tose-ccf8f.firebaseapp.com",  
    databaseURL: "https://tose-ccf8f-default-rtdb.europe-west1.firebasedatabase.app",  
    projectId: "tose-ccf8f",  
    storageBucket: "tose-ccf8f.appspot.com",  
  };  
  
  const app = initializeApp(firebaseConfig);  
  const db = getDatabase(app);  
  const auth = getAuth(app);  
  
  let uid, lives, score = 0;  
  let pool = []; 
  let historyStack = []; // Remembers indices of items shown so far
  let historyPointer = -1; // Current index within historyStack
  let activeAudio = null;  
  let revealTimer = null;
  let revealCount = 5;
  let pendingDirection = null; // Stores 'next' or 'prev' during modal reveal

  onAuthStateChanged(auth, async (user) => {  
    if(!user) { location.href = "login.html"; return; }  
    uid = user.uid;  
    
    lives = parseInt(localStorage.getItem("selectedLives")) || 0;  
    updateLivesDisplay();  
    
    if(lives <= 0) { 
      alert("No lives chosen!"); 
      location.href = "quizerlifeselector.html"; 
    }  
  });  
  
  document.getElementById('start-btn').onclick = async function() {  
    this.style.display = 'none';  
    updateLivesDisplay();  
      
    document.getElementById('display-box').style.display = 'flex';  
    document.getElementById('nav-controls').style.display = 'flex';
      
    await loadMediaPool();  
    if(pool.length > 0) {
      navigateToNewItem();
    }
  };  
  
  // Shuffles and loads all media items into flattened question pairs
  async function loadMediaPool() {  
    const types = ['audio', 'video', 'image'];  
    pool = [];  
    for(let t of types){  
      let snap = await get(ref(db, "quizMedia/" + t));  
      let val = snap.val() || {};  
      for(let key in val){  
        let item = {id: key, ...val[key]};
        if(item.questions) {
          for(let i = 0; i < item.questions.length; i++) {
            if(item.questions[i] !== undefined && item.questions[i] !== "") {
              pool.push({
                parentItem: item,
                questionIdx: i,
                question: item.questions[i],
                answer: item.answers ? item.answers[i] : "N/A",
                type: item.type,
                data: item.data
              });
            }
          }
        }
      }  
    }  

    // Randomize / Shuffle the media pool array
    pool.sort(() => Math.random() - 0.5);
  }  

  // Load a new random item onto history stack
  function navigateToNewItem() {
    if(pool.length === 0) {
      alert("No quiz items available in database!");
      return;
    }
    
    // Pick next index from pool (wrapping or picking sequentially from shuffled array)
    let nextPoolIdx = Math.floor(Math.random() * pool.length);
    historyStack.push(nextPoolIdx);
    historyPointer = historyStack.length - 1;
    
    renderCurrentItem();
  }

  // Display current item based on history pointer
  function renderCurrentItem() {  
    if(activeAudio) { activeAudio.pause(); activeAudio = null; }  
      
    document.getElementById('game-img').style.display = 'none';  
    document.getElementById('game-video').style.display = 'none';  
    document.getElementById('audio-icon').style.display = 'none';  
    document.getElementById('replay-btn').style.display = 'none';  
  
    if(historyPointer < 0 || historyPointer >= historyStack.length) return;
    
    let currentData = pool[historyStack[historyPointer]];  
    if(!currentData) return;
  
    document.getElementById('question-text').innerText = currentData.question;  
      
    if(currentData.type === 'image'){  
      const img = document.getElementById('game-img');  
      img.src = currentData.data;  
      img.style.display = 'block';  
    } else if(currentData.type === 'video'){  
      const vid = document.getElementById('game-video');  
      vid.src = currentData.data;  
      vid.style.display = 'block';  
      vid.play().catch(e => console.log("Autoplay caught, user interaction needed."));  
      document.getElementById('replay-btn').style.display = 'block';  
    } else if(currentData.type === 'audio'){  
      document.getElementById('audio-icon').style.display = 'block';  
      activeAudio = new Audio(currentData.data);  
      activeAudio.play().catch(e => console.log("Autoplay caught, user interaction needed."));  
      document.getElementById('replay-btn').style.display = 'block';  
    }  

    // Update navigation button states
    document.getElementById('prev-btn').disabled = (historyPointer <= 0);
  }  

  document.getElementById('replay-btn').onclick = function() {  
    if(historyPointer < 0) return;
    let currentData = pool[historyStack[historyPointer]];
    if(currentData.type === 'video') {  
      const vid = document.getElementById('game-video');  
      vid.currentTime = 0;  
      vid.play();  
    } else if(currentData.type === 'audio' && activeAudio) {  
      activeAudio.currentTime = 0;  
      activeAudio.play();  
    }  
  };  

  // Trigger Navigation with Answer Reveal popup
  document.getElementById('prev-btn').onclick = function() {
    if(historyPointer > 0) {
      triggerAnswerReveal('prev');
    }
  };

  document.getElementById('next-btn').onclick = function() {
    triggerAnswerReveal('next');
  };

  function triggerAnswerReveal(direction) {
    if(historyPointer < 0 || historyPointer >= historyStack.length) return;
    
    if(activeAudio) activeAudio.pause();
    
    pendingDirection = direction;
    let currentData = pool[historyStack[historyPointer]];
    let ans = currentData ? (currentData.answer || "N/A") : "N/A";

    document.getElementById('revealedAnswerText').innerText = ans;
    document.getElementById('correctAnswerPopup').style.display = 'flex';

    // Start 5 second countdown for auto-close
    revealCount = 5;
    document.getElementById('popupCountdown').innerText = revealCount;
    clearInterval(revealTimer);
    
    revealTimer = setInterval(() => {
      revealCount--;
      document.getElementById('popupCountdown').innerText = revealCount;
      if(revealCount <= 0) {
        clearInterval(revealTimer);
        confirmRevealAndProceed();
      }
    }, 1000);
  }

  function confirmRevealAndProceed() {
    clearInterval(revealTimer);
    document.getElementById('correctAnswerPopup').style.display = 'none';

    // Award score upon navigating forward
    if(pendingDirection === 'next') {
      score += 10;
      document.getElementById('score').innerText = score;
    }

    if(pendingDirection === 'prev') {
      if(historyPointer > 0) {
        historyPointer--;
        renderCurrentItem();
      }
    } else if(pendingDirection === 'next') {
      if(historyPointer < historyStack.length - 1) {
        historyPointer++;
        renderCurrentItem();
      } else {
        navigateToNewItem();
      }
    }
    pendingDirection = null;
  }

  document.getElementById('correctPopNextBtn').onclick = function() {  
    confirmRevealAndProceed();
  };

  document.getElementById('popContinueBtn').onclick = function() {  
    document.getElementById('lifePopup').style.display = 'none';  
  };  
  
  document.getElementById('popExitBtn').onclick = function() {  
    location.href = "muustandigamin.html";  
  };  
  
  function updateLivesDisplay() {  
    let out = '';  
    for(let i=0; i<lives; i++) out += '❤️ ';  
    document.getElementById('lives-display').innerText = "Lives: " + (out || "None");  
  }  
  
  async function showEndGameModal() {  
    if(activeAudio) activeAudio.pause();  
    document.getElementById('lifePopup').style.display = 'none';  
    document.getElementById('correctAnswerPopup').style.display = 'none'; 
    document.getElementById('finalScoreLabel').innerText = score;  
    document.getElementById('gameOverPopup').style.display = 'flex';  
  
    if (uid) {  
      const userProfileSnap = await get(ref(db, "users/" + uid));  
      const userProfile = userProfileSnap.val();  
      const realName = userProfile?.name   
        ? userProfile.name + " " + (userProfile.surname || "")  
        : "Player";  
  
      const currentSnap = await get(ref(db, "leaderboard/quizer/" + uid));  
      const currentData = currentSnap.val();  
  
      if(!currentData || score > (currentData.score || 0)) {  
        await set(ref(db, "leaderboard/quizer/" + uid), {  
          name: realName,  
          score: score,  
          timestamp: Date.now()  
        });  
      }  
    }  
  }  
</script>  
</body>  
</html>
