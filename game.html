<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SLIDE GAME</title>

<style>
body{
  margin:0;
  background:#000;
  overflow:hidden;
  font-family:Arial;
  color:white;
}

#game{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
}

#bg{
  position:absolute;
  width:100%;
  height:100%;
  background:url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?fit=crop&w=1600&q=80');
  background-size:cover;
}

/* PLAYER */
#player{
  position:absolute;
  left:80px;
  top:200px;
  font-size:42px;
  z-index:10;
}

/* HUD */
#hud{
  position:absolute;
  top:10px;
  width:100%;
  display:flex;
  justify-content:space-between;
  padding:0 20px;
  font-weight:bold;
  z-index:50;
}

#centerHud{
  position:absolute;
  top:10px;
  width:100%;
  text-align:center;
  font-weight:bold;
}

/* POPUPS */
.popup{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:rgba(0,0,0,0.8);
  padding:20px;
  border-radius:10px;
  text-align:center;
  z-index:100;
}

/* RINGS */
.ring{
  position:absolute;
  font-size:40px;
}

/* FRUITS */
.fruit{
  position:absolute;
  font-size:28px;
}

/* ENEMIES */
.enemy{
  position:absolute;
  font-size:32px;
}

</style>
</head>

<body>

<div id="game">

<div id="bg"></div>

<div id="player">🍸</div>

<div id="hud">
  <div>Score: <span id="score">0</span></div>
  <div>❤️ <span id="lives">0</span></div>
</div>

<div id="centerHud">💍 <span id="ringsPassed">0</span></div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getAuth,onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

const firebaseConfig={
  apiKey:"AIzaSy...",
  authDomain:"tose-ccf8f.firebaseapp.com",
  projectId:"tose-ccf8f"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);

onAuthStateChanged(auth,(user)=>{
  if(!user) location.href="index.html";
  else initGame(user);
});

</script>

<script>
const API = "https://payfast-backend-475447495901.europe-west1.run.app";

let player=document.getElementById("player");
let scoreEl=document.getElementById("score");
let livesEl=document.getElementById("lives");
let ringsEl=document.getElementById("ringsPassed");

let y=200, velocity=0;
let gravity=0.6;
let jumpForce=-10;

let score=0;
let lives=3;
let ringsPassed=0;
let missedRings=0;

let boost=false;
let gameRunning=true;

/* INIT */
async function initGame(user){

  const res = await fetch(API + "/game/start",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({uid:user.uid})
  });

  const data = await res.json();

  lives = data.lives || 3;
  livesEl.innerText = lives;

  startLoops();
}

/* GAME LOOP */
function startLoops(){
  requestAnimationFrame(update);
  spawnRings();
  spawnFruits();
  spawnEnemies();
}

/* UPDATE */
function update(){

  if(!gameRunning) return;

  velocity += gravity;
  y += velocity;

  if(y < 0) y = 0;
  if(y > window.innerHeight-80){
    death();
    return;
  }

  player.style.top = y + "px";

  requestAnimationFrame(update);
}

/* JUMP */
document.addEventListener("click",()=>{
  velocity = jumpForce;
});

/* RINGS */
function spawnRings(){
  let count=0;

  let interval=setInterval(()=>{
    if(count>=150){ clearInterval(interval); winGame(); return; }

    let ring=document.createElement("div");
    ring.className="ring";
    ring.innerText="💍";
    ring.style.left=window.innerWidth+"px";
    ring.style.top=Math.random()*400+"px";

    document.getElementById("game").appendChild(ring);

    let move=setInterval(()=>{
      let x=ring.offsetLeft-4;
      ring.style.left=x+"px";

      if(checkCollision(ring)){
        score+=7;
        ringsPassed++;
        updateHUD();
        ring.remove();
        clearInterval(move);

        if([30,70,100,140].includes(ringsPassed)){
          score*=2;
          alert("✖2️⃣");
        }
      }

      if(x<0){
        missedRings++;
        ring.remove();
        clearInterval(move);
        if(missedRings>=5) death();
      }

    },16);

    count++;

  },2500);
}

/* FRUITS */
function spawnFruits(){

  const fruits=[
    {emoji:"🍒",points:4,time:3000},
    {emoji:"🫐",points:6,time:5000},
    {emoji:"🍓",points:8,time:7000}
  ];

  fruits.forEach(f=>{
    setInterval(()=>{
      let el=document.createElement("div");
      el.className="fruit";
      el.innerText=f.emoji;
      el.style.left=Math.random()*window.innerWidth+"px";
      el.style.top=Math.random()*window.innerHeight+"px";

      document.getElementById("game").appendChild(el);

      let move=setInterval(()=>{
        if(checkCollision(el)){
          score+=f.points;
          updateHUD();
          el.remove();
          clearInterval(move);
        }
      },100);

      setTimeout(()=>el.remove(),4000);

    },f.time);
  });

}

/* ENEMIES */
function spawnEnemies(){

  setInterval(()=>{
    let fly=document.createElement("div");
    fly.className="enemy";
    fly.innerText="🪰";
    fly.style.left=window.innerWidth+"px";
    fly.style.top=Math.random()*400+"px";

    document.getElementById("game").appendChild(fly);

    let move=setInterval(()=>{
      fly.style.left=(fly.offsetLeft-6)+"px";

      if(checkCollision(fly)){
        death();
      }

      if(fly.offsetLeft<0){
        fly.remove();
        clearInterval(move);
      }

    },16);

  },7500);

}

/* COLLISION */
function checkCollision(el){
  let r1=player.getBoundingClientRect();
  let r2=el.getBoundingClientRect();

  return !(r1.right<r2.left || r1.left>r2.right || r1.bottom<r2.top || r1.top>r2.bottom);
}

/* UPDATE HUD */
function updateHUD(){
  scoreEl.innerText=score;
  ringsEl.innerText=ringsPassed;
}

/* DEATH */
function death(){
  gameRunning=false;

  if(lives>0){
    if(confirm("💔 BROKEN\nContinue?")){
      lives--;
      livesEl.innerText=lives;
      gameRunning=true;
      y=200;
      velocity=0;
      update();
      return;
    }
  }

  endGame();
}

/* WIN */
function winGame(){
  gameRunning=false;
  alert("🎉 CONGRATULATIONS");
  endGame();
}

/* SAVE SCORE */
async function endGame(){

  try{
    await fetch("https://payfast-backend-475447495901.europe-west1.run.app/scores/current",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        uid:window.firebaseUser.uid,
        score:score
      })
    });
  }catch(e){}

  alert("FINAL SCORE: "+score);
  location.href="main-menu.html";
}

</script>

</body>
  </html>
