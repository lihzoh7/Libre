<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RING-MASTER</title>

<style>
body{
  margin:0;
  background:black;
  overflow:hidden;
  font-family:Arial;
  color:white;
}

/* GAME AREA (MOBILE FULLSCREEN) */
#game{
  width:100vw;
  height:100vh;
  position:relative;
  overflow:hidden;
}

/* SCROLLING BACKGROUND */
#bg{
  position:absolute;
  width:200%;
  height:100%;
  background:url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?fit=crop&w=1600&q=80');
  background-size:cover;
  animation:scroll 20s linear infinite;
}

@keyframes scroll{
  from{transform:translateX(0)}
  to{transform:translateX(-50%)}
}

/* PLAYER */
#player{
  position:absolute;
  left:80px;
  top:200px;
  font-size:42px;
  z-index:10;
}

/* HUD */
#hud{
  position:absolute;
  top:10px;
  left:10px;
  z-index:50;
}

#center{
  position:absolute;
  top:10px;
  width:100%;
  text-align:center;
  font-weight:bold;
}

/* POPUPS */
.popup{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:black;
  padding:20px;
  border-radius:10px;
  text-align:center;
  z-index:100;
}

/* MISS POPUP */
.miss{
  position:absolute;
  top:80px;
  left:50%;
  transform:translateX(-50%);
  background:#ff4d4d;
  padding:8px 15px;
  border-radius:8px;
}

/* OBJECTS */
.ring,.fruit,.enemy{
  position:absolute;
  font-size:30px;
}
</style>
</head>

<body>

<div id="game">

<div id="bg"></div>

<div id="player">🍸</div>

<div id="hud">
Score: <span id="score">0</span><br>
❤️ <span id="lives">0</span>
</div>

<div id="center">
💍 <span id="rings">0</span>
</div>

<div id="popup" class="popup"></div>

</div>

<script>
const uid = localStorage.getItem("uid");

/* GAME VARIABLES */
let y=200, velocity=0;
let gravity=0.6, jump=-10;

let score=0;
let walletLives=0;
let gameLives=0;

let rings=0;
let missed=0;

let running=false;
let boostActive=false;
let boostTimer=0;
let speedMultiplier=1;

let rocketCount=0;
const player=document.getElementById("player");
const popup=document.getElementById("popup");

/* =====================
   ⏰ SLOT SYSTEM
===================== */
function gameOpen(){
  let now=new Date();
  let h=now.getHours();
  let m=now.getMinutes();

  let t=h*60+m;

  let morningStart=6*60;
  let morningEnd=17*60+30;

  let nightStart=18*60;
  let nightEnd=(5*60+30)+1440;

  if(t>=morningStart && t<=morningEnd) return true;
  if(t>=nightStart || t<=5*60+30) return true;

  return false;
}

/* =====================
   ❤️ LIFE SELECTOR
===================== */
function showSelector(){

  let data=JSON.parse(localStorage.getItem("wallet_"+uid)||"{}");
  walletLives=data.lives||0;

  if(!gameOpen()){
    popup.style.display="block";
    popup.innerHTML="<h2>GAME CLOSED</h2>";
    return;
  }

  let count=0;

  popup.style.display="block";

  popup.innerHTML=`
    <h3>Lives ♥ = ${walletLives}</h3>
    <button onclick="dec()">➖</button>
    <span id="count">0</span>
    <button onclick="inc()">➕</button>
    <br><br>
    <button onclick="enter()">ENTER</button>
  `;

  window.inc=()=>{
    if(count<walletLives && count<5){
      count++;
      document.getElementById("count").innerText=count;
    }
  }

  window.dec=()=>{
    if(count>0){
      count--;
      document.getElementById("count").innerText=count;
    }
  }

  window.enter=()=>{
    if(count<=0) return alert("SELECT LIVES");

    if(count>walletLives) return alert("INSUFFICIENT LIVES");

    let data=JSON.parse(localStorage.getItem("wallet_"+uid)||"{}");
    data.lives-=count;
    localStorage.setItem("wallet_"+uid,JSON.stringify(data));

    gameLives=count-1;
    document.getElementById("lives").innerText=gameLives;

    popup.style.display="none";

    startGame();
  }
}

/* =====================
   🚀 START GAME
===================== */
function startGame(){
  running=true;
  update();
  spawnRings();
  spawnEnemies();
  spawnFruits();
}

/* =====================
   🎮 PLAYER
===================== */
document.addEventListener("click",()=>velocity=jump);

/* =====================
   🔄 LOOP
===================== */
function update(){
  if(!running) return;

  velocity+=gravity;
  y+=velocity;

  if(y<0) y=0; // ceiling

  if(y>window.innerHeight-80){
    lose();
    return;
  }

  player.style.top=y+"px";

  requestAnimationFrame(update);
}

/* =====================
   💍 RINGS
===================== */
function spawnRings(){
  setInterval(()=>{
    if(!running) return;

    let r=document.createElement("div");
    r.className="ring";
    r.innerText="💍";
    r.style.left=window.innerWidth+"px";
    r.style.top=Math.random()*400+"px";
    r.style.fontSize="60px"; // 2.1x bigger

    game.appendChild(r);

    let move=setInterval(()=>{
      let x=r.offsetLeft-5;
      r.style.left=x+"px";

      if(hit(r)){
        r.innerText="🟡"; // GOLD effect
        score+=10;
        rings++;

        document.getElementById("score").innerText=score;
        document.getElementById("rings").innerText=rings;

        setTimeout(()=>r.remove(),100);
        clearInterval(move);
      }

      if(x<0){
        missed++;
        showMiss();
        r.remove();
        clearInterval(move);

        if(missed>=5) lose();
      }

    },16);

  },2000);
}

/* =====================
   ❌ MISS POPUP
===================== */
function showMiss(){
  let m=document.createElement("div");
  m.className="miss";
  m.innerText="MISSED: "+missed;
  game.appendChild(m);

  setTimeout(()=>m.remove(),800);
}

/* 🪰 ENEMY (ZIGZAG) 
   Travel time: 4 Seconds (Responsive)
===================== */
function spawnEnemies(){
  setInterval(()=>{
    if(!running) return;

    let e = document.createElement("div");
    e.className = "enemy";
    e.innerText = "🪰";
    
    // Start at the far right edge
    e.style.left = window.innerWidth + "px";
    e.style.top = "200px";

    game.appendChild(e);

    let angle = 0;

    let move = setInterval(() => {
      // CALCULATE SPEED: Screen width divided by (Seconds * 62.5 frames per second)
      // window.innerWidth / 250 = 4 seconds total travel time
      let speed = window.innerWidth / 250; 
      
      // Horizontal Movement
      e.style.left = (e.offsetLeft - speed) + "px";
      
      // Vertical Zigzag (Sine Wave)
      angle += 0.2; 
      e.style.top = (200 + Math.sin(angle) * 100) + "px";

      if(hit(e)) lose();

      // Remove the enemy once it is completely off-screen to the left
      if(e.offsetLeft < -50){
        e.remove();
        clearInterval(move);
      }

    }, 16);

  }, 6000); // New enemy spawns every 6 seconds
}


/* =====================
   🍓 FRUITS
===================== */
function spawnFruits(){
  setInterval(()=>{
    if(!running) return;

    let f=document.createElement("div");
    f.className="fruit";
    f.innerText="🍓";
    f.style.left=window.innerWidth+"px";
    f.style.top=Math.random()*400+"px";

    game.appendChild(f);

    let move=setInterval(()=>{
      f.style.left=(f.offsetLeft-4)+"px";

      if(hit(f)){
        score+=5;
        document.getElementById("score").innerText=score;
        f.remove();
        clearInterval(move);
      }

      if(f.offsetLeft<0){
        f.remove();
        clearInterval(move);
      }

    },16);

  },4000);
}

/* =====================
   💥 COLLISION
===================== */
function hit(el){
  let a=player.getBoundingClientRect();
  let b=el.getBoundingClientRect();

  return !(a.right<b.left||a.left>b.right||a.bottom<b.top||a.top>b.bottom);
}

/* =====================
   💔 LIFE SYSTEM
===================== */
function lose(){
  running=false;

  if(gameLives>0){
    popup.style.display="block";
    popup.innerHTML=`
      <h2>💔 Continue?</h2>
      <button onclick="cont()">YES (-1)</button>
      <button onclick="exit()">EXIT</button>
    `;
  }else{
    endGame();
  }
}

window.cont=()=>{
  gameLives--;
  missed=0; // RESET MISSED 🔥
  document.getElementById("lives").innerText=gameLives;
  popup.style.display="none";
  y=200;
  velocity=0;
  running=true;
  update();
};

window.exit=()=>endGame();

/* =====================
   🏁 END
===================== */
function endGame(){
  alert("FINAL SCORE: "+score);
  location.href="main-menu.html";
}

/* START */
showSelector();
</script>

</body>
  </html>
