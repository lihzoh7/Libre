<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SLIDE</title>

<style>
body{
  margin:0;
  background:#000;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  color:white;
  font-family:Arial;
}

/* 2:3 MOBILE GAME */
#game{
  width:100vw;
  max-width:400px;
  height:100vh;
  position:relative;
  overflow:hidden;
}

/* MOVING BACKGROUND */
#bg{
  position:absolute;
  width:200%;
  height:100%;
  background:url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?fit=crop&w=1600&q=80');
  background-size:cover;
}

/* PLAYER */
#player{
  position:absolute;
  left:80px;
  top:200px;
  font-size:42px;
  z-index:10;
}

/* HUD */
#hud{
  position:absolute;
  top:10px;
  width:100%;
  display:flex;
  justify-content:space-between;
  padding:0 15px;
  z-index:50;
}

#centerHud{
  position:absolute;
  top:10px;
  width:100%;
  text-align:center;
  font-weight:bold;
}

/* POPUP */
.popup{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:black;
  padding:20px;
  border-radius:10px;
  text-align:center;
  z-index:100;
}

/* MISS POPUP */
.miss{
  position:absolute;
  top:20%;
  left:50%;
  transform:translateX(-50%);
  background:#ff4d4d;
  padding:10px;
  border-radius:8px;
}

/* ITEMS */
.ring{position:absolute;font-size:48px;}
.enemy{position:absolute;font-size:32px;}
.fruit{position:absolute;font-size:26px;}
</style>
</head>

<body>

<div id="game">

<div id="bg"></div>

<div id="player">🍸</div>

<div id="hud">
  <div>Score: <span id="score">0</span></div>
  <div>❤️ <span id="lives">0</span></div>
</div>

<div id="centerHud">💍 <span id="rings">0</span></div>

<div id="popup" class="popup"></div>

</div>

<script>

/* =========================
   ⏰ GAME TIMER (REAL SLOTS)
========================= */
function gameOpen(){
  let now = new Date();
  let minutes = now.getHours()*60 + now.getMinutes();

  let morningStart = 6*60;
  let morningEnd = 17*60 + 30;

  let eveningStart = 18*60;
  let eveningEnd = 24*60 + (5*60 + 30);

  if(minutes >= morningStart && minutes <= morningEnd) return true;
  if(minutes >= eveningStart || minutes <= (5*60+30)) return true;

  return false;
}

/* =========================
   VARIABLES
========================= */
let uid = localStorage.getItem("uid");

let player = document.getElementById("player");
let popup = document.getElementById("popup");

let score=0;
let rings=0;
let missed=0;

let lives=0;
let gameLives=0;

let y=200, vel=0;
let gravity=0.6;
let jump=-10;

let running=false;

/* =========================
   LIFE SELECTOR
========================= */
function showSelector(){

  let data = JSON.parse(localStorage.getItem("wallet_"+uid) || "{}");
  lives = data.lives || 0;

  if(!gameOpen()){
    popup.innerHTML="<h2>GAME CLOSED</h2>";
    popup.style.display="block";
    return;
  }

  let count=0;

  popup.style.display="block";
  popup.innerHTML=`
    <h3>Lives ♥ = ${lives}</h3>
    <div>
      <button onclick="dec()">➖</button>
      <span id="count">0</span>
      <button onclick="inc()">➕</button>
    </div>
    <button onclick="enter()">ENTER</button>
  `;

  window.inc=()=>{
    if(count < lives && count < 5){
      count++;
      document.getElementById("count").innerText=count;
    }
  }

  window.dec=()=>{
    if(count>0){
      count--;
      document.getElementById("count").innerText=count;
    }
  }

  window.enter=()=>{

    if(count<=0){
      alert("SELECT LIVES");
      return;
    }

    if(count>lives){
      alert("INSUFFICIENT LIVES");
      return;
    }

    data.lives -= count;
    localStorage.setItem("wallet_"+uid, JSON.stringify(data));

    gameLives = count - 1; // one used instantly
    document.getElementById("lives").innerText = gameLives;

    popup.style.display="none";

    startGame();
  }
}

/* =========================
   START GAME
========================= */
function startGame(){
  running=true;
  moveBg();
  update();
  spawnRings();
  spawnEnemies();
  spawnFruits();
}

/* =========================
   BACKGROUND MOVE
========================= */
function moveBg(){
  let bg=document.getElementById("bg");
  let pos=0;

  setInterval(()=>{
    pos-=1;
    bg.style.left=pos+"px";
  },16);
}

/* =========================
   PLAYER CONTROL
========================= */
document.addEventListener("click",()=> vel=jump);

/* =========================
   LOOP
========================= */
function update(){
  if(!running) return;

  vel+=gravity;
  y+=vel;

  if(y>window.innerHeight-100){
    loseLife();
    return;
  }

  player.style.top=y+"px";

  requestAnimationFrame(update);
}

/* =========================
   RINGS (GOLD +1.8x)
========================= */
function spawnRings(){
  setInterval(()=>{
    if(!running) return;

    let r=document.createElement("div");
    r.className="ring";
    r.innerText="💍";
    r.style.left="100%";
    r.style.top=Math.random()*400+"px";

    game.appendChild(r);

    let move=setInterval(()=>{
      r.style.left=(r.offsetLeft-5)+"px";

      if(hit(r)){
        score += Math.floor(10 * 1.8);
        rings++;
        updateHUD();
        r.remove();
        clearInterval(move);
      }

      if(r.offsetLeft<0){
        missed++;
        showMiss();
        r.remove();
        clearInterval(move);

        if(missed>=5) loseLife();
      }

    },16);

  },2000);
}

/* =========================
   MISS POPUP
========================= */
function showMiss(){
  let m=document.createElement("div");
  m.className="miss";
  m.innerText="MISSED "+missed+"/5";
  game.appendChild(m);

  setTimeout(()=>m.remove(),1000);
}

/* =========================
   ENEMIES
========================= */
function spawnEnemies(){
  setInterval(()=>{
    if(!running) return;

    let e=document.createElement("div");
    e.className="enemy";
    e.innerText="🪰";
    e.style.left="100%";
    e.style.top=Math.random()*400+"px";

    game.appendChild(e);

    let move=setInterval(()=>{
      e.style.left=(e.offsetLeft-6)+"px";

      if(hit(e)) loseLife();

      if(e.offsetLeft<0){
        e.remove();
        clearInterval(move);
      }

    },16);

  },5000);
}

/* =========================
   FRUITS
========================= */
function spawnFruits(){
  setInterval(()=>{
    if(!running) return;

    let f=document.createElement("div");
    f.className="fruit";
    f.innerText="🍓";
    f.style.left=Math.random()*300+"px";
    f.style.top=Math.random()*400+"px";

    game.appendChild(f);

    setTimeout(()=>{
      if(hit(f)){
        score+=5;
        updateHUD();
      }
      f.remove();
    },3000);

  },4000);
}

/* =========================
   COLLISION
========================= */
function hit(el){
  let a=player.getBoundingClientRect();
  let b=el.getBoundingClientRect();

  return !(a.right<b.left||a.left>b.right||a.bottom<b.top||a.top>b.bottom);
}

/* =========================
   HUD
========================= */
function updateHUD(){
  scoreEl.innerText=score;
  document.getElementById("rings").innerText=rings;
}

/* =========================
   LIFE SYSTEM
========================= */
function loseLife(){
  running=false;

  if(gameLives>0){
    popup.style.display="block";
    popup.innerHTML=`
      <h2>💔 Continue?</h2>
      <button onclick="cont()">YES (-1)</button>
      <button onclick="exit()">EXIT</button>
    `;
  }else{
    endGame();
  }
}

window.cont=()=>{
  gameLives--;
  missed=0; // RESET MISSED
  document.getElementById("lives").innerText=gameLives;

  popup.style.display="none";

  y=200;
  vel=0;
  running=true;
  update();
};

window.exit=()=> endGame();

/* =========================
   END GAME
========================= */
function endGame(){
  alert("FINAL SCORE: "+score);
  location.href="main-menu.html";
}

/* START */
showSelector();

</script>

</body>
  </html>
