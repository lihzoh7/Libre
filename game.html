<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SLIDE GAME</title>

<style>
body{
  margin:0;
  background:#111;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  color:white;
  font-family:Arial;
}

#game{
  width:800px;
  height:500px;
  position:relative;
  background:url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?fit=crop&w=1600&q=80');
  overflow:hidden;
}

#player{
  position:absolute;
  left:120px;
  top:200px;
  font-size:40px;
}

#hud{
  position:absolute;
  top:10px;
  left:10px;
}

#overlay{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.7);
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
}

#lifePopup{
  position:fixed;
  inset:0;
  background:black;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
}

button{
  padding:10px;
  margin:5px;
}
</style>
</head>

<body>

<!-- LIFE SELECTOR -->
<div id="lifePopup">
  <h2>Lives ♥ = <span id="balance">0</span></h2>

  <div>
    <button onclick="dec()">➖</button>
    <span id="count">0</span>
    <button onclick="inc()">➕</button>
  </div>

  <button onclick="enterGame()">ENTER</button>
</div>

<div id="game">

<div id="player">🍸</div>

<div id="hud">
Score: <span id="score">0</span><br>
Lives: <span id="lives">0</span>
</div>

<div id="overlay">
<h2 id="msg"></h2>
<button onclick="continueGame()">CONTINUE (-1)</button>
<button onclick="exitGame()">EXIT</button>
</div>

</div>

<script>
const API_BASE = "https://payfast-backend-475447495901.europe-west1.run.app";
let selected = 0;
let maxLives = 0;
let sessionId = null;

let score = 0;
let lives = 0;

let y = 200;
let velocity = 0;

const GRAVITY = 0.6;
const JUMP = -10;

/* ---------------- LOAD LIVES ---------------- */
async function loadLives(){
  const uid = localStorage.getItem("uid");

  const res = await fetch(API+"/economy/user/economy?uid="+uid);
  const data = await res.json();

  maxLives = data.lives || 0;
  document.getElementById("balance").innerText = maxLives;
}

/* ---------------- SELECTOR ---------------- */
function inc(){
  if(selected < maxLives && selected < 5){
    selected++;
    count.innerText = selected;
  }
}

function dec(){
  if(selected > 0){
    selected--;
    count.innerText = selected;
  }
}

/* ---------------- START GAME ---------------- */
async function enterGame(){

  if(selected <= 0){
    alert("INSUFFICIENT LIVES");
    return;
  }

  const uid = localStorage.getItem("uid");

  const res = await fetch(API+"/game/start",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ uid })
  });

  const data = await res.json();

  if(data.error){
    alert(data.error);
    return;
  }

  sessionId = data.sessionId;
  lives = data.livesRemaining;

  document.getElementById("lives").innerText = lives;

  document.getElementById("lifePopup").style.display="none";

  startGame();
}

/* ---------------- GAME LOOP ---------------- */
function startGame(){

  function loop(){
    velocity += GRAVITY;
    y += velocity;

    if(y > 420){
      endGame("💔 You crashed");
      return;
    }

    player.style.top = y+"px";

    requestAnimationFrame(loop);
  }

  loop();
}

/* ---------------- JUMP ---------------- */
document.addEventListener("click",()=>{
  velocity = JUMP;
});

/* ---------------- END GAME ---------------- */
function endGame(text){
  msg.innerText = text;
  overlay.style.display="flex";
}

/* ---------------- CONTINUE ---------------- */
async function continueGame(){

  const uid = localStorage.getItem("uid");

  const res = await fetch(API+"/game/continue",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ uid, sessionId })
  });

  const data = await res.json();

  if(data.error){
    alert(data.error);
    return;
  }

  lives = data.livesRemaining;
  document.getElementById("lives").innerText = lives;

  overlay.style.display="none";
  y = 200;
  velocity = 0;
  startGame();
}

/* ---------------- EXIT ---------------- */
function exitGame(){
  location.reload();
}

/* ---------------- INIT ---------------- */
loadLives();
</script>

</body>
      </html>
