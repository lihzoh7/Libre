<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SLIDE</title>

<style>
body{
margin:0;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:#111;
color:white;
font-family:Arial;
}

.game{
width:800px;
height:500px;
position:relative;
overflow:hidden;
background:url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?fit=crop&w=1600&q=80');
background-size:cover;
}

#player{
position:absolute;
left:120px;
top:200px;
font-size:40px;
}

.hud{
position:absolute;
top:10px;
left:10px;
z-index:10;
}

.popup{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:black;
padding:20px;
text-align:center;
z-index:100;
}

.btn{
padding:10px;
margin:5px;
cursor:pointer;
}

.ring,.enemy,.fruit{
position:absolute;
font-size:30px;
}
</style>
</head>

<body>

<div class="game" id="game">

<div id="player">🍸</div>

<div class="hud">
Score: <span id="score">0</span><br>
❤️ <span id="lives">0</span>
</div>

<div id="popup" class="popup"></div>

</div>

<script>
const uid = localStorage.getItem("uid");

let player = document.getElementById("player");
let popup = document.getElementById("popup");

let y=200, velocity=0;
let gravity=0.6, jump=-10;

let score=0;
let lives=0;
let gameLives=0;
let running=false;

/* =========================
   🧠 GAME TIMER (OPEN/CLOSE)
========================= */
function gameOpen(){
  const hour = new Date().getHours();
  return hour >= 8 && hour <= 22; // OPEN 8AM - 10PM
}

/* =========================
   🎯 LIFE SELECTOR
========================= */
function showLifeSelector(){

  let data = JSON.parse(localStorage.getItem("wallet_"+uid) || "{}");
  lives = data.lives || 0;

  if(!gameOpen()){
    popup.innerHTML = "<h2>GAME CLOSED</h2>";
    return;
  }

  let count = 0;

  popup.style.display="block";

  popup.innerHTML = `
    <h3>Lives ♥ = ${lives}</h3>

    <div>
      <button onclick="dec()">➖</button>
      <span id="count">0</span>
      <button onclick="inc()">➕</button>
    </div>

    <button onclick="enterGame()">ENTER</button>
  `;

  window.inc = ()=>{
    if(count < lives && count < 5){
      count++;
      document.getElementById("count").innerText=count;
    }
  };

  window.dec = ()=>{
    if(count > 0){
      count--;
      document.getElementById("count").innerText=count;
    }
  };

  window.enterGame = ()=>{
    if(count <= 0){
      alert("SELECT LIVES");
      return;
    }

    if(count > lives){
      alert("INSUFFICIENT LIVES");
      return;
    }

    let data = JSON.parse(localStorage.getItem("wallet_"+uid) || "{}");

    data.lives -= count;
    localStorage.setItem("wallet_"+uid, JSON.stringify(data));

    gameLives = count - 1; // one used immediately
    document.getElementById("lives").innerText = gameLives;

    popup.style.display="none";

    startGame();
  };
}

/* =========================
   🚀 START GAME
========================= */
function startGame(){
  running = true;
  requestAnimationFrame(update);
  spawnRings();
  spawnEnemies();
  spawnFruits();
}

/* =========================
   🎮 PLAYER CONTROL
========================= */
document.addEventListener("click",()=>{
  velocity = jump;
});

/* =========================
   🔄 GAME LOOP
========================= */
function update(){
  if(!running) return;

  velocity += gravity;
  y += velocity;

  if(y > 420){
    loseLife();
    return;
  }

  player.style.top = y+"px";

  requestAnimationFrame(update);
}

/* =========================
   💍 RINGS
========================= */
function spawnRings(){
  setInterval(()=>{
    if(!running) return;

    let r=document.createElement("div");
    r.className="ring";
    r.innerText="💍";
    r.style.left="800px";
    r.style.top=Math.random()*400+"px";

    game.appendChild(r);

    let move=setInterval(()=>{
      let x=r.offsetLeft-5;
      r.style.left=x+"px";

      if(hit(r)){
        score+=10;
        scoreEl.innerText=score;
        r.remove();
        clearInterval(move);
      }

      if(x<0){
        r.remove();
        clearInterval(move);
      }

    },16);

  },2000);
}

/* =========================
   🪰 ENEMIES
========================= */
function spawnEnemies(){
  setInterval(()=>{
    if(!running) return;

    let e=document.createElement("div");
    e.className="enemy";
    e.innerText="🪰";
    e.style.left="800px";
    e.style.top=Math.random()*400+"px";

    game.appendChild(e);

    let move=setInterval(()=>{
      e.style.left=(e.offsetLeft-6)+"px";

      if(hit(e)){
        loseLife();
      }

      if(e.offsetLeft<0){
        e.remove();
        clearInterval(move);
      }

    },16);

  },5000);
}

/* =========================
   🍓 FRUITS
========================= */
function spawnFruits(){
  setInterval(()=>{
    if(!running) return;

    let f=document.createElement("div");
    f.className="fruit";
    f.innerText="🍓";
    f.style.left=Math.random()*700+"px";
    f.style.top=Math.random()*400+"px";

    game.appendChild(f);

    setTimeout(()=>{
      if(hit(f)){
        score+=5;
        scoreEl.innerText=score;
      }
      f.remove();
    },3000);

  },4000);
}

/* =========================
   💥 COLLISION
========================= */
function hit(el){
  let a=player.getBoundingClientRect();
  let b=el.getBoundingClientRect();

  return !(a.right<b.left||a.left>b.right||a.bottom<b.top||a.top>b.bottom);
}

/* =========================
   💔 LIFE SYSTEM
========================= */
function loseLife(){
  running=false;

  if(gameLives>0){
    popup.style.display="block";
    popup.innerHTML=`
      <h2>💔 Continue?</h2>
      <button onclick="cont()">YES (-1)</button>
      <button onclick="exit()">EXIT</button>
    `;
  }else{
    endGame();
  }
}

window.cont = ()=>{
  gameLives--;
  document.getElementById("lives").innerText=gameLives;
  popup.style.display="none";
  y=200;
  velocity=0;
  running=true;
  update();
};

window.exit = ()=> endGame();

/* =========================
   🏁 END GAME
========================= */
function endGame(){
  alert("FINAL SCORE: "+score);
  location.href="main-menu.html";
}

/* START */
showLifeSelector();
</script>

</body>
  </html>
