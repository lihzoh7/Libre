<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RING-MASTER</title>

<style>
body{
  margin:0;
  background:black;
  overflow:hidden;
  font-family:Arial;
  color:white;
}

/* GAME AREA (MOBILE FULLSCREEN) */
#game{
  width:100vw;
  height:100vh;
  position:relative;
  overflow:hidden;
}

/* SCROLLING BACKGROUND */
#bg{
  position:absolute;
  width:200%;
  height:100%;
  background:url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?fit=crop&w=1600&q=80');
  background-size:cover;
  animation:scroll 20s linear infinite;
}

@keyframes scroll{
  from{transform:translateX(0)}
  to{transform:translateX(-50%)}
}

/* PLAYER */
#player{
  position:absolute;
  left:80px;
  top:200px;
  font-size:42px;
  z-index:10;
}

/* HUD */
#hud{
  position:absolute;
  top:10px;
  left:10px;
  z-index:50;
}

#center{
  position:absolute;
  top:10px;
  width:100%;
  text-align:center;
  font-weight:bold;
}

/* POPUPS */


/* ADD THIS */
.popup button{
  padding:10px 14px;
  margin:5px;
  font-size:18px;
  border:none;
  border-radius:8px;
  background:#0074D9;
  color:white;
  cursor:pointer;
  }

/* MISS POPUP */
.miss{
  position:absolute;
  top:80px;
  left:50%;
  transform:translateX(-50%);
  background:#ff4d4d;
  padding:8px 15px;
  border-radius:8px;
}

/* OBJECTS */
.ring,.fruit,.enemy{
  position:absolute;
  font-size:30px;
}
</style>
</head>

<body>

<div id="game">

<div id="bg"></div>

<div id="player">🍸</div>

<div id="hud">
Score: <span id="score">0</span><br>
❤️ <span id="lives">0</span>
</div>

<div id="center">
💍 <span id="rings">0</span>
</div>

<div id="popup" class="popup"></div>

</div>

<script type="module">
import { get } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getDatabase, ref, push, set } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
import { firebaseConfig } from "./firebase-config.js";

const firebaseConfig = {
  apiKey: "AIzaSyBqJTLjxhZBCsvjrTH_cG0fkXlElG6BqTg",
  authDomain: "tose-ccf8f.firebaseapp.com",
  databaseURL: "https://tose-ccf8f-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "tose-ccf8f",
  storageBucket: "tose-ccf8f.appspot.com",
  messagingSenderId: "475447495901",
  appId: "1:475447495901:web:9189276a162a3680afdf34"
};
  
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

let user;

/* SAVE SCORE */
async function saveScore(finalScore){

  const uid = user.uid;
  const time = Date.now();

  // HIGH SCORES
  await push(ref(db,"highScores/"+uid),{
    score: finalScore,
    timestamp: time
  });

  // LIVE LEADERBOARD
  await set(ref(db,"leaderboard/current/"+uid),{
    score: finalScore,
    timestamp: time
  });
}

/* OVERRIDE YOUR END GAME */
window.endGame = async function(){

  await saveScore(score);

  popup.style.display="block";
  popup.innerHTML=`
    <h2>FINAL SCORE</h2>
    <h1>${score}</h1>
    <button onclick="goMenu()">OK</button>
  `;
};

/* GAME VARIABLES */
let y=200, velocity=0;
let gravity=0.6, jump=-10;

let score=0;
let walletLives=0;
let gameLives=0;

let rings=0;
let missed=0;

let running=false;
let boostActive=false;
let boostTimer=0;
let speedMultiplier=1;

let rocketCount=0;
const player=document.getElementById("player");
const popup=document.getElementById("popup");

/* =====================
   ⏰ SLOT SYSTEM
===================== */
function gameOpen(){
  let now=new Date();
  let h=now.getHours();
  let m=now.getMinutes();

  let t=h*60+m;

  let morningStart=6*60;
  let morningEnd=17*60+30;

  let nightStart=18*60;
  let nightEnd=(5*60+30)+1440;

  if(t>=morningStart && t<=morningEnd) return true;
  if(t>=nightStart || t<=5*60+30) return true;

  return false;
}

/* =====================
   ❤️ LIFE SELECTOR
===================== */
 
/* =====================
   🚀 START GAME
===================== */
function startGame(){
  running=true;
  update();
  spawnRings();
  spawnEnemies();
  spawnFruits();
  spawnBoost();     // NEW
  spawnRockets();   // NEW
  }

/* =====================
   🎮 PLAYER
===================== */
document.addEventListener("click",(e)=>{
  if(e.target.closest(".popup")) return; // ignore popup clicks
  velocity = jump;
});
/* =====================
   🔄 LOOP
===================== */
function update(){
  if(!running) return;

  velocity+=gravity;
  y+=velocity;

  if(y<0) y=0; // ceiling

  if(y>window.innerHeight-80){
    lose();
    return;
  }

  player.style.top=y+"px";

  requestAnimationFrame(update);
}

/* =====================
   💍 RINGS
===================== */
function spawnRings(){
  setInterval(()=>{
    if(!running) return;

    let r=document.createElement("div");
    r.className="ring";
    r.innerText="💍";
    r.style.left=window.innerWidth+"px";
    r.style.top=Math.random()*400+"px";
    r.style.fontSize="60px"; // 2.1x bigger

    game.appendChild(r);

    let move=setInterval(()=>{
      let x=r.offsetLeft-(5*speedMultiplier);
      r.style.left=x+"px";

      if(hit(r)){
        r.innerText="🟡"; // GOLD effect
        score+=10;
        rings++;

        document.getElementById("score").innerText=score;
        document.getElementById("rings").innerText=rings;

        setTimeout(()=>r.remove(),100);
        clearInterval(move);
      }

      if(x<0 && !boostActive){
        missed++;
        showMiss();
        r.remove();
        clearInterval(move);

        if(missed>=5) lose();
      }

    },16);

  },2000);
}

/* =====================
   ❌ MISS POPUP
===================== */
function showMiss(){
  let m=document.createElement("div");
  m.className="miss";
  m.innerText="MISSED: "+missed;
  game.appendChild(m);

  setTimeout(()=>m.remove(),800);
}

/* 🪰 ENEMY (ZIGZAG) 
   Travel time: 4 Seconds (Responsive)
===================== */
function spawnEnemies(){
  setInterval(()=>{
    if(!running) return;

    let e = document.createElement("div");
    e.className = "enemy";
    e.innerText = "🪰";
    
    // Start at the far right edge
    e.style.left = window.innerWidth + "px";
    e.style.top = "200px";

    game.appendChild(e);

    let angle = 0;

    let move = setInterval(() => {
      // CALCULATE SPEED: Screen width divided by (Seconds * 62.5 frames per second)
      // window.innerWidth / 250 = 4 seconds total travel time
      let speed = window.innerWidth / 250; 
      
      // Horizontal Movement
      e.style.left = (e.offsetLeft - speed) + "px";
      
      // Vertical Zigzag (Sine Wave)
      angle += 0.2; 
      e.style.top = (200 + Math.sin(angle) * 100) + "px";
if(hit(e)){
  if(!boostActive){
    lose();
  } else {
    e.remove(); // destroy enemy during boost
    clearInterval(move);
  }
  }
    }, 16);

  }, 6000); // New enemy spawns every 6 seconds
}

/* =====================
   🍓 FRUITS
===================== */
function spawnFruits(){

const fruits=[
{emoji:"🍒",points:4,interval:3000},
{emoji:"🫐",points:6,interval:5000},
{emoji:"🍓",points:8,interval:7000},
{emoji:"🍇",points:10,interval:8500},
{emoji:"🍎",points:14,interval:12000},
{emoji:"🍌",points:20,interval:15000},
{emoji:"🥭",points:30,interval:20000},
{emoji:"🍉",points:50,interval:33000}
];

fruits.forEach(f=>{
  setInterval(()=>{
    if(!running) return;

    let el=document.createElement("div");
    el.className="fruit";
    el.innerText=f.emoji;
    el.style.left=window.innerWidth+"px";
    el.style.top=Math.random()*350+"px";

    game.appendChild(el);

    let move=setInterval(()=>{
      el.style.left=(el.offsetLeft-(3*speedMultiplier))+"px";

      if(hit(el)){
        score+=f.points;
        document.getElementById("score").innerText=score;
        el.remove();
        clearInterval(move);
      }

      if(el.offsetLeft<0){
        el.remove();
        clearInterval(move);
      }

    },16);

  },f.interval);
});

  }
  
function spawnBoost(){
  setInterval(()=>{
    if(!running) return;

    let b=document.createElement("div");
    b.innerText="⚡";
    b.className="fruit";
    b.style.left=window.innerWidth+"px";
    b.style.top=Math.random()*300+"px";

    game.appendChild(b);

    let move=setInterval(()=>{
      b.style.left=(b.offsetLeft-4)+"px";

      if(hit(b)){
        activateBoost();
        b.remove();
        clearInterval(move);
      }

      if(b.offsetLeft<0){
        b.remove();
        clearInterval(move);
      }

    },16);

  },15000); // every 15s
  }
function activateBoost(){
  if(boostActive) return;

  boostActive=true;

  // slow entry effect
  speedMultiplier = 0.7;

  setTimeout(()=>{
    speedMultiplier = 3;
    player.innerText="🦅"; // eagle
  },500);

  setTimeout(()=>{
    boostActive=false;
    speedMultiplier=1;
    player.innerText="🍸";
  },7000);
  }
/* 🚀 ROCKET (ARC + ROTATION + WIGGLE) 
   Travel time: ~3.7 Seconds 
===================== */
function spawnRockets() {
  setInterval(() => {
    if (!running) return;
    // (Note: ensure rocketCount is defined globally)
    if (typeof rocketCount !== 'undefined' && rocketCount >= 60) return;

    let r = document.createElement("div");
    r.className = "enemy";
    r.innerText = "🚀";
    
    // Setup initial positions
    const startX = window.innerWidth;
    const bottomY = window.innerHeight - 150; 
    const peakHeight = 400; 
    
    r.style.left = startX + "px";
    r.style.top = bottomY + "px";
    r.style.position = "absolute"; // Ensure it can move
    game.appendChild(r);

    let startTime = Date.now();
    const duration = 3700; // 3.7 Seconds

    let move = setInterval(() => {
      let elapsed = Date.now() - startTime;
      let progress = elapsed / duration; 

      if (progress >= 1) {
        r.remove();
        clearInterval(move);
        return;
      }

      // 1. Horizontal Movement
      let currentX = startX - (progress * (startX + 100));
      r.style.left = currentX + "px";

      // 2. Vertical Arc (Upside down U)
      let curve = 4 * progress * (1 - progress); 
      let currentY = bottomY - (curve * peakHeight);
      r.style.top = currentY + "px";

      // 3. Directional Rotation
      // As progress goes 0 -> 0.5 (climbing), 0.5 -> 1 (falling)
      // We tilt the rocket to face the path.
      let tilt = (progress < 0.5) ? -45 : 45; 
      
      // 4. The Wiggle (Fast Sine Wave)
      let wiggle = Math.sin(Date.now() * 0.02) * 10; 

      // Apply all transformations:
      // scaleX(-1) flips the rocket to face LEFT
      // rotate handles the arc direction + the wiggle
      r.style.transform = `scaleX(-1) rotate(${tilt + wiggle}deg)`;

      // Collision Logic
      if (hit(r)) {
        r.innerText = "💥";
        setTimeout(() => r.remove(), 200);
        clearInterval(move);
        if (typeof boostActive !== 'undefined' && !boostActive) {
          lose();
        }
      }
    }, 16);
  }, 11000);
}

  
/* =====================
   💥 COLLISION
===================== */
function hit(el){
  let a=player.getBoundingClientRect();
  let b=el.getBoundingClientRect();

  return !(a.right<b.left||a.left>b.right||a.bottom<b.top||a.top>b.bottom);
}

/* =====================
   💔 LIFE SYSTEM
===================== */
function lose(){
  running=false;

  if(gameLives>0){
    popup.style.display="block";
    popup.innerHTML=`
      <h2>💔 Continue?</h2>
      <button onclick="cont()">YES (-1)</button>
      <button onclick="exit()">EXIT</button>
    `;
  }else{
    endGame();
  }
}

window.cont=()=>{
  gameLives--;
  missed=0; // RESET MISSED 🔥
  document.getElementById("lives").innerText=gameLives;
  popup.style.display="none";
  y=200;
  velocity=0;
  running=true;
  update();
};

window.exit=()=>endGame();

/* =====================
   🏁 END
===================== */
function endGame(){
  popup.style.display="block";

  popup.innerHTML=`
    <h2>FINAL SCORE</h2>
    <h1>${score}</h1>
    <button onclick="goMenu()">OK</button>
  `;
}

window.goMenu = ()=>{
  location.href="main-menu.html";
};

/* START */
onAuthStateChanged(auth, (u)=>{
  if(!u){
    location.href="index.html";
    return;
  }

  user = u;

  // ✅ GET SELECTED LIVES FROM SELECTOR PAGE
  let selected = parseInt(localStorage.getItem("selectedLives")) || 0;

  // 🚫 if user came here without selecting
  if(selected <= 0){
    location.href = "main-menu.html";
    return;
  }

  // 🎯 SET GAME LIVES
  gameLives = selected - 1;
  document.getElementById("lives").innerText = gameLives;

  // 🚀 START GAME
  startGame();
});
</script>

</body>
  </html>
