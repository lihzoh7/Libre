<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SLIDE FINAL</title>

<style>
body{
  margin:0;
  background:#000;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  font-family:Arial;
  color:white;
}

/* 2:3 MOBILE GAME */
#game{
  width:100vw;
  max-width:400px;
  height:100vh;
  max-height:600px;
  position:relative;
  overflow:hidden;
  background:black;
}

/* MOVING BG */
#bg{
  position:absolute;
  width:200%;
  height:100%;
  background:url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?fit=crop&w=1600&q=80');
  background-size:cover;
}

/* PLAYER */
#player{
  position:absolute;
  left:70px;
  top:200px;
  font-size:42px;
  z-index:10;
}

/* HUD */
#hud{
  position:absolute;
  top:10px;
  left:10px;
}

#centerHud{
  position:absolute;
  top:10px;
  width:100%;
  text-align:center;
  font-weight:bold;
}

/* POPUPS */
.popup{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:#000;
  padding:20px;
  border-radius:10px;
  text-align:center;
  z-index:100;
}

/* RED MISS POPUP */
.miss{
  position:absolute;
  top:40%;
  left:50%;
  transform:translate(-50%,-50%);
  background:#ff4d4d;
  color:white;
  padding:10px;
  border-radius:8px;
}

/* OBJECTS */
.ring{position:absolute;font-size:50px;}
.enemy{position:absolute;font-size:32px;}
.fruit{position:absolute;font-size:28px;}

button{padding:8px;margin:5px;}
</style>
</head>

<body>

<div id="game">

<div id="bg"></div>
<div id="player">🍸</div>

<div id="hud">
Score: <span id="score">0</span><br>
❤️ <span id="lives">0</span>
</div>

<div id="centerHud">
💍 <span id="rings">0</span>
</div>

<div id="popup" class="popup"></div>

</div>

<script>
const uid = localStorage.getItem("uid");

/* GAME VARS */
let y=200, velocity=0;
let gravity=0.6, jump=-10;

let score=0;
let lives=0;
let gameLives=0;
let ringsPassed=0;
let missed=0;

let running=false;

/* SLOT SYSTEM */
function gameOpen(){
  const now = new Date();
  let h = now.getHours();
  let m = now.getMinutes();

  let t = h*60 + m;

  // 06:00 → 17:30
  if(t>=360 && t<=1050) return true;

  // 18:00 → 05:30 (overnight)
  if(t>=1080 || t<=330) return true;

  return false;
}

/* LIFE SELECTOR */
function showSelector(){
  let data = JSON.parse(localStorage.getItem("wallet_"+uid)||"{}");
  lives = data.lives || 0;

  if(!gameOpen()){
    popup.innerHTML="<h2>GAME CLOSED</h2>";
    popup.style.display="block";
    return;
  }

  let count=0;

  popup.style.display="block";
  popup.innerHTML=`
    <h3>Lives ♥ = ${lives}</h3>
    <button onclick="dec()">➖</button>
    <span id="count">0</span>
    <button onclick="inc()">➕</button><br>
    <button onclick="enter()">ENTER</button>
  `;

  window.inc=()=>{
    if(count<lives && count<5){
      count++;
      countEl.innerText=count;
    }
  };

  window.dec=()=>{
    if(count>0){
      count--;
      countEl.innerText=count;
    }
  };

  window.enter=()=>{
    if(count<=0) return alert("SELECT LIVES");
    if(count>lives) return alert("INSUFFICIENT LIVES");

    data.lives -= count;
    localStorage.setItem("wallet_"+uid,JSON.stringify(data));

    gameLives = count-1;
    livesEl.innerText = gameLives;

    popup.style.display="none";
    startGame();
  };
}

/* START */
function startGame(){
  running=true;
  moveBG();
  update();
  spawnRings();
  spawnEnemies();
  spawnFruits();
}

/* BG MOVE */
function moveBG(){
  let x=0;
  setInterval(()=>{
    if(!running) return;
    x-=1;
    bg.style.backgroundPosition = x+"px 0";
  },20);
}

/* PLAYER */
document.addEventListener("click",()=>velocity=jump);

/* LOOP */
function update(){
  if(!running) return;

  velocity+=gravity;
  y+=velocity;

  if(y>520){
    loseLife();
    return;
  }

  player.style.top=y+"px";

  requestAnimationFrame(update);
}

/* RINGS (GOLD +1.8x) */
function spawnRings(){
  setInterval(()=>{
    if(!running) return;

    let r=document.createElement("div");
    r.className="ring";
    r.innerText="💍";
    r.style.left="400px";
    r.style.top=Math.random()*400+"px";
    game.appendChild(r);

    let move=setInterval(()=>{
      r.style.left=(r.offsetLeft-5)+"px";

      if(hit(r)){
        score += Math.floor(10*1.8);
        ringsPassed++;
        scoreEl.innerText=score;
        rings.innerText=ringsPassed;
        r.remove();
        clearInterval(move);
      }

      if(r.offsetLeft<0){
        missed++;
        showMiss();
        r.remove();
        clearInterval(move);

        if(missed>=5) loseLife();
      }

    },16);

  },2000);
}

/* MISS POPUP */
function showMiss(){
  let m=document.createElement("div");
  m.className="miss";
  m.innerText="MISSED "+missed+"/5";
  game.appendChild(m);

  setTimeout(()=>m.remove(),800);
}

/* ENEMIES */
function spawnEnemies(){
  setInterval(()=>{
    if(!running) return;

    let e=document.createElement("div");
    e.className="enemy";
    e.innerText="🪰";
    e.style.left="400px";
    e.style.top=Math.random()*400+"px";
    game.appendChild(e);

    let move=setInterval(()=>{
      e.style.left=(e.offsetLeft-6)+"px";

      if(hit(e)) loseLife();

      if(e.offsetLeft<0){
        e.remove();
        clearInterval(move);
      }
    },16);

  },5000);
}

/* FRUITS */
function spawnFruits(){
  setInterval(()=>{
    if(!running) return;

    let f=document.createElement("div");
    f.className="fruit";
    f.innerText="🍓";
    f.style.left=Math.random()*350+"px";
    f.style.top=Math.random()*400+"px";
    game.appendChild(f);

    setTimeout(()=>{
      if(hit(f)){
        score+=5;
        scoreEl.innerText=score;
      }
      f.remove();
    },3000);

  },4000);
}

/* COLLISION */
function hit(el){
  let a=player.getBoundingClientRect();
  let b=el.getBoundingClientRect();
  return !(a.right<b.left||a.left>b.right||a.bottom<b.top||a.top>b.bottom);
}

/* LIFE LOSS */
function loseLife(){
  running=false;

  if(gameLives>0){
    popup.style.display="block";
    popup.innerHTML=`
      <h2>💔 Continue?</h2>
      <button onclick="cont()">YES</button>
      <button onclick="exit()">EXIT</button>
    `;
  }else{
    endGame();
  }
}

/* CONTINUE (RESET MISS COUNT) */
window.cont=()=>{
  gameLives--;
  livesEl.innerText=gameLives;
  missed=0;

  popup.style.display="none";
  y=200;
  velocity=0;
  running=true;
  update();
};

/* EXIT */
window.exit=()=>endGame();

/* END */
function endGame(){
  alert("FINAL SCORE: "+score);
  location.href="main-menu.html";
}

/* START */
showSelector();
</script>

</body>
  </html>
