<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SLIDE</title>

<style>
body{
  margin:0;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  background:#000;
  color:white;
  font-family:Arial;
}

/* 2:3 GAME RATIO */
#game{
  width:360px;
  height:540px;
  position:relative;
  overflow:hidden;
  background:black;
}

/* MOVING BACKGROUND */
#bg{
  position:absolute;
  width:200%;
  height:100%;
  background:url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?fit=crop&w=1600&q=80');
  background-size:cover;
}

/* PLAYER */
#player{
  position:absolute;
  left:80px;
  top:200px;
  font-size:42px;
  z-index:10;
}

/* HUD */
#hud{
  position:absolute;
  top:10px;
  left:10px;
}

#centerHud{
  position:absolute;
  top:10px;
  width:100%;
  text-align:center;
}

/* POPUP */
#popup{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:black;
  padding:20px;
  text-align:center;
  display:none;
  z-index:100;
}

/* OBJECTS */
.ring{position:absolute;font-size:50px;}
.enemy{position:absolute;font-size:32px;}
.fruit{position:absolute;font-size:28px;}
</style>
</head>

<body>

<div id="game">

<div id="bg"></div>

<div id="player">🍸</div>

<div id="hud">
Score: <span id="score">0</span><br>
❤️ <span id="lives">0</span>
</div>

<div id="centerHud">
💍 <span id="rings">0</span>
</div>

<div id="popup"></div>

</div>

<script>
const uid = localStorage.getItem("uid");

/* =========================
   ⏱ GAME TIME SYSTEM
========================= */
function gameOpen(){
  const now = new Date();
  let h = now.getHours();
  let m = now.getMinutes();

  // 06:00 → 17:30
  if(h >= 6 && (h < 17 || (h === 17 && m <= 30))) return true;

  // 18:00 → 05:30
  if(h >= 18 || (h < 5) || (h === 5 && m <= 30)) return true;

  return false;
}

/* =========================
   🎯 LIFE SELECTOR
========================= */
let lives=0;
let gameLives=0;

function showSelector(){

  if(!gameOpen()){
    popup.style.display="block";
    popup.innerHTML="<h2>GAME CLOSED</h2>";
    return;
  }

  let data = JSON.parse(localStorage.getItem("wallet_"+uid)||"{}");
  lives = data.lives || 0;

  let count = 0;

  popup.style.display="block";
  popup.innerHTML=`
    <h3>Lives ♥ = ${lives}</h3>
    <button onclick="dec()">➖</button>
    <span id="count">0</span>
    <button onclick="inc()">➕</button>
    <br><br>
    <button onclick="enter()">ENTER</button>
  `;

  window.inc=()=>{
    if(count < lives && count < 5){
      count++;
      document.getElementById("count").innerText=count;
    }
  };

  window.dec=()=>{
    if(count>0){
      count--;
      document.getElementById("count").innerText=count;
    }
  };

  window.enter=()=>{
    if(count<=0){ alert("SELECT LIVES"); return; }
    if(count>lives){ alert("INSUFFICIENT LIVES"); return; }

    let data = JSON.parse(localStorage.getItem("wallet_"+uid)||"{}");
    data.lives -= count;
    localStorage.setItem("wallet_"+uid, JSON.stringify(data));

    gameLives = count - 1; // one life used immediately
    livesEl.innerText = gameLives;

    popup.style.display="none";
    startGame();
  };
}

/* =========================
   🚀 GAME
========================= */
let y=200, vel=0;
let gravity=0.6, jump=-10;

let score=0;
let rings=0;
let missed=0;

let running=false;

const player=document.getElementById("player");
const scoreEl=document.getElementById("score");
const livesEl=document.getElementById("lives");
const ringsEl=document.getElementById("rings");
const popup=document.getElementById("popup");
const bg=document.getElementById("bg");

/* BACKGROUND MOVE */
function moveBG(){
  let x=0;
  setInterval(()=>{
    x-=1;
    bg.style.left=x+"px";
    if(x<-360) x=0;
  },16);
}

/* START */
function startGame(){
  running=true;
  moveBG();
  update();
  spawnRings();
  spawnEnemies();
  spawnFruits();
}

/* UPDATE */
function update(){
  if(!running) return;

  vel += gravity;
  y += vel;

  if(y > 460){
    loseLife();
    return;
  }

  player.style.top = y+"px";
  requestAnimationFrame(update);
}

/* JUMP */
document.addEventListener("click",()=> vel=jump);

/* =========================
   💍 GOLD RINGS (x1.8)
========================= */
function spawnRings(){
  setInterval(()=>{
    if(!running) return;

    let r=document.createElement("div");
    r.className="ring";
    r.innerText="💍";
    r.style.left="360px";
    r.style.top=Math.random()*400+"px";

    game.appendChild(r);

    let move=setInterval(()=>{
      let x=r.offsetLeft-4;
      r.style.left=x+"px";

      if(hit(r)){
        score += Math.floor(10 * 1.8);
        rings++;
        scoreEl.innerText=score;
        ringsEl.innerText=rings;

        r.remove();
        clearInterval(move);
      }

      if(x<0){
        missed++;
        showMiss();
        r.remove();
        clearInterval(move);

        if(missed>=5) loseLife();
      }

    },16);

  },2000);
}

/* MISS POPUP */
function showMiss(){
  popup.style.display="block";
  popup.style.background="red";
  popup.innerHTML=`MISSED: ${missed}`;
  setTimeout(()=> popup.style.display="none",800);
}

/* =========================
   🪰 ENEMIES
========================= */
function spawnEnemies(){
  setInterval(()=>{
    if(!running) return;

    let e=document.createElement("div");
    e.className="enemy";
    e.innerText="🪰";
    e.style.left="360px";
    e.style.top=Math.random()*400+"px";

    game.appendChild(e);

    let move=setInterval(()=>{
      e.style.left=(e.offsetLeft-6)+"px";

      if(hit(e)) loseLife();

      if(e.offsetLeft<0){
        e.remove();
        clearInterval(move);
      }

    },16);

  },5000);
}

/* =========================
   🍓 FRUITS
========================= */
function spawnFruits(){
  setInterval(()=>{
    if(!running) return;

    let f=document.createElement("div");
    f.className="fruit";
    f.innerText="🍓";
    f.style.left=Math.random()*300+"px";
    f.style.top=Math.random()*400+"px";

    game.appendChild(f);

    setTimeout(()=>{
      if(hit(f)){
        score+=5;
        scoreEl.innerText=score;
      }
      f.remove();
    },3000);

  },4000);
}

/* =========================
   💥 COLLISION
========================= */
function hit(el){
  let a=player.getBoundingClientRect();
  let b=el.getBoundingClientRect();

  return !(a.right<b.left||a.left>b.right||a.bottom<b.top||a.top>b.bottom);
}

/* =========================
   💔 LIFE SYSTEM
========================= */
function loseLife(){
  running=false;

  if(gameLives>0){
    popup.style.display="block";
    popup.style.background="black";
    popup.innerHTML=`
      <h2>💔 Continue?</h2>
      <button onclick="cont()">YES (-1)</button>
      <button onclick="exit()">EXIT</button>
    `;
  } else {
    endGame();
  }
}

window.cont=()=>{
  gameLives--;
  livesEl.innerText=gameLives;

  missed=0; // RESET MISSED
  popup.style.display="none";

  y=200;
  vel=0;
  running=true;
  update();
};

window.exit=()=> endGame();

/* =========================
   🏁 END
========================= */
function endGame(){
  alert("FINAL SCORE: "+score);
  location.href="main-menu.html";
}

/* START */
showSelector();
</script>

</body>
</html>
