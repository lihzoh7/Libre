<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPACE GLASS - Sign Up</title>

<style>
body { 
  background-color: lightblue; 
  font-family: Arial, sans-serif; 
  display:flex; 
  justify-content:center; 
  align-items:center; 
  height:100vh; 
  margin:0; 
}

/* BLUR EFFECT */
.blur{
  filter: blur(5px);
  pointer-events:none;
}

.container { 
  width:400px; 
  background: rgba(0,0,0,0.1); 
  padding:20px; 
  border-radius:8px; 
  position:relative;
  box-sizing: border-box;
}

h1 { 
  color:white; 
  font-size:14px; 
  text-align:center; 
}

input { 
  width:100%; 
  padding:10px; 
  margin:5px 0; 
  border:none; 
  border-radius:4px; 
  box-sizing: border-box;
}

#submitBtn { 
  width:100%; 
  padding:10px; 
  background:green; 
  color:white; 
  border:none; 
  border-radius:4px;
  cursor:pointer; 
  font-weight: bold;
}

/* NEW SIGN IN TAB */
.signin-tab {
  margin-top: 20px; /* Skips a line */
  background-color: #90ee90; /* Light Green */
  width: 100%;
  padding: 12px 0;
  border-radius: 4px;
  text-align: center;
}

.signin-tab a {
  text-decoration: none;
  color: #004d00; /* Darker green for readability */
  font-weight: bold;
  font-size: 14px;
  display: block; /* Makes the whole tab clickable area larger */
}

.signin-tab:hover {
  background-color: #77dd77;
}

/* POPUP */
#popup{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:white;
  color:black;
  padding:30px;
  border-radius:10px;
  text-align:center;
  display:none;
  z-index:1000;
  width:300px;
}

#popup button{
  margin-top:15px;
  padding:10px;
  background:#6a0dad;
  color:white;
  border:none;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="container" id="main">
  <h1>PERSONAL DETAILS</h1>

  <input id="name" placeholder="Name">
  <input id="surname" placeholder="Surname">
  <input id="email" type="email" placeholder="Email">
  <input id="cellNumber" placeholder="Cell Number">
  <input id="referral" placeholder="Referral Code">
  
  <h1>SECURITY</h1>
  <input id="password" type="password" placeholder="Password">
  <input id="confirmPassword" type="password" placeholder="Confirm Password">

  <button id="submitBtn">SUBMIT</button>

  <!-- New Tab Bar -->
  <div class="signin-tab">
    <a href="login.html">Already Have An Account? Sign In</a>
  </div>
</div>

<!-- POPUP -->
<div id="popup">
  <h2>✅ Account Created</h2>
  <p>You will be redirected to login</p>
  <button onclick="goLogin()">OK</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword } 
from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
import { getDatabase, ref, set } 
from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBqJTLjxhZBCsvjrTH_cG0fkXlElG6BqTg",
  authDomain: "tose-ccf8f.firebaseapp.com",
  databaseURL: "https://tose-ccf8f-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "tose-ccf8f",
  storageBucket: "tose-ccf8f.appspot.com",
  messagingSenderId: "475447495901",
  appId: "1:475447495901:web:9189276a162a3680afdf34"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

const popup = document.getElementById("popup");
const main = document.getElementById("main");

// Reference inputs
const nameInput = document.getElementById("name");
const surnameInput = document.getElementById("surname");
const emailInput = document.getElementById("email");
const cellNumberInput = document.getElementById("cellNumber");
const referralInput = document.getElementById("referral");
const passwordInput = document.getElementById("password");
const confirmPasswordInput = document.getElementById("confirmPassword");

document.getElementById("submitBtn").addEventListener("click", async () => {

  const name = nameInput.value.trim();
  const surname = surnameInput.value.trim();
  const email = emailInput.value.trim().toLowerCase();
  const cellNumber = cellNumberInput.value.trim();
  const referral = referralInput.value.trim().toLowerCase();
  const password = passwordInput.value;
  const confirmPassword = confirmPasswordInput.value;

  if (!name || !surname || !email || !cellNumber || !password || !confirmPassword) {
    return alert("Fill all fields");
  }

  if (password.length < 8) {
    return alert("Password must be at least 8 characters");
  }

  if (password !== confirmPassword) {
    return alert("Passwords do not match");
  }

  const validReferrals = ["gamer1", "gamer2", "Khumalo3", "Rori1", "gamer5"];
  const bonusLives = validReferrals.includes(referral) ? 3 : 0;

  try {
    const cred = await createUserWithEmailAndPassword(auth, email, password);

    await set(ref(db, "users/" + cred.user.uid), {
      uid: cred.user.uid,
      name,
      surname,
      email,
      cellNumber,
      referral,
      createdAt: Date.now()
    });

    await set(ref(db, "wallet/" + cred.user.uid), {
      gems: 0,
      lives: bonusLives
    });  

    main.classList.add("blur");
    popup.style.display = "block";

    setTimeout(() => {
      window.location.href = "login.html";
    }, 3000);

  } catch (err) {
    alert(err.message);
  }
});

window.goLogin = () => {
  window.location.href = "login.html";
};
</script>

</body>
</html>
