<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>muustandigamin</title>
    <style>
        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Smooth gradient background mixing dark blue and black */
            background: linear-gradient(135deg, #000000, #0a192f, #000000);
            background-attachment: fixed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        /* Heading Style */
        h1 {
            font-size: 3rem;
            margin-bottom: 40px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 150, 255, 0.7);
            text-align: center;
        }

        /* Container for the tiles */
        .tile-container {
            width: 100%;
            max-width: 1000px; /* Limits maximum width on large screens for better look */
            display: flex;
            flex-direction: column;
            gap: 25px; /* Space between the tiles */
        }

        /* Tile Link Wrapper */
        .tile-link {
            text-decoration: none;
            color: inherit;
            display: block;
            width: 100%;
        }

        /* Individual Tile Styling */
        .tile {
            position: relative;
            width: 100%;
            height: 180px; /* Height of each tile */
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #1e3a8a;
            background-color: #020617;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Hover effects for the tiles */
        .tile-link:hover .tile {
            transform: translateY(-5px);
            border-color: #3b82f6;
            box-shadow: 0 12px 25px rgba(59, 130, 246, 0.4);
        }

        /* Background Image Styling inside the tiles */
        .tile-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; /* Ensures image covers the tile nicely without distorting */
            opacity: 0.6; /* Slight transparency so text stands out */
            transition: opacity 0.3s ease;
            z-index: 1;
        }

        .tile-link:hover .tile-bg {
            opacity: 0.85; /* Brightens the image on hover */
        }

        /* Tile Text Styling */
        .tile-title {
            position: relative;
            z-index: 2; /* Sits on top of the image */
            font-size: 2.2rem;
            font-weight: bold;
            text-transform: capitalize;
            letter-spacing: 1px;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.9);
        }
    </style>
</head>
<body>

    <h1>muustandi gaming</h1>

    <div class="tile-container">

        <a href="slide.html" class="tile-link">
            <div class="tile">
                <img src="slide.png" alt="" class="tile-bg" onerror="this.style.display='none';">
                <div class="tile-title">slide</div>
            </div>
        </a>

        <a href="dashboard.html" class="tile-link">
            <div class="tile">
                <img src="quizer.png" alt="" class="tile-bg" onerror="this.style.display='none';">
                <div class="tile-title">quizer</div>
            </div>
        </a>

        <a href="hopper.html" class="tile-link">
            <div class="tile">
                <img src="hopper.png" alt="" class="tile-bg" onerror="this.style.display='none';">
                <div class="tile-title">hopper</div>
            </div>
        </a>

    </div>

</body>
</html>
