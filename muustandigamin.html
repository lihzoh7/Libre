<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>muustandi gaming</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Mix of Dark Blue and Black background */
            background: linear-gradient(135deg, #000000, #0a1128, #000000);
            background-attachment: fixed;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        h1 {
            font-size: 3rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 50px;
            text-shadow: 0 0 10px rgba(0, 150, 255, 0.7), 0 0 20px rgba(0, 150, 255, 0.4);
            text-align: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .tile {
            display: block;
            width: 100%;
            height: 200px;
            text-decoration: none;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
            border: 2px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
            background-color: rgba(10, 17, 40, 0.6);
        }

        /* Image layers set to pull from your uploaded pictures */
        .tile-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            transition: transform 0.5s ease;
            z-index: 1;
        }

        /* Update file extensions (.jpg, .png, etc.) if your images are different format */
        #tile-slide .tile-img {
            background-image: url('slide.jpg'); 
        }
        #tile-quizer .tile-img {
            background-image: url('quizer.jpg');
        }
        #tile-hopper .tile-img {
            background-image: url('hopper.jpg');
        }

        /* Dark overlay over images so the tile text stays easily readable */
        .tile-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.3) 100%);
            z-index: 2;
            transition: background 0.3s ease;
        }

        .tile-content {
            position: relative;
            z-index: 3;
            height: 100%;
            display: flex;
            align-items: center;
            padding: 0 40px;
        }

        .tile-title {
            font-size: 2.2rem;
            font-weight: bold;
            text-transform: capitalize;
            letter-spacing: 1px;
            color: #ffffff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            transition: color 0.3s ease, padding-left 0.3s ease;
        }

        /* Smooth Interactive Hover Effects */
        .tile:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 150, 255, 0.3);
            border-color: rgba(0, 150, 255, 0.6);
        }

        .tile:hover .tile-img {
            transform: scale(1.05);
        }

        .tile:hover .tile-overlay {
            background: linear-gradient(90deg, rgba(0, 10, 30, 0.9) 0%, rgba(0, 150, 255, 0.2) 100%);
        }

        .tile:hover .tile-title {
            color: #00d2ff;
            padding-left: 10px;
        }

        /* Responsive design for smaller screens */
        @media (max-width: 600px) {
            h1 { font-size: 2.2rem; margin-bottom: 30px; }
            .tile { height: 150px; }
            .tile-title { font-size: 1.6rem; }
            .tile-content { padding: 0 20px; }
        }
    </style>
</head>
<body>

    <h1>muustandi gaming</h1>

    <div class="container">
        <a href="slide.html" class="tile" id="tile-slide">
            <div class="tile-img"></div>
            <div class="tile-overlay"></div>
            <div class="tile-content">
                <div class="tile-title">slide</div>
            </div>
        </a>

        <a href="quizer.html" class="tile" id="tile-quizer">
            <div class="tile-img"></div>
            <div class="tile-overlay"></div>
            <div class="tile-content">
                <div class="tile-title">quizer</div>
            </div>
        </a>

        <a href="hopper.html" class="tile" id="tile-hopper">
            <div class="tile-img"></div>
            <div class="tile-overlay"></div>
            <div class="tile-content">
                <div class="tile-title">hopper</div>
            </div>
        </a>
    </div>

</body>
</html>
