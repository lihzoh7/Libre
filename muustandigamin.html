<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>muustandigamin</title>
    <style>
        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Smooth gradient background mixing dark blue and black */
            background: linear-gradient(135deg, #000000, #0a192f, #000000);
            background-attachment: fixed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        /* Heading Style */
        h1 {
            font-size: 3rem;
            margin-bottom: 40px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 150, 255, 0.7);
            text-align: center;
        }

        /* Container for the tiles */
        .tile-container {
            width: 100%;
            max-width: 1000px; /* Limits maximum width on large screens for better look */
            display: flex;
            flex-direction: column;
            gap: 25px; /* Space between the tiles */
        }

        /* Tile Link Wrapper */
        .tile-link {
            text-decoration: none;
            color: inherit;
            display: block;
            width: 100%;
        }

        /* Individual Tile Styling */
        .tile {
            position: relative;
            width: 100%;
            height: 180px; /* Height of each tile */
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #1e3a8a;
            background-color: #020617;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Hover effects for the tiles */
        .tile-link:hover .tile {
            transform: translateY(-5px);
            border-color: #3b82f6;
            box-shadow: 0 12px 25px rgba(59, 130, 246, 0.4);
        }

        /* Background Image Styling inside the tiles */
        .tile-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; /* Ensures image covers the tile nicely without distorting */
            opacity: 0.6; /* Slight transparency so text stands out */
            transition: opacity 0.3s ease;
            z-index: 1;
        }

        .tile-link:hover .tile-bg {
            opacity: 0.85; /* Brightens the image on hover */
        }

        /* Tile Text Styling */
        .tile-title {
            position: relative;
            z-index: 2; /* Sits on top of the image */
            font-size: 2.2rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.9);
        }

        /* ==========================================================================
           🎨 CUSTOM LIVE ANIMATIONS FOR TOP-UP AND BANK BACKGROUNDS
           ========================================================================== */
        
        .animated-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
            opacity: 0.5;
            transition: opacity 0.3s ease;
        }
        .tile-link:hover .animated-bg {
            opacity: 0.8;
        }

        /* --- 💼 TOP-UP WALLET ANIMATION PANEL --- */
        .wallet-container {
            position: absolute;
            bottom: 10px;
            left: 15%;
            font-size: 70px;
            animation: pulseWallet 2.5s ease-in-out infinite;
        }
        .smiley-heart {
            position: absolute;
            font-size: 32px;
            bottom: 60px;
            left: 18%;
            opacity: 0;
            animation: floatHearts 3s linear infinite;
        }
        /* Staggering the 5 variant heart delays */
        .h1 { animation-delay: 0.0s; left: 16%; }
        .h2 { animation-delay: 0.6s; left: 19%; font-size: 26px; }
        .h3 { animation-delay: 1.2s; left: 15%; font-size: 36px; }
        .h4 { animation-delay: 1.8s; left: 21%; font-size: 28px; }
        .h5 { animation-delay: 2.4s; left: 17%; font-size: 34px; }

        @keyframes pulseWallet {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.08) rotate(-3deg); }
        }
        @keyframes floatHearts {
            0% { transform: translateY(20px) translateX(0) scale(0.5); opacity: 0; }
            15% { opacity: 1; }
            80% { opacity: 0.9; }
            100% { transform: translateY(-140px) translateX(-30px) scale(1.2); opacity: 0; }
        }

        /* --- 🏧 BANK ATM DEPOSIT ANIMATION PANEL --- */
        .atm-machine {
            position: absolute;
            right: 15%;
            top: 50%;
            transform: translateY(-50%);
            font-size: 65px;
            border-bottom: 4px solid #3b82f6;
        }
        .flying-money {
            position: absolute;
            font-size: 45px;
            left: -150px;
            top: 25px;
            opacity: 0;
            animation: depositMoney 2s linear infinite;
        }
        .m1 { animation-delay: 0s; }
        .m2 { animation-delay: 0.6s; }
        .m3 { animation-delay: 1.2s; }

        @keyframes depositMoney {
            0% { transform: translateX(0) translateY(-10px) rotate(0deg) scale(1); opacity: 0; }
            10% { opacity: 1; }
            85% { opacity: 1; }
            100% { transform: translateX(160px) translateY(-5px) rotate(15deg) scale(0.4); opacity: 0; }
        }
    </style>
</head>
<body>

    <h1>muustandi gaming</h1>

    <div class="tile-container">

        <!-- SLIDE -->
        <a href="slide.html" class="tile-link">
            <div class="tile">
                <img src="slide.png" alt="" class="tile-bg" onerror="this.style.display='none';">
                <div class="tile-title">slide</div>
            </div>
        </a>
         <!-- WORDS LEADERBOARD -->
        <a href="wordboard.html" class="tile-link">
            <div class="tile">
                <img src="slide.png" alt="" class="tile-bg" onerror="this.style.display='none';">
                <div class="tile-title">slide</div>
            </div>
        </a>

        <!-- QUIZER -->
        <a href="dashboard.html" class="tile-link">
            <div class="tile">
                <img src="quizer.png" alt="" class="tile-bg" onerror="this.style.display='none';">
                <div class="tile-title">quizer</div>
            </div>
        </a>

        <!-- WORDZ -->
        <a href="words.html" class="tile-link">
            <div class="tile">
                <img src="hopper.png" alt="" class="tile-bg" onerror="this.style.display='none';">
                <div class="tile-title">hopper</div>
            </div>
        </a>

        <!-- 💼 TOP-UP WALLET TILE -->
        <a href="wallet.html" class="tile-link">
            <div class="tile">
                <div class="animated-bg">
                    <div class="wallet-container">💼</div>
                    <div class="smiley-heart h1">🥰</div>
                    <div class="smiley-heart h2">🥰</div>
                    <div class="smiley-heart h3">🥰</div>
                    <div class="smiley-heart h4">🥰</div>
                    <div class="smiley-heart h5">🥰</div>
                </div>
                <div class="tile-title">TOP-UP</div>
            </div>
        </a>

        <!-- 🏧 BANK ATM TILE -->
        <a href="bank.html" class="tile-link">
            <div class="tile">
                <div class="animated-bg">
                    <div class="atm-machine">
                        🏧
                        <div class="flying-money m1">💵</div>
                        <div class="flying-money m2">💵</div>
                        <div class="flying-money m3">💵</div>
                    </div>
                </div>
                <div class="tile-title">Bank</div>
            </div>
        </a>

    </div>

</body>
</html>
