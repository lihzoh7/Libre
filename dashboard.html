<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>
<style>
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    padding: 20px;
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background-color: #000000;
    background-image: repeating-linear-gradient(
      45deg,
      #000000,
      #000000 15px,
      #0b1d2d 15px,
      #0b1d2d 30px
    );
    color: #ffffff;
    position: relative;
  }

  /* TOP RIGHT WINNERS TAB */
  .winners-tab {
    position: absolute;
    top: 20px;
    right: 20px;
    background: #00adb5;
    color: white;
    padding: 10px 20px;
    border-radius: 8px;
    font-weight: bold;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(0, 173, 181, 0.4);
    display: none; /* Controlled by admin open eye */
    z-index: 100;
    letter-spacing: 1px;
  }
  .winners-tab:hover {
    background: #008c94;
  }

  .dashboard-container {
    width: 100%;
    max-width: 600px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .tile {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: linear-gradient(135deg, rgba(20, 30, 48, 0.95) 0%, rgba(36, 59, 85, 0.95) 100%);
    border: 2px solid #1f4068;
    border-radius: 15px;
    padding: 25px 30px;
    text-decoration: none;
    color: #ffffff;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
    transition: all 0.3s ease;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }

  .tile:hover {
    transform: translateY(-4px);
    border-color: #00adb5;
    box-shadow: 0 12px 30px rgba(0, 173, 181, 0.3);
  }

  .tile-text {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
  }

  .bars-icon {
    display: flex;
    align-items: flex-end;
    gap: 6px;
    height: 50px;
  }
  .bar {
    width: 10px;
    border-radius: 3px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.3);
  }
  .bar-1 { height: 50px; background-color: #ff4136; }
  .bar-2 { height: 41px; background-color: #ff851b; }
  .bar-3 { height: 32px; background-color: #ffdc00; }
  .bar-4 { height: 23px; background-color: #2ecc40; }
  .bar-5 { height: 14px; background-color: #0074d9; }

  .play-icon {
    font-size: 44px;
    color: #00adb5;
    text-shadow: 0 0 15px rgba(0, 173, 181, 0.6);
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.3s ease;
  }
  .tile:hover .play-icon {
    transform: scale(1.2);
  }

  .coins-icon {
    display: flex;
    align-items: center;
    position: relative;
    width: 75px;
    height: 50px;
  }
  .coin {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 14px;
    border: 2px solid rgba(255,255,255,0.4);
    box-shadow: 0 4px 8px rgba(0,0,0,0.4);
  }
  .coin-gold {
    background: radial-gradient(circle at 30% 30%, #ffe066, #f5b041);
    color: #7d6608;
    z-index: 3;
    left: 20px;
    top: 4px;
    width: 38px;
    height: 38px;
    font-size: 16px;
  }
  .coin-silver {
    background: radial-gradient(circle at 30% 30%, #ffffff, #bdc3c7);
    color: #566573;
    z-index: 2;
    left: 0px;
    top: 10px;
  }
  .coin-bronze {
    background: radial-gradient(circle at 30% 30%, #f5b041, #dc7633);
    color: #6e2c00;
    z-index: 1;
    right: 0px;
    top: 12px;
  }

  /* WINNERS FULLSCREEN MODAL VIEW */
  #winnerModal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.9);
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    padding: 20px;
    box-sizing: border-box;
  }
  #winnerModal img {
    max-width: 90%;
    max-height: 75vh;
    border-radius: 10px;
    border: 2px solid #00adb5;
    box-shadow: 0 0 20px rgba(0, 173, 181, 0.5);
  }
  .winner-date-display {
    font-size: 20px;
    color: #00adb5;
    margin-bottom: 15px;
    font-weight: bold;
    letter-spacing: 1px;
  }
  .close-modal-btn {
    margin-top: 25px;
    background: #ff4136;
    color: white;
    border: none;
    padding: 10px 25px;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    font-size: 16px;
  }
</style>
</head>
<body>

  <!-- WINNERS TAB IN UPPER RIGHT -->
  <div id="winnersTab" class="winners-tab" onclick="openWinnerModal()">Winners</div>

  <div class="dashboard-container">
    <a href="quizerleaderboard.html" class="tile">
      <span class="tile-text">Leaderboard</span>
      <div class="bars-icon">
        <div class="bar bar-1"></div>
        <div class="bar bar-2"></div>
        <div class="bar bar-3"></div>
        <div class="bar bar-4"></div>
        <div class="bar bar-5"></div>
      </div>
    </a>

    <a href="lifequizer.html" class="tile">
      <span class="tile-text">Start</span>
      <div class="play-icon">▶</div>
    </a>

    <a href="quizerprizes.html" class="tile">
      <span class="tile-text">Prizes</span>
      <div class="coins-icon">
        <div class="coin coin-silver">S</div>
        <div class="coin coin-gold">G</div>
        <div class="coin coin-bronze">B</div>
      </div>
    </a>
  </div>

  <!-- WINNERS FULLSCREEN MODAL -->
  <div id="winnerModal">
    <div id="modalDateText" class="winner-date-display"></div>
    <img id="modalWinnerImg" src="" alt="Winner Image">
    <button class="close-modal-btn" onclick="closeWinnerModal()">Back</button>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBqJTLjxhZBCsvjrTH_cG0fkXlElG6BqTg",
  authDomain: "tose-ccf8f.firebaseapp.com",
  databaseURL: "https://tose-ccf8f-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "tose-ccf8f"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const winnersTab = document.getElementById("winnersTab");
const winnerModal = document.getElementById("winnerModal");
const modalWinnerImg = document.getElementById("modalWinnerImg");
const modalDateText = document.getElementById("modalDateText");

let activeWinnerData = null;

// Listen to slideWinners state in Firebase
onValue(ref(db, "slideWinners"), (snapshot) => {
  if (snapshot.exists()) {
    const data = snapshot.val();
    let foundActive = false;

    Object.values(data).forEach(item => {
      if (item.active === true) {
        activeWinnerData = item;
        foundActive = true;
      }
    });

    if (foundActive) {
      winnersTab.style.display = "block";
    } else {
      winnersTab.style.display = "none";
      activeWinnerData = null;
    }
  } else {
    winnersTab.style.display = "none";
    activeWinnerData = null;
  }
});

window.openWinnerModal = function() {
  if (activeWinnerData) {
    modalDateText.innerText = activeWinnerData.dateTime || "";
    modalWinnerImg.src = activeWinnerData.imageUrl || "";
    winnerModal.style.display = "flex";
  }
};

window.closeWinnerModal = function() {
  winnerModal.style.display = "none";
};
</script>

</body>
</html>
