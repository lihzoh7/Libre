<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PDF Page Combiner</title>
  
  <!-- PDF.js for rendering PDF page thumbnails -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <!-- PDF-lib for merging and creating new PDFs -->
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Top Navigation Bar */
    header {
      width: 100%;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      background-color: #0d0d0d;
      z-index: 100;
      border-bottom: 1px solid #222;
    }

    .nav-btn {
      background: none;
      border: 2px solid transparent;
      color: #00e676;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      padding: 8px 16px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.2s ease;
    }

    .nav-btn:hover {
      background-color: #111;
    }

    .nav-btn.active-mode {
      border-color: #00e676;
      background-color: rgba(0, 230, 118, 0.1);
    }

    /* Main Container */
    #app {
      width: 100%;
      max-width: 1400px;
      padding: 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Upload Screen */
    #upload-screen {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 70vh;
      width: 100%;
    }

    .upload-btn {
      font-size: 28px;
      font-weight: bold;
      color: #ffffff;
      background-color: #1a1a1a;
      padding: 20px 50px;
      border: 2px dashed #444;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      letter-spacing: 2px;
    }

    .upload-btn:hover {
      border-color: #00e676;
      background-color: #252525;
      color: #00e676;
    }

    #file-input {
      display: none;
    }

    /* Grid Layout: Exactly 5 Columns */
    #pages-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 20px;
      width: 100%;
      margin-top: 10px;
    }

    /* Individual Page Item */
    .page-card {
      background-color: #141414;
      border: 3px solid #333;
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      user-select: none;
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }

    .page-card.selectable {
      cursor: pointer;
    }

    .page-card.selectable:hover {
      border-color: #666;
    }

    /* Light Green Highlight when selected */
    .page-card.selected {
      background-color: #90ee90 !important;
      border-color: #00e676 !important;
    }

    .page-card.selected .page-info {
      color: #000000;
    }

    .canvas-container {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #fff;
      border-radius: 4px;
      overflow: hidden;
    }

    canvas {
      max-width: 100%;
      height: auto;
      display: block;
    }

    .page-info {
      margin-top: 8px;
      font-size: 12px;
      color: #aaa;
      text-align: center;
      word-break: break-all;
    }

    /* Popup Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-overlay.hidden {
      display: none;
    }

    .modal-box {
      background-color: #1a1a1a;
      border: 1px solid #333;
      padding: 30px;
      border-radius: 12px;
      width: 90%;
      max-width: 450px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .modal-box h3 {
      font-size: 20px;
      color: #fff;
    }

    .modal-box input {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #444;
      background-color: #0a0a0a;
      color: #fff;
      font-size: 16px;
      outline: none;
    }

    .modal-box input:focus {
      border-color: #00b0ff;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 15px;
    }

    .cancel-btn {
      background: none;
      border: none;
      color: #888;
      cursor: pointer;
      font-size: 14px;
    }

    .cancel-btn:hover {
      color: #fff;
    }

    /* Light Blue DONE button */
    .done-btn {
      background-color: #87cefa;
      color: #000000;
      border: none;
      padding: 10px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .done-btn:hover {
      background-color: #00b0ff;
      color: #ffffff;
    }

    /* Loading overlay */
    #status-msg {
      margin-top: 15px;
      font-size: 14px;
      color: #888;
    }

    /* Responsive adjustment for small monitors */
    @media (max-width: 900px) {
      #pages-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }
    @media (max-width: 600px) {
      #pages-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>

  <!-- Navigation Bar Header -->
  <header>
    <button id="select-btn" class="nav-btn" style="display: none;">SELECT</button>
    <div id="status-msg"></div>
    <button id="make-btn" class="nav-btn" style="display: none;">MAKE</button>
  </header>

  <!-- Main Content Area -->
  <main id="app">
    <!-- Centered Upload Button Area -->
    <div id="upload-screen">
      <label for="file-input" class="upload-btn">UPLOAD</label>
      <input type="file" id="file-input" accept="application/pdf" multiple />
    </div>

    <!-- 5-Column Pages Grid -->
    <div id="pages-grid"></div>
  </main>

  <!-- Export Name Modal Popup -->
  <div id="save-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <h3>Name Your New PDF</h3>
      <input type="text" id="pdf-filename" placeholder="Enter document name..." value="Combined_Document" />
      <div class="modal-actions">
        <button id="cancel-modal-btn" class="cancel-btn">Cancel</button>
        <button id="done-btn" class="done-btn">DONE</button>
      </div>
    </div>
  </div>

  <script>
    // Initialize PDF.js worker
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    // Application State
    const uploadedFiles = []; // Array of { file, pdfLibDoc, pdfJsDoc }
    const pageReferences = []; // Array of { fileIndex, pageIndex, element, selected }
    let isSelectMode = false;

    // DOM Elements
    const fileInput = document.getElementById('file-input');
    const uploadScreen = document.getElementById('upload-screen');
    const pagesGrid = document.getElementById('pages-grid');
    const selectBtn = document.getElementById('select-btn');
    const makeBtn = document.getElementById('make-btn');
    const saveModal = document.getElementById('save-modal');
    const filenameInput = document.getElementById('pdf-filename');
    const doneBtn = document.getElementById('done-btn');
    const cancelModalBtn = document.getElementById('cancel-modal-btn');
    const statusMsg = document.getElementById('status-msg');

    // Handle File Uploads
    fileInput.addEventListener('change', async (e) => {
      const files = Array.from(e.target.files);
      if (files.length === 0) return;

      statusMsg.textContent = "Loading documents...";
      uploadScreen.style.display = 'none';
      selectBtn.style.display = 'block';
      makeBtn.style.display = 'block';

      for (const file of files) {
        if (file.type !== 'application/pdf') continue;

        const arrayBuffer = await file.arrayBuffer();
        
        // Load into PDF-lib (for merging later)
        const pdfLibDoc = await PDFLib.PDFDocument.load(arrayBuffer);
        
        // Load into PDF.js (for rendering page previews)
        const pdfJsDoc = await pdfjsLib.getDocument({ data: arrayBuffer.slice(0) }).promise;

        const fileRecordIndex = uploadedFiles.length;
        uploadedFiles.push({
          name: file.name,
          pdfLibDoc: pdfLibDoc,
          pdfJsDoc: pdfJsDoc
        });

        // Render each page into the 5-column grid
        for (let i = 1; i <= pdfJsDoc.numPages; i++) {
          await renderPageThumbnail(fileRecordIndex, i, file.name);
        }
      }

      statusMsg.textContent = "";
    });

    // Render page thumbnail to grid
    async function renderPageThumbnail(fileIndex, pageNum, fileName) {
      const pdfJsDoc = uploadedFiles[fileIndex].pdfJsDoc;
      const page = await pdfJsDoc.getPage(pageNum);

      const viewport = page.getViewport({ scale: 0.3 });
      
      const card = document.createElement('div');
      card.className = 'page-card';

      const canvasContainer = document.createElement('div');
      canvasContainer.className = 'canvas-container';

      const canvas = document.createElement('canvas');
      const context = canvas.getContext('2d');
      canvas.height = viewport.height;
      canvas.width = viewport.width;

      canvasContainer.appendChild(canvas);
      card.appendChild(canvasContainer);

      const info = document.createElement('div');
      info.className = 'page-info';
      info.textContent = `${fileName} - P.${pageNum}`;
      card.appendChild(info);

      pagesGrid.appendChild(card);

      // Store reference
      const pageObj = {
        fileIndex: fileIndex,
        pageIndex: pageNum - 1, // 0-based for PDF-lib
        element: card,
        selected: false
      };

      pageReferences.push(pageObj);

      // Handle card selection click
      card.addEventListener('click', () => {
        if (!isSelectMode) return;

        pageObj.selected = !pageObj.selected;
        if (pageObj.selected) {
          card.classList.add('selected');
        } else {
          card.classList.remove('selected');
        }
      });

      // Render thumbnail content onto canvas
      await page.render({ canvasContext: context, viewport: viewport }).promise;
    }

    // Toggle SELECT Mode
    selectBtn.addEventListener('click', () => {
      isSelectMode = !isSelectMode;
      selectBtn.classList.toggle('active-mode', isSelectMode);

      pageReferences.forEach(ref => {
        if (isSelectMode) {
          ref.element.classList.add('selectable');
        } else {
          ref.element.classList.remove('selectable');
        }
      });
    });

    // Open MAKE Modal
    makeBtn.addEventListener('click', () => {
      const selectedPages = pageReferences.filter(ref => ref.selected);
      if (selectedPages.length === 0) {
        alert("Please click SELECT first and choose at least one page to combine!");
        return;
      }
      saveModal.classList.remove('hidden');
    });

    cancelModalBtn.addEventListener('click', () => {
      saveModal.classList.add('hidden');
    });

    // Generate and Download PDF on DONE Click
    doneBtn.addEventListener('click', async () => {
      let fileName = filenameInput.value.trim();
      if (!fileName) fileName = "Combined_Document";
      if (!fileName.endsWith('.pdf')) fileName += '.pdf';

      const selectedPages = pageReferences.filter(ref => ref.selected);
      if (selectedPages.length === 0) return;

      statusMsg.textContent = "Creating PDF...";
      saveModal.classList.add('hidden');

      try {
        // Create a new blank PDF Document
        const mergedPdf = await PDFLib.PDFDocument.create();

        for (const item of selectedPages) {
          const sourcePdfLibDoc = uploadedFiles[item.fileIndex].pdfLibDoc;
          // Copy page from source document
          const [copiedPage] = await mergedPdf.copyPages(sourcePdfLibDoc, [item.pageIndex]);
          mergedPdf.addPage(copiedPage);
        }

        // Save new PDF and trigger browser download
        const pdfBytes = await mergedPdf.save();
        const blob = new Blob([pdfBytes], { type: 'application/pdf' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = fileName;
        link.click();
        URL.revokeObjectURL(link.href);

      } catch (error) {
        console.error(error);
        alert("An error occurred while building the PDF.");
      }

      statusMsg.textContent = "";
    });
  </script>
</body>
</html>
