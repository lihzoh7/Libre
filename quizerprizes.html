<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HINTS</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #001428;
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
  padding: 20px;
}

#header-title {
  font-size: 36px;
  font-weight: bold;
  color: #00f0ff;
  text-transform: uppercase;
  letter-spacing: 2px;
  margin-top: 10px;
  text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
}

#center-display {
  flex: 1;
  width: 100%;
  max-width: 700px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 20px;
}

#hint-box {
  background: #002244;
  border: 2px solid #0055a5;
  border-radius: 14px;
  padding: 32px 24px;
  width: 100%;
  min-height: 160px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  box-shadow: 0 0 20px rgba(0, 0, 0, 0.6);
}

#hint-text {
  font-size: 26px;
  font-weight: bold;
  line-height: 1.4;
  color: #ffffff;
  word-break: break-word;
}

#hint-counter {
  margin-top: 14px;
  font-size: 13px;
  color: #99ccff;
}

#nav-controls {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 20px;
  margin-bottom: 24px;
  width: 100%;
  max-width: 500px;
}

.nav-btn {
  background: #003366;
  color: #00f0ff;
  border: 2px solid #00f0ff;
  border-radius: 10px;
  padding: 12px 22px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: background 0.2s, transform 0.15s;
}

.nav-btn:hover:not(:disabled) {
  background: #0055a5;
}

.nav-btn:active:not(:disabled) {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}
</style>
</head>
<body>

  <div id="header-title">HINTS</div>

  <div id="center-display">
    <div id="hint-box">
      <div id="hint-text">Loading hints...</div>
      <div id="hint-counter"></div>
    </div>
  </div>

  <div id="nav-controls">
    <button type="button" class="nav-btn" id="prevBtn" onclick="prevHint()" disabled>
      <span>⬅️</span>
      <span>Previous</span>
    </button>
    <button type="button" class="nav-btn" id="nextBtn" onclick="nextHint()" disabled>
      <span>Next</span>
      <span>➡️</span>
    </button>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBqJTLjxhZBCsvjrTH_cG0fkXlElG6BqTg",
  authDomain: "tose-ccf8f.firebaseapp.com",
  databaseURL: "https://tose-ccf8f-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "tose-ccf8f",
  storageBucket: "tose-ccf8f.appspot.com",
  messagingSenderId: "475447495901",
  appId: "1:475447495901:web:9189276a162a3680afdf34"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let hintsList = [];
let currentIndex = 0;

const hintTextEl = document.getElementById("hint-text");
const hintCounterEl = document.getElementById("hint-counter");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");

function renderHint() {
  if (hintsList.length === 0) {
    hintTextEl.textContent = "No hints available yet.";
    hintCounterEl.textContent = "";
    prevBtn.disabled = true;
    nextBtn.disabled = true;
    return;
  }

  if (currentIndex < 0) currentIndex = 0;
  if (currentIndex >= hintsList.length) currentIndex = hintsList.length - 1;

  const currentHint = hintsList[currentIndex];
  hintTextEl.textContent = currentHint.text;
  hintCounterEl.textContent = `Hint ${currentIndex + 1} of ${hintsList.length}`;

  prevBtn.disabled = currentIndex === 0;
  nextBtn.disabled = currentIndex === hintsList.length - 1;
}

window.prevHint = function () {
  if (currentIndex > 0) {
    currentIndex--;
    renderHint();
  }
};

window.nextHint = function () {
  if (currentIndex < hintsList.length - 1) {
    currentIndex++;
    renderHint();
  }
};

onValue(ref(db, "hints"), (snapshot) => {
  const data = snapshot.val() || {};
  const loaded = [];

  for (const key in data) {
    if (data[key] && typeof data[key].text === "string" && data[key].text.trim() !== "") {
      loaded.push({
        id: key,
        text: data[key].text.trim(),
        timestamp: Number(data[key].timestamp || 0)
      });
    }
  }

  // Keep order consistent (oldest to newest)
  loaded.sort((a, b) => a.timestamp - b.timestamp);
  hintsList = loaded;

  if (currentIndex >= hintsList.length) {
    currentIndex = Math.max(0, hintsList.length - 1);
  }

  renderHint();
});
</script>

</body>
</html>
