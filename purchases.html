<!DOCTYPE html>
<html>
<head>
<title>Purchases</title>
<style>
body{background:#001f3f;color:white;font-family:Arial;}
.item{background:#003366;margin:10px;padding:10px;}
</style>
</head>

<body>

<h2>Purchases</h2>
<div id="list"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

const app = initializeApp({
  apiKey:"AIza...",
  databaseURL:"https://tose-ccf8f-default-rtdb.europe-west1.firebasedatabase.app"
});

const db = getDatabase(app);
const uid = localStorage.getItem("uid");

onValue(ref(db,"payments/history"), snap=>{
  list.innerHTML="";
  const data = snap.val()||{};

  Object.values(data).forEach(p=>{
    if(p.uid===uid){
      list.innerHTML += `
        <div class="item">
          ${p.product} - ${p.amount}<br>
          ${new Date(p.time).toLocaleString()}
        </div>
      `;
    }
  });
});
</script>

</body>
</html>
