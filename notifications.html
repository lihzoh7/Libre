<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player - Notifications</title>

<style>
body {
  margin: 0;
  background: black;
  font-family: Arial, sans-serif;
  color: white;
  padding: 20px;
}

.header-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  max-width: 800px;
  margin: 0 auto 20px auto;
  border-bottom: 2px solid #003366;
  padding-bottom: 10px;
}

.header-title {
  font-size: 22px;
  font-weight: bold;
  letter-spacing: 1px;
}

/* BACK BUTTON */
.back-btn {
  background: green;
  color: white;
  padding: 8px 16px;
  border-radius: 4px;
  cursor: pointer;
  font-weight: bold;
  text-decoration: none;
}
.back-btn:hover {
  background: #006400;
}

/* NOTIFICATIONS CONTAINER & ITEMS */
#notificationsContainer {
  max-width: 800px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.notif-card {
  background: #111;
  border: 1px solid #333;
  border-radius: 8px;
  padding: 15px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
  transition: border-color 0.2s;
}

.notif-card:hover {
  border-color: #3b82f6;
}

.notif-content-wrapper {
  flex-grow: 1;
  padding-right: 15px;
  overflow: hidden;
}

.notif-text {
  font-size: 16px;
  margin-bottom: 6px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.unread {
  font-weight: bold;
  color: #ffffff;
}

.read {
  font-weight: normal;
  color: #aaaaaa;
}

.notif-time {
  font-size: 12px;
  color: #777;
}

/* TRASH ICON BUTTON */
.trash-btn {
  background: none;
  border: none;
  color: #ff4d4d;
  font-size: 18px;
  cursor: pointer;
  padding: 5px 10px;
}
.trash-btn:hover {
  color: #ff1a1a;
}

/* FULL SCREEN MESSAGE VIEW */
#fullMessageView {
  display: none;
  max-width: 800px;
  margin: 0 auto;
  background: #111;
  border: 2px solid #3b82f6;
  border-radius: 8px;
  padding: 25px;
  box-sizing: border-box;
}

#fullMessageText {
  font-size: 18px;
  line-height: 1.5;
  word-break: break-word;
  margin-top: 15px;
  white-space: pre-wrap;
}

#fullMessageTime {
  font-size: 13px;
  color: #888;
  margin-top: 20px;
  border-top: 1px solid #222;
  padding-top: 10px;
}
</style>
</head>
<body>

  <div class="header-bar">
    <div class="header-title">NOTIFICATIONS</div>
    <a href="dashboard.html" class="back-btn" id="headerBackBtn" style="display: none;" onclick="showListView(event)">Back</a>
  </div>

  <!-- LIST VIEW -->
  <div id="notificationsContainer">
    <div style="text-align:center; color:#777;">Loading notifications...</div>
  </div>

  <!-- FULL DETAIL VIEW -->
  <div id="fullMessageView">
    <div style="font-size: 13px; color: #3b82f6; font-weight: bold; text-transform: uppercase;">Message Details</div>
    <div id="fullMessageText"></div>
    <div id="fullMessageTime"></div>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
import { getDatabase, ref, onValue, update, remove } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBqJTLjxhZBCsvjrTH_cG0fkXlElG6BqTg",
  authDomain: "tose-ccf8f.firebaseapp.com",
  databaseURL: "https://tose-ccf8f-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "tose-ccf8f"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

const container = document.getElementById("notificationsContainer");
const fullMessageView = document.getElementById("fullMessageView");
const headerBackBtn = document.getElementById("headerBackBtn");

onAuthStateChanged(auth, (user) => {
  if (user) {
    loadUserNotifications(user.uid);
  } else {
    container.innerHTML = "<div style='text-align:center; color:orange;'>Please sign in to view notifications.</div>";
  }
});

function loadUserNotifications(uid) {
  const notifRef = ref(db, `notifications/${uid}`);
  onValue(notifRef, (snapshot) => {
    container.innerHTML = "";
    if (!snapshot.exists()) {
      container.innerHTML = "<div style='text-align:center; color:#777;'>No notifications found.</div>";
      return;
    }

    const messages = [];
    snapshot.forEach((childSnapshot) => {
      messages.push({
        id: childSnapshot.key,
        ...childSnapshot.val()
      });
    });

    // Newest on top
    messages.sort((a, b) => b.timestamp - a.timestamp);

    messages.forEach((msg) => {
      const card = document.createElement("div");
      card.className = "notif-card";

      const dateStr = new Date(msg.timestamp).toLocaleString();
      const readClass = msg.read ? "read" : "unread";

      card.innerHTML = `
        <div class="notif-content-wrapper">
          <div class="notif-text ${readClass}">${msg.message}</div>
          <div class="notif-time">${dateStr}</div>
        </div>
        <button class="trash-btn" title="Delete Message" onclick="deleteNotification(event, '${uid}', '${msg.id}')">🗑️</button>
      `;

      card.onclick = () => openFullMessage(uid, msg);
      container.appendChild(card);
    });
  });
}

window.openFullMessage = async function(uid, msg) {
  // Mark as read in database
  if (!msg.read) {
    try {
      await update(ref(db, `notifications/${uid}/${msg.id}`), { read: true });
    } catch (err) {
      console.error(err);
    }
  }

  container.style.display = "none";
  fullMessageView.style.display = "block";
  headerBackBtn.style.display = "inline-block";

  document.getElementById("fullMessageText").innerText = msg.message;
  document.getElementById("fullMessageTime").innerText = "Received on: " + new Date(msg.timestamp).toLocaleString();
};

window.showListView = function(e) {
  e.preventDefault();
  fullMessageView.style.display = "none";
  headerBackBtn.style.display = "none";
  container.style.display = "flex";
};

window.deleteNotification = async function(e, uid, msgId) {
  e.stopPropagation();
  if (confirm("Are you sure you want to delete this message?")) {
    try {
      await remove(ref(db, `notifications/${uid}/${msgId}`));
    } catch (err) {
      console.error(err);
      alert("Failed to delete message.");
    }
  }
};
</script>

</body>
</html>
