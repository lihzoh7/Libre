<!DOCTYPE html>
<html>
<head>
<title>Funds</title>
<style>
body{background:#001f3f;color:white;font-family:Arial;}
.left{padding:20px;}
.item{background:#003366;margin:10px;padding:10px;}
</style>
</head>

<body>

<h2>Withdrawal Requests</h2>
<div id="list"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

const app = initializeApp({
  apiKey:"AIza...",
  databaseURL:"https://tose-ccf8f-default-rtdb.europe-west1.firebasedatabase.app"
});

const db = getDatabase(app);
const uid = localStorage.getItem("uid");

onValue(ref(db,"withdrawals"), snap=>{
  const data = snap.val()||{};
  list.innerHTML="";

  Object.values(data).forEach(w=>{
    if(w.uid===uid){
      list.innerHTML += `
        <div class="item">
          R${w.amount} - ${w.status || "waiting"}<br>
          ${new Date(w.time).toLocaleString()}
        </div>
      `;
    }
  });
});
</script>

</body>
</html>
